<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.KEY = 'enterlabrynth-mc-unit2-v1';
    this.mods = [
      { id: 'm1', color: '#39E58C', items: [
        ["Phototrophs and chemotrophs", "Where each gets its energy: light, or chemical compounds."],
        ["Redox: oxidized vs. reduced", "Who loses electrons, who gains them, and why the two always come as a pair."],
        ["Where chemical potential energy lives", "Electrons far from a pull, nonpolar C–H and C–C bonds, and why polar bonds to oxygen hold little."],
        ["Burning fuel", "Methane and hydrogen with oxygen: nonpolar in, polar out, energy out as heat and light."],
        ["The respiration equation", "C₆H₁₂O₆ + 6 O₂ → 6 CO₂ + 6 H₂O + energy-carrying molecules; what is oxidized and what is reduced."],
        ["The four stages and where they happen", "Glycolysis in the cytoplasm; pyruvate processing, the citric acid cycle and oxidative phosphorylation in the mitochondrion."],
        ["Glycolysis in three phases", "Prime, split, payoff; 2 ATP spent, 4 made, 2 NADH; net 2 ATP, 2 NADH, 2 pyruvate."],
        ["Why glycolysis spends ATP first", "Phosphates trap the sugar and make it unstable; PFK adds the second one."],
        ["NAD⁺ → NADH and FAD → FADH₂", "How the carriers are loaded, and why NADH is the reduced form."],
        ["ATP up close", "Adenine, ribose and three crowded phosphates; why that crowding stores energy."],
        ["Substrate-level phosphorylation", "An enzyme moves a phosphate from a substrate onto ADP."],
        ["Pyruvate processing", "Each pyruvate → acetyl-CoA + CO₂ + NADH; coenzyme A comes from a B vitamin."],
        ["The citric acid cycle", "Per turn 2 CO₂, 3 NADH, 1 FADH₂, 1 ATP; two turns per glucose."],
        ["Where the energy is after each stage", "Read the free-energy staircase; which molecule holds the least."],
        ["Oxidative phosphorylation", "Carriers feed the electron transport chain; oxygen is the final electron acceptor; ATP synthase."],
        ["Without oxygen", "Why the chain backs up, and what that means for the cell."],
        ["Fermentation", "Animals make lactic acid; yeast make ethanol and CO₂. Both regenerate NAD⁺, and the cell gets only glycolysis' 2 ATP."],
        ["Regulating glycolysis: PFK", "ATP at PFK's regulatory site slows it down; ADP there activates it."]
      ]}
    ];
    let done = {};
    try {
      const raw = JSON.parse(window.localStorage.getItem(this.KEY) || '{}');
      if (raw && typeof raw === 'object' && !Array.isArray(raw)) done = raw;
    } catch (e) { done = {}; }
    this.state = { done: done };
  }
  save(done) {
    try { window.localStorage.setItem(this.KEY, JSON.stringify(done)); } catch (e) {}
  }
  toggle(k) {
    const done = Object.assign({}, this.state.done);
    if (done[k]) delete done[k]; else done[k] = true;
    this.save(done);
    this.setState({ done: done });
  }
  renderVals() {
    const done = this.state.done;
    const out = {};
    let total = 0;
    let n = 0;
    this.mods.forEach((m) => {
      let c = 0;
      const items = m.items.map((pair, i) => {
        const k = m.id + '-' + i;
        const on = !!done[k];
        total++;
        if (on) { c++; n++; }
        return {
          t: pair[0],
          d: pair[1],
          aria: on ? 'true' : 'false',
          boxBorder: on ? m.color : '#5A6C8E',
          boxBg: on ? m.color : 'transparent',
          tick: on ? '1' : '0',
          titleColor: on ? '#93A2BC' : '#E8EEF8',
          deco: on ? 'line-through' : 'none',
          toggle: () => this.toggle(k)
        };
      });
      out[m.id] = items;
      out[m.id + 'count'] = c + ' / ' + items.length + ' COVERED';
    });
    out.countText = n + ' of ' + total + ' topics covered';
    out.pct = (total ? Math.round(100 * n / total) : 0) + '%';
    out.reset = () => { this.save({}); this.setState({ done: {} }); };
    return out;
  }
}
DCLite.mount(Component);
</script>
