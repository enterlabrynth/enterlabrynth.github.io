<span style="font-size: 15px; line-height: 1.55; color: #C9D3E4"><i>Rhizobium</i> fixes N₂ into NH₄⁺ for legumes; mycorrhizae deliver phosphate. Both are where those nutrients enter plants in the N and P cycles.</span>
</div>
<div style="display: flex; flex-direction: column; gap: 8px; min-width: 0; padding: 18px 20px; border-radius: 14px; background: #0E1524; border: 1px solid #22304A">
<span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; letter-spacing: 0.08em; color: #FFC23D">2.2 ↔ 2.3</span>
<span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Trophic efficiency (CE × AE × PE, about 10%) is why energy pyramids narrow and food chains stay short.</span>
</div>
<div style="display: flex; flex-direction: column; gap: 8px; min-width: 0; padding: 18px 20px; border-radius: 14px; background: #0E1524; border: 1px solid #22304A">
<span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; letter-spacing: 0.08em; color: #FFC23D">2.2 ↔ 2.3</span>
<span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Chloroplasts came from cyanobacteria, which is why photosynthesis shows up in both Bacteria and Eukarya, and never in Archaea.</span>
</div>
<div style="display: flex; flex-direction: column; gap: 8px; min-width: 0; padding: 18px 20px; border-radius: 14px; background: #0E1524; border: 1px solid #22304A">
<span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; letter-spacing: 0.08em; color: #FFC23D">2.3 ↔ 2.4</span>
<span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Limiting nutrients (N, P) cap NPP. Add too much and you get eutrophication and dead zones.</span>
</div>
<div style="display: flex; flex-direction: column; gap: 8px; min-width: 0; padding: 18px 20px; border-radius: 14px; background: #0E1524; border: 1px solid #22304A">
<span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; letter-spacing: 0.08em; color: #FFC23D">2.4 ↔ 2.5</span>
<span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Fossil fuels formed where decomposition was slow, so detritus was buried instead of respired.</span>
</div>
<div style="display: flex; flex-direction: column; gap: 8px; min-width: 0; padding: 18px 20px; border-radius: 14px; background: #0E1524; border: 1px solid #22304A">
<span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12px; letter-spacing: 0.08em; color: #FFC23D">2.3 ↔ 2.5 ↔ 2.6</span>
<span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Northern-hemisphere NPP makes CO₂ dip every summer on the Keeling curve. Warming stratifies the ocean and lowers ocean NPP.</span>

    this.save(done);

  }

    this.mods.forEach((m) => {

        const k = m.id + '-' + i;
        const on = !!done[k];
        total++;
        if (on) { c++; n++; }

          t: pair[0],

        };
