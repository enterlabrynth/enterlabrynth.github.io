n-height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid #22304A; background: #0E1524; text-decoration: none; font-size: 14.5px; color: #C9D3E4; box-shadow: inset 3px 0 0 #B18CFF">11 · Glycolysis</a><a href="#fc-slp" style="display: flex; align-items: center; min-height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid #22304A; background: #0E1524; text-decoration: none; font-size: 14.5px; color: #C9D3E4; box-shadow: inset 3px 0 0 #B18CFF">12 · Substrate-level phosphorylation</a><a href="#fc-where" style="display: flex; align-items: center; min-height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid #22304A; background: #0E1524; text-decoration: none; font-size: 14.5px; color: #C9D3E4; box-shadow: inset 3px 0 0 #B18CFF">13 · Where it happens</a><a href="#fc-pyruvate" style="display: flex; align-items: center; min-height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid #22304A; background: #0E1524; text-decoration: none; font-size: 14.5px; color: #C9D3E4; box-shadow: inset 3px 0 0 #B18CFF">14 · Pyruvate processing</a><a href="#fc-cac" style="display: flex; align-items: center; min-height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid #22304A; background: #0E1524; text-decoration: none; font-size: 14.5px; color: #C9D3E4; box-shadow: inset 3px 0 0 #B18CFF">15 · Citric acid cycle</a><a href="#fc-graph" style="display: flex; align-items: center; min-height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid #22304A; background: #0E1524; text-decoration: none; font-size: 14.5px; color: #C9D3E4; box-shadow: inset 3px 0 0 #B18CFF">16 · Where is the energy now?</a></div><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 10.5px; letter-spacing: 0.12em; color: #FF6B8F">PART 3 · THE PAYOUT</span><div style="display: flex; flex-wrap: wrap; gap: 8px"><a href="#fc-etc" style="display: flex; align-items: center; min-height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid #22304A; background: #0E1524; text-decoration: none; font-size: 14.5px; color: #C9D3E4; box-shadow: inset 3px 0 0 #FF6B8F">17 · Electron transport chain</a><a href="#fc-o2" style="display: flex; align-items: center; min-height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid #22304A; background: #0E1524; text-decoration: none; font-size: 14.5px; color: #C9D3E4; box-shadow: inset 3px 0 0 #FF6B8F">18 · Oxygen</a><a href="#fc-jam" style="display: flex; align-items: center; min-height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid #22304A; background: #0E1524; text-decoration: none; font-size: 14.5px; color: #C9D3E4; box-shadow: inset 3px 0 0 #FF6B8F">19 · No oxygen: the jam</a><a href="#fc-wallet" style="display: flex; align-items: center; min-height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid #22304A; background: #0E1524; text-decoration: none; font-size: 14.5px; color: #C9D3E4; box-shadow: inset 3px 0 0 #FF6B8F">20 · The wallet</a><a href="#fc-atp" style="display: flex; align-items: center; min-height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid #22304A; background: #0E1524; text-decoration: none; font-size: 14.5px; color: #C9D3E4; box-shadow: inset 3px 0 0 #FF6B8F">21 · ATP up close</a><a href="#fc-journey" style="display: flex; align-items: center; min-height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid #22304A; background: #0E1524; text-decoration: none; font-size: 14.5px; color: #C9D3E4; box-shadow: inset 3px 0 0 #FF6B8F">22 · The whole story</a></div></nav></div>

<span style="position: absolute; left: 13.2%; top: 12.9%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #39E58C; white-space: nowrap; text-align: center; pointer-events: none">STAGE 1</span><span style="position: absolute; left: 37.8%; top: 12.9%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #5ED0E6; white-space: nowrap; text-align: center; pointer-events: none">STAGE 2</span><span style="position: absolute; left: 62.2%; top: 12.9%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #B18CFF; white-space: nowrap; text-align: center; pointer-events: none">STAGE 3</span><span style="position: absolute; left: 86.8%; top: 12.9%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #FFC23D; white-space: nowrap; text-align: center; pointer-events: none">STAGE 4</span><span style="position: absolute; left: 13.2%; top: 92.9%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #39E58C; white-space: nowrap; text-align: center; pointer-events: none">cytoplasm</span><span style="position: absolute; left: 62.2%; top: 92.9%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #5ED0E6; white-space: nowrap; text-align: center; pointer-events: none">inside the mitochondrion</span><span style="position: absolute; left: 13.2%; top: 72.9%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #C9D3E4; white-space: nowrap; text-align: center; pointer-events: none">splits sugar</span><span style="position: absolute; left: 37.8%; top: 72.9%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #C9D3E4; white-space: nowrap; text-align: center; pointer-events: none">trims it</span><span style="position: absolute; left: 62.2%; top: 72.9%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #C9D3E4; white-space: nowrap; text-align: center; pointer-events: none">strips it</span><span style="position: absolute; left: 86.8%; top: 72.9%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #C9D3E4; white-space: nowrap; text-align: center; pointer-events: none">pays out</span>

<div class="pk-panels"><div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #39E58C">STAGE 1 · CYTOPLASM</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">Glycolysis: splitting the sugar</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">One glucose (6 carbons) is split into two pyruvate (3 carbons each)<sup class="cit"><a href="#fref-1">1</a>,<a href="#fref-2">2</a></sup>. The cell spends 2 ATP first to prime it, then makes 4, so it nets <b>2 ATP</b> and <b>2 NADH</b>.</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">No oxygen needed. Only part of glucose's energy comes out here. The two pyruvates still hold most of it.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n" for="st1-2">Next stage →</label></div></div>
<div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #5ED0E6">STAGE 2 · MITOCHONDRIAL MATRIX</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">Pyruvate prep: trimming the broken sugar</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Each pyruvate moves into the mitochondrion. One carbon is cut off and leaves as <b>CO₂</b>. The 2-carbon piece left joins coenzyme A (made from a B vitamin) to become <b>acetyl-CoA</b>.</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Each pyruvate makes <b>1 NADH</b>, so 2 per glucose.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n alt" for="st1-1">Back</label><label class="pk-n" for="st1-3">Next stage →</label></div></div>
<div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #B18CFF">STAGE 3 · MITOCHONDRIAL MATRIX</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">Citric acid cycle: the merry-go-round</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Acetyl-CoA rides into a loop of reactions that ends where it started, ready for the next one. On the way round, its 2 carbons leave as CO₂ and the energy left in them is stripped off.</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">From the 2 acetyl-CoA of one glucose: <b>6 NADH, 2 FADH₂, 2 ATP</b> and 4 CO₂<sup class="cit"><a href="#fref-1">1</a></sup>. Its real product is loaded electron carriers, not ATP.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n alt" for="st1-2">Back</label><label class="pk-n" for="st1-4">Next stage →</label></div></div>
<div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #FFC23D">STAGE 4 · INNER MITOCHONDRIAL MEMBRANE</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">Oxidative phosphorylation: the payout</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">NADH and FADH₂ hand their electrons to the electron transport chain. The electrons step down to oxygen, and the energy of each step is used to make ATP.</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">This stage makes about <b>28 ATP</b>, most of the roughly 32 a glucose gives<sup class="cit"><a href="#fref-1">1</a>,<a href="#fref-2">2</a></sup>. Steps 17 to 19 open it up.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n alt" for="st1-3">Back</label><label class="pk-n alt" for="st1-1">Start again</label></div></div></div>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 14px; min-width: 0">
<div style="display: flex; flex-direction: column; gap: 6px; padding: 16px 18px; border-radius: 14px; background: rgba(255,255,255,0.03); border: 1px solid #39E58C55"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #39E58C">THE STORY ON THIS PAGE</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Glucose holds a lot of energy, and the cell takes it apart in four stages. <b>Part 1</b> asks where that energy actually lives. <b>Part 2</b> follows the electrons as the first three stages pull them off. <b>Part 3</b> is the payout: how the cell cashes them in without burning itself up.</span></div><div style="display: flex; flex-direction: column; gap: 6px; padding: 16px 18px; border-radius: 14px; background: rgba(255,194,61,0.06); border: 1px solid #FFC23D55"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #FFC23D">THINK ABOUT IT</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Glucose goes in. CO₂ and water come out. Every carbon of glucose leaves as CO₂, and every electron ends up on oxygen. Keep those two endings in mind for the whole page.</span></div>
</div>
</div>
</section>
<div style="display: flex; gap: 14px; align-items: center; padding: 14px 18px; margin-inline: clamp(0px, 3vw, 28px); border-radius: 14px; background: #0A101D; border: 1px dashed #FFC23D88"><svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true" style="flex: none"><circle cx="22" cy="22" r="20" fill="#FFC23D1F" stroke="#FFC23D" stroke-width="2"></circle><path d="M15 17 a7 7 0 1 1 9 6.7 c-1.6 .6 -2 1.6 -2 3.3" fill="none" stroke="#FFC23D" stroke-width="2.6" stroke-linecap="round"></path><circle cx="22" cy="32" r="1.9" fill="#FFC23D"></circle></svg><div style="display: flex; flex-direction: column; gap: 4px; min-width: 0"><span style="font-size: 14.5px; line-height: 1.5; color: #93A2BC"><b style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #93A2BC">SO FAR </b>Four stages take glucose apart, and every electron ends up on oxygen.</span><span style="font-size: 16px; line-height: 1.45; color: #E8EEF8"><b style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #FFC23D">NOW WHAT? </b>Before we follow those electrons: where does the energy actually live?</span></div></div>
<div style="display: flex; flex-direction: column; gap: 8px; padding: 22px 24px; border-radius: 18px; background: #FFC23D12; border: 1px solid #FFC23D66"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.14em; color: #FFC23D">PART 1 · RETHINKING CHEMICAL POTENTIAL ENERGY</span><h2 style="margin: 0; font-family: 'Unbounded', 'Atkinson Hyperlegible', sans-serif; font-weight: 800; font-size: clamp(20px, 4.2vw, 28px); line-height: 1.15; letter-spacing: -0.02em">Where the energy actually lives</h2><p style="margin: 0; font-size: 17px; line-height: 1.55; color: #E8EEF8"><b style="color: #FFC23D">The question:</b> Why is glucose packed with energy, and water and CO₂ almost empty?</p></div>
<section id="fc-electrons" style="display: flex; flex-direction: column; gap: 18px; padding: 26px; border-radius: 22px; background: #0B1120; border: 1px solid #22304A; scroll-margin-top: 96px">
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #FFC23D">STEP 2 · ENERGY LIVES IN ELECTRONS</span>
<h2 style="margin: 0; font-family: 'Unbounded', 'Atkinson Hyperlegible', sans-serif; font-weight: 800; font-size: clamp(22px, 4.6vw, 30px); line-height: 1.15; letter-spacing: -0.03em">Where an electron sits sets its energy</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.6; color: #C9D3E4; max-width: 46em">Before we can see why glucose is fuel, we need one piece of physics: the tension between a positive nucleus and a negative electron.</p>
</div>

<h3 id="fc-electrons--c1" style="margin: 0; font-weight: 700; font-size: 19px; line-height: 1.3">One electron, three positions</h3>

<span style="position: absolute; left: 29.5%; top: 52.0%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #04140B; white-space: nowrap; text-align: center; pointer-events: none">+</span><span style="position: absolute; left: 84.5%; top: 9.0%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #FFC23D; white-space: nowrap; text-align: center; pointer-events: none">POTENTIAL ENERGY</span><span style="position: absolute; left: 84.5%; top: 92.0%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #93A2BC; white-space: nowrap; text-align: center; pointer-events: none">of the electron</span><span style="position: absolute; left: 29.5%; top: 97.0%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #8FB0FF; white-space: nowrap; text-align: center; pointer-events: none">nucleus: protons, + charge</span><span class="s s1" style="position: absolute; left: 61.0%; top: 15.0%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #FF6B8F; white-space: nowrap; text-align: center; pointer-events: none">far: band stretched</span><span class="s s2" style="position: absolute; left: 61.0%; top: 15.0%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #FFC23D; white-space: nowrap; text-align: center; pointer-events: none">falling in: snap</span><span class="s s3" style="position: absolute; left: 61.0%; top: 15.0%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #FF6B8F; white-space: nowrap; text-align: center; pointer-events: none">close: band slack</span>
</div>
<div class="pk-panels"><div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #FF6B8F">FAR</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">Far out: lots of potential energy</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">The nucleus is full of protons (+). The electron is negative, so the nucleus pulls on it. Holding the electron far from that pull is like holding a rubber band stretched<sup class="cit"><a href="#fref-1">1</a></sup>.</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">That stretch is stored energy. The farther out the electron sits, the more it has.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n" for="st2-2">Next step →</label></div></div>
<div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #FFC23D">SNAP</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">Let it move closer: energy comes out</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">If the electron gets the chance to move closer to a positive nucleus, the band snaps back. The energy it held is released<sup class="cit"><a href="#fref-1">1</a>,<a href="#fref-2">2</a></sup>.</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">This is all chemical energy is: electrons moving to spots where they are held more tightly.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n alt" for="st2-1">Back</label><label class="pk-n" for="st2-3">Next step →</label></div></div>
<div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #8FB0FF">CLOSE</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">Pulled in close: little left</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">An electron already sitting close to a strong pull has a slack band. There is little energy left to release.</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Electrons on outer levels have more potential energy than ones close to the nucleus. Electrons close to other electrons (negative charges) also have more, because like charges push apart.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n alt" for="st2-2">Back</label><label class="pk-n alt" for="st2-1">Start again</label></div></div></div>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 14px; min-width: 0">
<div style="display: flex; flex-direction: column; gap: 6px; padding: 16px 18px; border-radius: 14px; background: rgba(255,255,255,0.03); border: 1px solid #FFC23D55"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #FFC23D">THE IDEA TO HOLD</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">The energy is not in the atom. It is in <b>where the electron sits</b> compared with positive and negative charges<sup class="cit"><a href="#fref-1">1</a></sup>. Far from a nucleus = stretched band = high potential energy. Close = slack band = low.</span></div><div style="display: flex; flex-direction: column; gap: 8px; padding: 16px 18px; border-radius: 14px; background: rgba(255,255,255,0.03); border: 1px solid #8FB0FF55"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #8FB0FF">STABLE MEANS LOW ENERGY</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">A ball at the bottom of the stairs is stable: it has nowhere lower to fall. An electron held tightly is the same<sup class="cit"><a href="#fref-2">2</a></sup>. Atoms are also most stable when their outer shell is full: 2 electrons for hydrogen, 8 for carbon, nitrogen and oxygen<sup class="cit"><a href="#fref-1">1</a>,<a href="#fref-2">2</a></sup>. That is why carbon makes 4 bonds, nitrogen 3, oxygen 2 and hydrogen 1.</span><svg viewBox="0 0 400 132" role="img" aria-label="A ball at the top of a staircase is unstable and has high potential energy; at the bottom it is stable with low energy." style="display: block; width: 100%; height: auto; border-radius: 10px; margin-top: 4px"><rect width="400" height="132" fill="#0A101D"></rect><path d="M40 30 h70 v26 h70 v26 h70 v26 h120" fill="none" stroke="#93A2BC" stroke-width="2.5"></path><circle cx="75" cy="20" r="9" fill="#FFC23D"></circle><circle cx="330" cy="98" r="9" fill="#FFC23D" opacity="0.55"></circle><path class="ef-flow" d="M88 22 C 140 26, 200 60, 318 94" fill="none" stroke="#FFC23D" stroke-width="2"></path><text x="75" y="54" fill="#FFC23D" font-size="11" font-weight="700" text-anchor="middle" font-family="Atkinson Hyperlegible, system-ui, sans-serif">unstable: high</text><text x="330" y="124" fill="#C9D3E4" font-size="11" font-weight="700" text-anchor="middle" font-family="Atkinson Hyperlegible, system-ui, sans-serif">stable: low</text></svg></div>
</div>
</div>
</section>
<div style="display: flex; gap: 14px; align-items: center; padding: 14px 18px; margin-inline: clamp(0px, 3vw, 28px); border-radius: 14px; background: #0A101D; border: 1px dashed #FF6B8F88"><svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true" style="flex: none"><circle cx="22" cy="22" r="20" fill="#FF6B8F1F" stroke="#FF6B8F" stroke-width="2"></circle><path d="M15 17 a7 7 0 1 1 9 6.7 c-1.6 .6 -2 1.6 -2 3.3" fill="none" stroke="#FF6B8F" stroke-width="2.6" stroke-linecap="round"></path><circle cx="22" cy="32" r="1.9" fill="#FF6B8F"></circle></svg><div style="display: flex; flex-direction: column; gap: 4px; min-width: 0"><span style="font-size: 14.5px; line-height: 1.5; color: #93A2BC"><b style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #93A2BC">SO FAR </b>An electron far from a positive nucleus is a stretched band, full of energy.</span><span style="font-size: 16px; line-height: 1.45; color: #E8EEF8"><b style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #FF6B8F">NOW WHAT? </b>So why do some nuclei pull so much harder than others?</span></div></div>
<section id="fc-en" style="display: flex; flex-direction: column; gap: 18px; padding: 26px; border-radius: 22px; background: #0B1120; border: 1px solid #22304A; scroll-margin-top: 96px">
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #FF6B8F">STEP 3 · GETTING INTO THE WEEDS OF ELECTRONEGATIVITY</span>
<h2 style="margin: 0; font-family: 'Unbounded', 'Atkinson Hyperlegible', sans-serif; font-weight: 800; font-size: clamp(22px, 4.6vw, 30px); line-height: 1.15; letter-spacing: -0.03em">Why some atoms pull harder</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.6; color: #C9D3E4; max-width: 46em">Most definitions stop at "electronegativity is an atom's tendency to attract electrons." That says what, not why. Here is the why: count the protons, and see what stands between them and the electrons.</p>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(420px, 100%), 1fr)); gap: 18px; align-items: start">
<div style="display: flex; flex-direction: column; gap: 12px; min-width: 0; padding: 20px; border-radius: 16px; background: #0E1524; border: 1px solid #22304A">
<span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #93A2BC">INTERACTIVE · TAP AN ATOM</span>
<h3 id="fc-en--c1" style="margin: 0; font-weight: 700; font-size: 19px; line-height: 1.3">Five atoms, one question: how hard is the pull?</h3>
<div class="pk step" id="st3"><input class="pk-r" type="radio" name="st3" id="st3-1" aria-label="H"><input class="pk-r" type="radio" name="st3" id="st3-2" aria-label="C"><input class="pk-r" type="radio" name="st3" id="st3-3" aria-label="N"><input class="pk-r" type="radio" name="st3" id="st3-4" aria-label="O"><input class="pk-r" type="radio" name="st3" id="st3-5" aria-label="S · one row down">
<span class="pk-hint"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11V5a1.6 1.6 0 0 1 3.2 0v5"></path><path d="M12.2 10V8.4a1.6 1.6 0 0 1 3.2 0V11"></path><path d="M15.4 11v-.6a1.6 1.6 0 0 1 3.2 0V15a6 6 0 0 1-6 6h-1.2a5.6 5.6 0 0 1-4.6-2.4L4 14.6a1.6 1.6 0 0 1 2.6-1.8L9 15"></path></svg>Tap the buttons, or Next atom, to click through all 5</span>
<div class="pk-bar"><label class="pk-l l1" for="st3-1" style="color: #E8EEF8"><span>H</span></label><label class="pk-l l2" for="st3-2" style="color: #93A2BC"><span>C</span></label><label class="pk-l l3" for="st3-3" style="color: #8FB0FF"><span>N</span></label><label class="pk-l l4" for="st3-4" style="color: #FF6B8F"><span>O</span></label><label class="pk-l l5" for="st3-5" style="color: #FFC23D"><span>S · one row down</span></label></div>
<div class="pk-fig">

, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #FFC23D; white-space: nowrap; text-align: center; pointer-events: none">outer electrons feel about +5</span><span class="s s4" style="position: absolute; left: 29.0%; top: 50.5%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #04140B; white-space: nowrap; text-align: center; pointer-events: none">+8</span><span class="s s4" style="position: absolute; left: 79.5%; top: 15.9%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #E8EEF8; white-space: nowrap; text-align: center; pointer-events: none">O</span><span class="s s4" style="position: absolute; left: 79.5%; top: 30.8%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #8FB0FF; white-space: nowrap; text-align: center; pointer-events: none">8 protons</span><span class="s s4" style="position: absolute; left: 79.5%; top: 42.1%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #93A2BC; white-space: nowrap; text-align: center; pointer-events: none">2 inner electrons</span><span class="s s4" style="position: absolute; left: 79.5%; top: 53.3%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #FFC23D; white-space: nowrap; text-align: center; pointer-events: none">outer electrons feel about +6</span><span class="s s5" style="position: absolute; left: 29.0%; top: 50.5%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #04140B; white-space: nowrap; text-align: center; pointer-events: none">+16</span><span class="s s5" style="position: absolute; left: 79.5%; top: 15.9%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #E8EEF8; white-space: nowrap; text-align: center; pointer-events: none">S</span><span class="s s5" style="position: absolute; left: 79.5%; top: 30.8%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #8FB0FF; white-space: nowrap; text-align: center; pointer-events: none">16 protons</span><span class="s s5" style="position: absolute; left: 79.5%; top: 42.1%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #93A2BC; white-space: nowrap; text-align: center; pointer-events: none">10 inner electrons</span><span class="s s5" style="position: absolute; left: 79.5%; top: 53.3%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #FFC23D; white-space: nowrap; text-align: center; pointer-events: none">about +6, one shell farther</span><span style="position: absolute; left: 79.5%; top: 65.4%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #93A2BC; white-space: nowrap; text-align: center; pointer-events: none">PULL ON SHARED ELECTRONS</span><span style="position: absolute; left: 79.5%; top: 85.0%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #93A2BC; white-space: nowrap; text-align: center; pointer-events: none">weaker → stronger</span>

<div class="pk-panels"><div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #E8EEF8">HYDROGEN</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">1 proton, but nothing in the way</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Hydrogen's nucleus is a single proton, so its pull is small. But its electron sits in the first shell, very close, with no other electrons in between.</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Small pull, very close. It ends up about level with carbon<sup class="cit"><a href="#fref-3">3</a></sup>.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n" for="st3-2">Next atom →</label></div></div>
<div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #93A2BC">CARBON</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">6 protons, 2 of them hidden</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Carbon has 6 protons. Its 2 inner electrons sit between the nucleus and the outer shell and cancel out about 2 of them. The outer electrons, the ones that form bonds, feel a pull of about +4.</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Carbon and hydrogen pull about equally<sup class="cit"><a href="#fref-3">3</a></sup>. Remember this: it is why C–H bonds share electrons evenly.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n alt" for="st3-1">Back</label><label class="pk-n" for="st3-3">Next atom →</label></div></div>
<div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #8FB0FF">NITROGEN</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">One more proton, same shell</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Nitrogen has 7 protons. The outer electrons are in the same shell as carbon's, but now they feel about +5.</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">A stronger pull at the same distance draws the shell in tighter<sup class="cit"><a href="#fref-2">2</a></sup>. That is why atoms get smaller across a row: <b>the protons make the radius small</b>.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n alt" for="st3-2">Back</label><label class="pk-n" for="st3-4">Next atom →</label></div></div>
<div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #FF6B8F">OXYGEN</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">The strongest pull in biology</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Oxygen has 8 protons. Its outer electrons feel about +6, still in the second shell, close to the nucleus.</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">So oxygen is the most electronegative atom in biological molecules<sup class="cit"><a href="#fref-3">3</a></sup>. In any bond with carbon or hydrogen, the shared electrons are dragged toward oxygen.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n alt" for="st3-3">Back</label><label class="pk-n" for="st3-5">Next atom →</label></div></div>
<div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #FFC23D">SULFUR</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">More protons, but weaker. Why?</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Sulfur has 16 protons, twice oxygen's. But 10 inner electrons in two shells cancel out most of them, and its outer shell is one level farther out.</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">About the same net pull, from farther away, is a weaker grip. So sulfur is less electronegative than oxygen even with more protons<sup class="cit"><a href="#fref-3">3</a></sup>.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n alt" for="st3-4">Back</label><label class="pk-n alt" for="st3-1">Start again</label></div></div></div>

<div style="display: flex; flex-direction: column; gap: 6px; padding: 16px 18px; border-radius: 14px; background: rgba(255,255,255,0.03); border: 1px solid #FFC23D55"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #FFC23D">SO, IS IT PROTONS OR RADIUS?</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">You are right that it starts with the protons. Electronegativity is how hard a nucleus pulls on shared electrons, and the protons do the pulling. The full answer has two parts:<br><b>1 · How much charge the electrons feel</b>: protons minus the inner electrons that cancel some of them.<br><b>2 · How far away they are</b>: a pull gets weaker with distance.<br>Across a row, the protons win and also shrink the atom. Down a column, a new shell farther out wins, so the pull drops.</span></div><div style="display: flex; flex-direction: column; gap: 6px; padding: 16px 18px; border-radius: 14px; background: rgba(94,208,230,0.06); border: 1px solid #5ED0E655"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #5ED0E6">ADDED FROM OUTSIDE THE COURSE MATERIALS</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">The textbook explains the row: more protons hold electrons more tightly. The idea that inner electrons cancel part of the nucleus (called <b>shielding</b>, or effective nuclear charge) is from general chemistry, not the slides. The +4, +5 and +6 are a simple count (protons minus inner electrons), not measured values.</span></div><details id="fc-en--t1" style="padding: 0 14px; border-radius: 12px; background: #0E1524; border: 1px solid #22304A"><summary style="cursor: pointer; padding-block: 12px; font-weight: 700; font-size: 15px; line-height: 1.4">Rank the atoms of life by electronegativity, the way the slides do.</summary><p style="margin: 0; padding-bottom: 14px; font-size: 15px; line-height: 1.55; color: #C9D3E4">O > N, S, P > C ≈ H. Oxygen is the most electronegative; carbon and hydrogen are about equal.</p></details>
</div>

<p style="margin: 0; font-size: 16px; line-height: 1.6; color: #C9D3E4; max-width: 46em">In a covalent bond two atoms share a pair of electrons. Who pulls harder decides where that pair sits, and so how much energy the bond holds.</p>

HINK ABOUT IT</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">A stable molecule is one with nothing left to give. CO₂ and water are the exhaust: every electron is already pulled toward oxygen.</span></div>

8" font-size="17" font-weight="800" text-anchor="middle" font-family="Atkinson Hyperlegible, system-ui, sans-serif">C</text><text x="92" y="189.4" fill="#8FB0FF" font-size="15" font-weight="800" text-anchor="middle" font-family="Atkinson Hyperlegible, system-ui, sans-serif">H</text><text x="208" y="189.4" fill="#FF6B8F" font-size="15" font-weight="800" text-anchor="middle" font-family="Atkinson Hyperlegible, system-ui, sans-serif">OH</text><text x="150" y="236.12" fill="#E8EEF8" font-size="17" font-weight="800" text-anchor="middle" font-family="Atkinson Hyperlegible, system-ui, sans-serif">C</text><text x="92" y="235.4" fill="#8FB0FF" font-size="15" font-weight="800" text-anchor="middle" font-family="Atkinson Hyperlegible, system-ui, sans-serif">H</text><text x="208" y="235.4" fill="#FF6B8F" font-size="15" font-weight="800" text-anchor="middle" font-family="Atkinson Hyperlegible, system-ui, sans-serif">OH</text><text x="154" y="287.4" fill="#C9D3E4" font-size="15" font-weight="800" text-anchor="middle" font-family="Atkinson Hyperlegible, system-ui, sans-serif">CH₂OH</text><text x="136" y="298" fill="#FFC23D" font-size="10" font-weight="800" text-anchor="middle" font-family="Atkinson Hyperlegible, system-ui, sans-serif">N</text><text x="170" y="298" fill="#FF6B8F" font-size="10" font-weight="800" text-anchor="middle" font-family="Atkinson Hyperlegible, system-ui, sans-serif">P</text><rect x="262" y="40" width="124" height="60" rx="10" fill="#FFC23D14" stroke="#FFC23D"></rect><text x="324" y="64" fill="#FFC23D" font-size="12" font-weight="700" text-anchor="middle" font-family="Atkinson Hyperlegible, system-ui, sans-serif">N · nonpolar</text><text x="324" y="84" fill="#C9D3E4" font-size="11" font-weight="700" text-anchor="middle" font-family="Atkinson Hyperlegible, system-ui, sans-serif">C–C, C–H</text><rect x="262" y="112" width="124" height="60" rx="10" fill="#FF6B8F14" stroke="#FF6B8F"></rect><text x="324" y="136" fill="#FF6B8F" font-size="12" font-weight="700" text <div class="pk-panels"><div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #39E58C">THE FUEL</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">Let's look at a molecule of glucose</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Here is glucose as a straight chain: six carbons, each with H and OH groups, and a C=O at the top<sup class="cit"><a href="#fref-1">1</a></sup>. (In water most glucose closes into a ring, but the bonds are the same.)</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Two questions from the slide: what types of bonds do you see, and are they polar or nonpolar?</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n" for="stg-2">Next step →</label></div></div>
<div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #FFC23D">N</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">The loaded bonds: C–C and C–H</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Every carbon–carbon and carbon–hydrogen bond is <b>nonpolar</b><sup class="cit"><a href="#fref-1">1</a></sup>. Carbon and hydrogen pull about equally (Step 3), so these are the stretched bands that store glucose's energy.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n alt" for="stg-1">Back</label><label class="pk-n" for="stg-3">Next step →</label></div></div>
<div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #FF6B8F">P</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">The spent bonds: anything touching oxygen</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Every bond to oxygen, C–O, C=O and the O–H inside each OH, is <b>polar</b><sup class="cit"><a href="#fref-1">1</a></sup>. Oxygen already holds those electrons close, so there is little energy left in them.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n alt" for="stg-2">Back</label><label class="pk-n" for="stg-4">Next step →</label></div></div>
<div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #E8EEF8">THE ANSWER</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">Are electrons equally shared?</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4"><b>Yes for nonpolar bonds, no for polar bonds</b><sup class="cit"><a href="#fref-1">1</a></sup>. The dots show it: in the middle of every N bond, pulled toward O in every P bond.</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">So glucose is mostly loaded, with some carbon already partly oxidized. The slides call it a sugar with "some reduced carbon"<sup class="cit"><a href="#fref-1">1</a></sup>. Respiration's job is to turn every N bond into a bond to oxygen.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n alt" for="stg-3">Back</label><label class="pk-n alt" for="stg-1">Start again</label></div></div></div>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 14px; min-width: 0">
<div style="display: flex; flex-direction: column; gap: 6px; padding: 16px 18px; border-radius: 14px; background: rgba(255,255,255,0.03); border: 1px solid #FFC23D55"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #FFC23D">WHY THIS MATTERS</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">The more C–H and C–C bonds a molecule has, the more fuel it is. CO₂ has none left. Glucose is somewhere in between: loaded, but not as loaded as methane, because it already has some oxygen.</span></div><details id="fc-glucose--t1" style="padding: 0 14px; border-radius: 12px; background: #0E1524; border: 1px solid #22304A"><summary style="cursor: pointer; padding-block: 12px; font-weight: 700; font-size: 15px; line-height: 1.4">Which bonds in glucose hold the most potential energy?</summary><p style="margin: 0; padding-bottom: 14px; font-size: 15px; line-height: 1.55; color: #C9D3E4">The nonpolar ones: C–H and C–C. Their shared electrons sit in the middle, far from both nuclei.</p></details>
</div>
</div>

<div class="pk-panels"><div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #6E9BFF">WATER</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">Every shared pair already pulled to oxygen</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Each dot is an outer electron. Water's two O–H bonds each share a pair, and oxygen keeps two more pairs of its own (lone pairs).</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Look where the shared dots sit: right next to the O. Oxygen has won both tugs of war. The tension is released, so water is stable and low in energy. That is why it puts fires out instead of feeding them.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n" for="st5-2">Next molecule →</label></div></div>
<div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #93A2BC">CARBON DIOXIDE</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">Carbon has been stripped</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Carbon is double bonded to each oxygen: two shared pairs per bond. All four pairs are dragged toward the oxygens, leaving carbon slightly positive.</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">This is carbon with as little potential energy as it can have. It is where every carbon of glucose ends up.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n alt" for="st5-1">Back</label><label class="pk-n" for="st5-3">Next molecule →</label></div></div>
<div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #FFC23D">METHANE</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">Four bonds, all stretched</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Methane is a carbon with four hydrogens. Carbon and hydrogen pull about equally, so every shared pair sits dead in the middle of its bond, far from both nuclei. Of the molecules on the slide (CH₄, H₂O, NaCl, NH₃, CO₂), it holds the most potential energy<sup class="cit"><a href="#fref-1">1</a></sup>.</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">The humming is our picture of all that stored tension: four bands pulled back, waiting to snap.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n alt" for="st5-2">Back</label><label class="pk-n alt" for="st5-1">Start again</label></div></div></div>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 14px; min-width: 0">
<div style="display: flex; flex-direction: column; gap: 6px; padding: 16px 18px; border-radius: 14px; background: rgba(255,255,255,0.03); border: 1px solid #FFC23D55"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #FFC23D">HOW TO READ THE DOTS</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Each dot is one outer electron. Two dots on a bond line are the pair the two atoms share. Two dots beside a letter are a lone pair, kept by that atom. Watch <b>where on the line</b> the shared pair sits: in the middle means an even tug of war, next to O means oxygen is winning.</span></div><div style="display: flex; flex-direction: column; gap: 6px; padding: 16px 18px; border-radius: 14px; background: rgba(255,255,255,0.03); border: 1px solid #FFC23D55"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #FFC23D">WHY WE BURN IT: NATURAL GAS</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Methane is the main gas in natural gas. On a gas stove, CH₄ + 2 O₂ → CO₂ + 2 H₂O. Every shared pair moves from the middle of a C–H bond to the oxygen end of a bond, the bands snap, and the energy leaves as heat and light. Glucose is full of the same C–H and C–C bonds.</span></div><div style="display: flex; flex-direction: column; gap: 6px; padding: 16px 18px; border-radius: 14px; background: rgba(255,107,143,0.06); border: 1px solid #FF6B8F55"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #FF6B8F">COMMON MIX-UP</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Lewis dots show where electrons are, not the shape. Water is really bent, not a straight line. And the shaking is a picture: the stored energy is in <b>where the electrons sit</b>, not in the motion.</span></div><div style="display: flex; flex-direction: column; gap: 6px; padding: 16px 18px; border-radius: 14px; background: rgba(94,208,230,0.06); border: 1px solid #5ED0E655"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #5ED0E6">ADDED FROM OUTSIDE THE COURSE MATERIALS</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Natural gas and the stove equation are general chemistry, not from the slides.</span></div><details id="fc-lewis--t1" style="padding: 0 14px; border-radius: 12px; background: #0E1524; border: 1px solid #22304A"><summary style="cursor: pointer; padding-block: 12px; font-weight: 700; font-size: 15px; line-height: 1.4">NH₃ and NaCl were also on the slide. Why are they lower than CH₄?</summary><p style="margin: 0; padding-bottom: 14px; font-size: 15px; line-height: 1.55; color: #C9D3E4">N–H bonds are polar: nitrogen pulls the shared pair toward itself. In NaCl, chlorine has taken sodium's electron completely. In both, electrons already sit close to a strong pull.</p></details>
</div>

<section id="fc-snap" style="display: flex; flex-direction: column; gap: 18px; padding: 26px; border-radius: 22px; background: #0B1120; border: 1px solid #22304A; scroll-margin-top: 96px">

<span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #FF6B8F">STEP 7 · THE SNAP</span>
<h2 style="margin: 0; font-family: 'Unbounded', 'Atkinson Hyperlegible', sans-serif; font-weight: 800; font-size: clamp(22px, 4.6vw, 30px); line-height: 1.15; letter-spacing: -0.03em">If glucose let go all at once</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.6; color: #C9D3E4; max-width: 46em">We now know where the energy is: in electrons held far from a strong pull. Let them fall toward oxygen, and the bands snap. The question is how fast.</p>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(420px, 100%), 1fr)); gap: 18px; align-items: start">
<div style="display: flex; flex-direction: column; gap: 12px; min-width: 0; padding: 20px; border-radius: 16px; background: #0E1524; border: 1px solid #22304A">
<span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #93A2BC">INTERACTIVE · TAP NEXT STEP</span>

50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #FFC23D; white-space: nowrap; text-align: center; pointer-events: none">each step caught:</span><span class="s s2" style="position: absolute; left: 65.5%; top: 46.7%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #FFC23D; white-space: nowrap; text-align: center; pointer-events: none">NADH or ATP</span><span class="s s2" style="position: absolute; left: 37.5%; top: 88.6%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #FF6B8F; white-space: nowrap; text-align: center; pointer-events: none">a little heat each step</span>

<div class="pk-panels"><div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #FF6B8F">ALL AT ONCE</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">A match in gasoline</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Toss a match into gasoline and its energy comes out at once, as an explosion of heat and light. None of it does useful work<sup class="cit"><a href="#fref-2">2</a></sup>.</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">If a cell let glucose's energy out in one go, most of it would leave as heat, far more than the cell could use, and the cell could not harness it<sup class="cit"><a href="#fref-2">2</a></sup>.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n" for="st6-2">Next step →</label></div></div>
<div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #FFC23D">IN SMALL STEPS</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">A staircase instead of a cliff</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Cells take glucose apart in many small reactions<sup class="cit"><a href="#fref-1">1</a>,<a href="#fref-2">2</a></sup>. Each releases a little energy, small enough to catch in a carrier molecule (NADH, FADH₂) or in ATP.</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Some energy still leaves as heat at every step. About a third of glucose's energy ends up in ATP<sup class="cit"><a href="#fref-2">2</a></sup>, better than a car engine.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n alt" for="st6-1">Back</label><label class="pk-n alt" for="st6-1">Start again</label></div></div></div>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 14px; min-width: 0">
<div style="display: flex; flex-direction: column; gap: 6px; padding: 16px 18px; border-radius: 14px; background: rgba(255,255,255,0.03); border: 1px solid #FF6B8F55"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #FF6B8F">NOW WHAT?</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Glucose is loaded. Oxygen is waiting to pull its electrons in. If the bands all snapped at once, the cell would get a burst of heat and nothing it could use. <b>Part 2 is how the cell harnesses the snap step by step.</b></span></div><div style="display: flex; flex-direction: column; gap: 6px; padding: 16px 18px; border-radius: 14px; background: rgba(255,107,143,0.06); border: 1px solid #FF6B8F55"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #FF6B8F">COMMON MIX-UP</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">The energy is not in the breaking. Breaking a bond takes energy <i>in</i>. The energy comes out when electrons settle into new bonds closer to oxygen: C–C becomes C–O<sup class="cit"><a href="#fref-1">1</a></sup>. Respiration is a change of bonds, from loaded to relaxed.</span></div>
</div>
</div>
</section>
<div style="display: flex; flex-direction: column; gap: 8px; padding: 22px 24px; border-radius: 18px; background: #B18CFF12; border: 1px solid #B18CFF66"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.14em; color: #B18CFF">PART 2 · CATCHING THE ELECTRONS</span><h2 style="margin: 0; font-family: 'Unbounded', 'Atkinson Hyperlegible', sans-serif; font-weight: 800; font-size: clamp(20px, 4.2vw, 28px); line-height: 1.15; letter-spacing: -0.02em">Harnessing the explosion: the first three stages</h2><p style="margin: 0; font-size: 17px; line-height: 1.55; color: #E8EEF8"><b style="color: #B18CFF">The question:</b> If letting glucose's electrons fall all at once would only make heat, how does a cell pull them off in small steps, and where?</p></div>
<section id="fc-redox" style="display: flex; flex-direction: column; gap: 18px; padding: 26px; border-radius: 22px; background: #0B1120; border: 1px solid #22304A; scroll-margin-top: 96px">
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #B18CFF">STEP 8 · REDOX</span>
<h2 style="margin: 0; font-family: 'Unbounded', 'Atkinson Hyperlegible', sans-serif; font-weight: 800; font-size: clamp(22px, 4.6vw, 30px); line-height: 1.15; letter-spacing: -0.03em">Electrons are always handed over in pairs of reactions</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.6; color: #C9D3E4; max-width: 46em">To harness the snap, the cell needs a way to move electrons in small, controlled hops. That way is the redox reaction.</p>

<div class="pk-panels"><div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #FFC23D">BEFORE</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">A is loaded, B is empty</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Molecule A has electrons with a lot of potential energy. Molecule B pulls harder<sup class="cit"><a href="#fref-1">1</a></sup>.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n" for="st7-2">Next step →</label></div></div>
<div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #E8EEF8">THE HAND-OFF</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">Electrons go straight from one to the other</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">The electrons move from A directly onto B. They never float free on their own.</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Redox reactions happen whenever a chemical reaction takes place in the cell: electrons are moving, and moving electrons around transfers energy<sup class="cit"><a href="#fref-1">1</a></sup>.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n alt" for="st7-1">Back</label><label class="pk-n" for="st7-3">Next step →</label></div></div>
<div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #B18CFF">AFTER</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">One oxidized, one reduced, always together</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">A lost electrons: it is <b>oxidized</b>. B gained them: it is <b>reduced</b>. LEO says GER: Loses Electrons, Oxidation. Gains Electrons, Reduction<sup class="cit"><a href="#fref-1">1</a>,<a href="#fref-2">2</a></sup>.</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">One cannot happen without the other. That is why they are called redox reactions, and why they are always coupled.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n alt" for="st7-2">Back</label><label class="pk-n" for="st7-4">Next step →</label></div></div>
<div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #8FB0FF">A FULL HAND-OFF</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">Salt: sodium gives its electron away</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Sodium hands its single outer electron to chlorine. Sodium becomes Na⁺ (oxidized), chlorine becomes Cl⁻ (reduced)<sup class="cit"><a href="#fref-1">1</a></sup>.</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Chlorine pulls so much harder that it takes the electron completely. That is an ionic bond, the extreme end of the tug of war in Part 1.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n alt" for="st7-3">Back</label><label class="pk-n" for="st7-5">Next step →</label></div></div>
<div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #39E58C">THE GENERAL RULE</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">Xe⁻ + Y → X + Ye⁻</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Any redox reaction has this shape. X starts with the electron (the donor) and ends oxidized. Y ends with it (the acceptor) and is reduced<sup class="cit"><a href="#fref-1">1</a></sup>.</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">In cells the electron usually travels with a proton, as a hydrogen atom. So in biology, losing H usually means oxidized and gaining H means reduced.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n alt" for="st7-4">Back</label><label class="pk-n alt" for="st7-1">Start again</label></div></div></div>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 14px; min-width: 0">
<div style="display: flex; flex-direction: column; gap: 6px; padding: 16px 18px; border-radius: 14px; background: rgba(255,255,255,0.03); border: 1px solid #B18CFF55"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #B18CFF">WHY ALWAYS COUPLED?</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">An electron has to go somewhere. It cannot just leave a molecule into nothing. So if one molecule loses electrons, another must gain them: electron donors are always paired with electron acceptors<sup class="cit"><a href="#fref-1">1</a>,<a href="#fref-2">2</a></sup>. The cell uses this: it lets glucose's electrons fall a little at a time, from one molecule to the next, each hand-off a small snap.</span></div><div style="display: flex; flex-direction: column; gap: 6px; padding: 16px 18px; border-radius: 14px; background: rgba(255,255,255,0.03); border: 1px solid #FF6B8F55"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #FF6B8F">WHY NOT LET ELECTRONS LOOSE?</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Loose high-energy electrons are dangerous. When they escape and land on oxygen too early, they make reactive oxygen species, which damage lipids, proteins and DNA<sup class="cit"><a href="#fref-2">2</a></sup>. So the cell keeps its electrons on a leash: always on a carrier, always handed straight to the next.</span></div><div style="display: flex; flex-direction: column; gap: 6px; padding: 16px 18px; border-radius: 14px; background: rgba(94,208,230,0.06); border: 1px solid #5ED0E655"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #5ED0E6">ADDED FROM OUTSIDE THE COURSE MATERIALS</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">The textbook describes reactive oxygen species in chloroplasts. That electrons leaking from our own electron transport chain make them too is general biology, not from the slides.</span></div><div style="display: flex; flex-direction: column; gap: 6px; padding: 16px 18px; border-radius: 14px; background: rgba(255,107,143,0.06); border: 1px solid #FF6B8F55"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #FF6B8F">COMMON MIX-UP</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4"><b>Reduced</b> sounds like less, but a reduced molecule <i>gained</i> electrons and holds <i>more</i> energy.</span></div>
</div>
</div>
</section>
<div style="display: flex; gap: 14px; align-items: center; padding: 14px 18px; margin-inline: clamp(0px, 3vw, 28px); border-radius: 14px; background: #0A101D; border: 1px dashed #39E58C88"><svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true" style="flex: none"><circle cx="22" cy="22" r="20" fill="#39E58C1F" stroke="#39E58C" stroke-width="2"></circle><path d="M15 17 a7 7 0 1 1 9 6.7 c-1.6 .6 -2 1.6 -2 3.3" fill="none" stroke="#39E58C" stroke-width="2.6" stroke-linecap="round"></path><circle cx="22" cy="32" r="1.9" fill="#39E58C"></circle></svg><div style="display: flex; flex-direction: column; gap: 4px; min-width: 0"><span style="font-size: 14.5px; line-height: 1.5; color: #93A2BC"><b style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #93A2BC">SO FAR </b>Electrons are always handed straight from one molecule to another.</span><span style="font-size: 16px; line-height: 1.45; color: #E8EEF8"><b style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #39E58C">NOW WHAT? </b>So who hands electrons to whom in respiration?</span></div></div>
<section id="fc-overall" style="display: flex; flex-direction: column; gap: 18px; padding: 26px; border-radius: 22px; background: #0B1120; border: 1px solid #22304A; scroll-margin-top: 96px">
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #39E58C">STEP 9 · RESPIRATION IS ONE BIG REDOX</span>
<h2 style="margin: 0; font-family: 'Unbounded', 'Atkinson Hyperlegible', sans-serif; font-weight: 800; font-size: clamp(22px, 4.6vw, 30px); line-height: 1.15; letter-spacing: -0.03em">Glucose gives the electrons, oxygen takes them</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.6; color: #C9D3E4; max-width: 46em">Zoom out. The whole of respiration is one redox reaction, done in many small steps.</p>

="middle" font-family="Atkinson Hyperlegible, system-ui, sans-serif">NAD⁺</text><text x="225" y="214" fill="#B18CFF" font-size="11" font-weight="700" text-anchor="middle" font-family="Atkinson Hyperlegible, system-ui, sans-serif">carriers</text><text x="330" y="214" fill="#FF6B8F" font-size="11" font-weight="700" text-anchor="middle" font-family="Atkinson Hyperlegible, system-ui, sans-serif">O₂</text></g>

<div class="pk-panels"><div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #E8EEF8">ONE BIG REDOX</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">The whole of respiration in one line</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">C₆H₁₂O₆ + 6 O₂ → 6 CO₂ + 6 H₂O + energy<sup class="cit"><a href="#fref-1">1</a>,<a href="#fref-2">2</a></sup>. Read it as a redox: something loses electrons and something gains them.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n" for="sto-2">Next step →</label></div></div>
<div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #39E58C">OXIDATION</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">Glucose → CO₂</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">In glucose, the C–H and C–C pairs sit in the middle. In CO₂, every pair is pulled toward oxygen. Carbon has partly lost its electrons: glucose is <b>oxidized</b><sup class="cit"><a href="#fref-2">2</a></sup>. Glucose is the original electron donor<sup class="cit"><a href="#fref-1">1</a></sup>.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n alt" for="sto-1">Back</label><label class="pk-n" for="sto-3">Next step →</label></div></div>
<div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #FF6B8F">REDUCTION</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">O₂ → H₂O</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">In O₂ the two oxygens share their electrons equally. In water, oxygen pulls the shared pairs toward itself, because it is more electronegative than hydrogen. Oxygen has partly gained electrons: it is <b>reduced</b><sup class="cit"><a href="#fref-1">1</a>,<a href="#fref-2">2</a></sup>. Oxygen is the final electron acceptor.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n alt" for="sto-2">Back</label><label class="pk-n" for="sto-4">Next step →</label></div></div>
<div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #FFC23D">NOT IN ONE JUMP</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">Electrons move molecule to molecule</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">The electrons do not jump from glucose to oxygen in one go. They move from one molecule to the next by many redox reactions<sup class="cit"><a href="#fref-1">1</a></sup>: onto NAD⁺, through the carriers of the chain, and only at the very end onto oxygen.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n alt" for="sto-3">Back</label><label class="pk-n alt" for="sto-1">Start again</label></div></div></div>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 14px; min-width: 0">
<div style="display: flex; flex-direction: column; gap: 6px; padding: 16px 18px; border-radius: 14px; background: rgba(255,255,255,0.03); border: 1px solid #FF6B8F55"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #FF6B8F">OXYGEN IS LOADED TOO</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">It is not only glucose that holds energy. O₂'s double bond is relatively weak, so oxygen is a high-energy molecule as well, and much of the energy released in respiration comes from it being reduced<sup class="cit"><a href="#fref-2">2</a></sup>.</span></div><details id="fc-overall--t1" style="padding: 0 14px; border-radius: 12px; background: #0E1524; border: 1px solid #22304A"><summary style="cursor: pointer; padding-block: 12px; font-weight: 700; font-size: 15px; line-height: 1.4">In C₆H₁₂O₆ + 6 O₂ → 6 CO₂ + 6 H₂O, which molecule is oxidized and which is reduced?</summary><p style="margin: 0; padding-bottom: 14px; font-size: 15px; line-height: 1.55; color: #C9D3E4">Glucose is oxidized (its carbons end up in CO₂, electrons pulled away). Oxygen is reduced (it ends up in water, pulling electrons toward itself).</p></details>
</div>
</div>

<h2 style="margin: 0; font-family: 'Unbounded', 'Atkinson Hyperlegible', sans-serif; font-weight: 800; font-size: clamp(22px, 4.6vw, 30px); line-height: 1.15; letter-spacing: -0.03em">The first catch: loading the shuttles</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.6; color: #C9D3E4; max-width: 46em">Each small step in taking glucose apart is a redox reaction, and NAD⁺ is waiting to catch the electrons.</p>

<div class="pk-panels"><div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #39E58C">BEFORE</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">A loaded sugar meets an empty shuttle</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">One carbon in the sugar holds an H and an OH. NAD⁺ is a general electron acceptor in many reactions, an empty shuttle<sup class="cit"><a href="#fref-1">1</a></sup>.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n" for="st8-2">Next step →</label></div></div>
<div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #FFC23D">THE HAND-OFF</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">A dehydrogenase pulls off 2 H</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">An enzyme called a <b>dehydrogenase</b> (it removes hydrogen) takes 2 hydrogen atoms from the food molecule: 2 electrons and 2 protons<sup class="cit"><a href="#fref-1">1</a></sup>.</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">NAD⁺ takes both electrons and one proton. The other proton floats off into the solution.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n alt" for="st8-1">Back</label><label class="pk-n" for="st8-3">Next step →</label></div></div>
<div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #6E9BFF">AFTER</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">C=O and NADH</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">H–C–OH + NAD⁺ → C=O + NADH + H⁺<sup class="cit"><a href="#fref-1">1</a>,<a href="#fref-2">2</a></sup>. The sugar carbon is now oxidized: its electrons are pulled toward oxygen in a C=O. NAD⁺ is reduced to NADH, which stores the energy for later synthesis of ATP.</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Quick test: more C–H bonds means more reduced, more energy. Fewer means oxidized.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n alt" for="st8-2">Back</label><label class="pk-n" for="st8-4">Next step →</label></div></div>
<div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #5ED0E6">THE OTHER SHUTTLE</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">FAD becomes FADH₂</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">FAD works the same way, but it keeps both protons: FAD + 2 e⁻ + 2 H⁺ → FADH₂<sup class="cit"><a href="#fref-1">1</a>,<a href="#fref-2">2</a></sup>.</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">NADH and FADH₂ are the reduced, loaded forms. NAD⁺ and FAD are the oxidized, empty forms. The reduced forms have lots of potential energy.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n alt" for="st8-3">Back</label><label class="pk-n alt" for="st8-1">Start again</label></div></div></div>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 14px; min-width: 0">
<div style="display: flex; flex-direction: column; gap: 6px; padding: 16px 18px; border-radius: 14px; background: rgba(255,255,255,0.03); border: 1px solid #6E9BFF55"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #6E9BFF">NAD⁺ AND FAD: THE SHUTTLES</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">NAD⁺ is short for nicotinamide adenine dinucleotide: two nucleotides joined together. NAD⁺ and FAD carry high-energy electrons from glucose to the electron transport chain<sup class="cit"><a href="#fref-1">1</a>,<a href="#fref-2">2</a></sup>. Once they drop their electrons off, they go back for more.</span></div><div style="display: flex; flex-direction: column; gap: 6px; padding: 16px 18px; border-radius: 14px; background: rgba(255,255,255,0.03); border: 1px solid #39E58C55"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #39E58C">WHERE THIS HAPPENS</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Glycolysis, pyruvate processing and the citric acid cycle (Steps 11 to 15) are mostly a long series of these hand-offs. By the end, one glucose has loaded 10 NADH and 2 FADH₂.</span></div><div style="display: flex; flex-direction: column; gap: 6px; padding: 16px 18px; border-radius: 14px; background: rgba(255,194,61,0.06); border: 1px solid #FFC23D55"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #FFC23D">THINK ABOUT IT</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">You don't need to memorize the structures of NAD⁺ or FAD. Recognize them as different flavors of nucleotides that can carry high-energy electrons.</span></div>
</div>
</div>
</section>
<div style="display: flex; gap: 14px; align-items: center; padding: 14px 18px; margin-inline: clamp(0px, 3vw, 28px); border-radius: 14px; background: #0A101D; border: 1px dashed #39E58C88"><svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true" style="flex: none"><circle cx="22" cy="22" r="20" fill="#39E58C1F" stroke="#39E58C" stroke-width="2"></circle><path d="M15 17 a7 7 0 1 1 9 6.7 c-1.6 .6 -2 1.6 -2 3.3" fill="none" stroke="#39E58C" stroke-width="2.6" stroke-linecap="round"></path><circle cx="22" cy="32" r="1.9" fill="#39E58C"></circle></svg><div style="display: flex; flex-direction: column; gap: 4px; min-width: 0"><span style="font-size: 14.5px; line-height: 1.5; color: #93A2BC"><b style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #93A2BC">SO FAR </b>NAD⁺ and FAD catch the electrons and become NADH and FADH₂.</span><span style="font-size: 16px; line-height: 1.45; color: #E8EEF8"><b style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #39E58C">NOW WHAT? </b>Now follow glucose itself. Where are the electrons pulled off?</span></div></div>

<span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #39E58C">STEP 11 · STAGE 1 · GLYCOLYSIS</span>
<h2 style="margin: 0; font-family: 'Unbounded', 'Atkinson Hyperlegible', sans-serif; font-weight: 800; font-size: clamp(22px, 4.6vw, 30px); line-height: 1.15; letter-spacing: -0.03em">Glycolysis: spend 2, earn 4</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.6; color: #C9D3E4; max-width: 46em">Now follow glucose itself. The first stage happens in the cytoplasm and splits the sugar in half.</p>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(420px, 100%), 1fr)); gap: 18px; align-items: start">
<div style="display: flex; flex-direction: column; gap: 12px; min-width: 0; padding: 20px; border-radius: 16px; background: #0E1524; border: 1px solid #22304A">
<span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #93A2BC">INTERACTIVE · TAP NEXT STEP</span>
