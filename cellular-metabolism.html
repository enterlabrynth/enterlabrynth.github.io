r: 1px solid #22304A; background: #0E1524; text-decoration: none; font-size: 14.5px; color: #C9D3E4; box-shadow: inset 3px 0 0 #B18CFF">11 · No oxygen: the jam</a><a href="#fc-12" style="display: flex; align-items: center; min-height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid #22304A; background: #0E1524; text-decoration: none; font-size: 14.5px; color: #C9D3E4; box-shadow: inset 3px 0 0 #B18CFF">12 · The wallet</a><a href="#fc-13" style="display: flex; align-items: center; min-height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid #22304A; background: #0E1524; text-decoration: none; font-size: 14.5px; color: #C9D3E4; box-shadow: inset 3px 0 0 #B18CFF">13 · ATP up close</a></div></nav></div>

 font-weight: 700; color: #C9D3E4; white-space: nowrap; text-align: center; pointer-events: none">trims it</span><span style="position: absolute; left: 62.2%; top: 72.9%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #C9D3E4; white-space: nowrap; text-align: center; pointer-events: none">strips it</span><span style="position: absolute; left: 86.8%; top: 72.9%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #C9D3E4; white-space: nowrap; text-align: center; pointer-events: none">pays out</span>

<div class="pk-panels"><div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #39E58C">STAGE 1 · CYTOPLASM</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">Glycolysis: splitting the sugar</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">One glucose (6 carbons) is split into two pyruvate (3 carbons each)<sup class="cit"><a href="#fref-1">1</a>,<a href="#fref-2">2</a></sup>. The cell spends 2 ATP first to prime it, then makes 4, so it nets <b>2 ATP</b> and <b>2 NADH</b>.</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">No oxygen needed. Only part of glucose's energy comes out here. The two pyruvates still hold most of it.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n" for="st1-2">Next stage →</label></div></div>
<div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #5ED0E6">STAGE 2 · MITOCHONDRIAL MATRIX</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">Pyruvate prep: trimming the broken sugar</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Each pyruvate moves into the mitochondrion. One carbon is cut off and leaves as <b>CO₂</b>. The 2-carbon piece left joins coenzyme A (made from a B vitamin) to become <b>acetyl-CoA</b>.</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Each pyruvate makes <b>1 NADH</b>, so 2 per glucose.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n alt" for="st1-1">Back</label><label class="pk-n" for="st1-3">Next stage →</label></div></div>
<div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #B18CFF">STAGE 3 · MITOCHONDRIAL MATRIX</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">Citric acid cycle: the merry-go-round</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Acetyl-CoA rides into a loop of reactions that ends where it started, ready for the next one. On the way round, its 2 carbons leave as CO₂ and the energy left in them is stripped off.</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">From the 2 acetyl-CoA of one glucose: <b>6 NADH, 2 FADH₂, 2 ATP</b> and 4 CO₂<sup class="cit"><a href="#fref-1">1</a></sup>. Its real product is loaded electron carriers, not ATP.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n alt" for="st1-2">Back</label><label class="pk-n" for="st1-4">Next stage →</label></div></div>
<div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #FFC23D">STAGE 4 · INNER MITOCHONDRIAL MEMBRANE</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">Oxidative phosphorylation: the payout</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">NADH and FADH₂ hand their electrons to the electron transport chain. The electrons step down to oxygen, and the energy of each step is used to make ATP.</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">This stage makes about <b>28 ATP</b>, most of the roughly 32 a glucose gives<sup class="cit"><a href="#fref-1">1</a>,<a href="#fref-2">2</a></sup>. Steps 9 to 11 open it up.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n alt" for="st1-3">Back</label><label class="pk-n alt" for="st1-1">Start again</label></div></div></div>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 6px; padding: 16px 18px; border-radius: 14px; background: rgba(255,255,255,0.03); border: 1px solid #39E58C55"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #39E58C">THE STORY ON THIS PAGE</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Glucose holds a lot of energy, and the cell takes it apart in four stages. <b>Part 1</b> asks where that energy actually lives. <b>Part 2</b> asks how a cell catches it without burning itself up.</span></div><div style="display: flex; flex-direction: column; gap: 6px; padding: 16px 18px; border-radius: 14px; background: rgba(255,194,61,0.06); border: 1px solid #FFC23D55"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #FFC23D">THINK ABOUT IT</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Glucose goes in. CO₂ and water come out. Every carbon of glucose leaves as CO₂, and every electron ends up on oxygen. Keep those two endings in mind for the whole page.</span></div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px; padding: 22px 24px; border-radius: 18px; background: #FFC23D12; border: 1px solid #FFC23D66"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.14em; color: #FFC23D">PART 1 · RETHINKING CHEMICAL POTENTIAL ENERGY</span><h2 style="margin: 0; font-family: 'Unbounded', 'Atkinson Hyperlegible', sans-serif; font-weight: 800; font-size: clamp(20px, 4.2vw, 28px); line-height: 1.15; letter-spacing: -0.02em">Where the energy actually lives</h2><p style="margin: 0; font-size: 17px; line-height: 1.55; color: #E8EEF8"><b style="color: #FFC23D">The question:</b> Why is glucose packed with energy, and water and CO₂ almost empty?</p></div>
<section id="fc-2" style="display: flex; flex-direction: column; gap: 18px; padding: 26px; border-radius: 22px; background: #0B1120; border: 1px solid #22304A; scroll-margin-top: 96px">
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #FFC23D">STEP 2 · ENERGY LIVES IN ELECTRONS</span>
<h2 style="margin: 0; font-family: 'Unbounded', 'Atkinson Hyperlegible', sans-serif; font-weight: 800; font-size: clamp(22px, 4.6vw, 30px); line-height: 1.15; letter-spacing: -0.03em">Where an electron sits sets its energy</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.6; color: #C9D3E4; max-width: 46em">Before we can see why glucose is fuel, we need one piece of physics: the tension between a positive nucleus and a negative electron.</p>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(420px, 100%), 1fr)); gap: 18px; align-items: start">

<span style="position: absolute; left: 29.5%; top: 52.0%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #04140B; white-space: nowrap; text-align: center; pointer-events: none">+</span><span style="position: absolute; left: 84.5%; top: 9.0%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #FFC23D; white-space: nowrap; text-align: center; pointer-events: none">POTENTIAL ENERGY</span><span style="position: absolute; left: 84.5%; top: 92.0%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #93A2BC; white-space: nowrap; text-align: center; pointer-events: none">of the electron</span><span style="position: absolute; left: 29.5%; top: 97.0%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #8FB0FF; white-space: nowrap; text-align: center; pointer-events: none">nucleus: protons, + charge</span><span class="s s1" style="position: absolute; left: 61.0%; top: 15.0%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #FF6B8F; white-space: nowrap; text-align: center; pointer-events: none">far: band stretched</span><span class="s s2" style="position: absolute; left: 61.0%; top: 15.0%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #FFC23D; white-space: nowrap; text-align: center; pointer-events: none">falling in: snap</span><span class="s s3" style="position: absolute; left: 61.0%; top: 15.0%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #FF6B8F; white-space: nowrap; text-align: center; pointer-events: none">close: band slack</span>

<div class="pk-panels"><div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #FF6B8F">FAR</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">Far out: lots of potential energy</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">The nucleus is full of protons (+). The electron is negative, so the nucleus pulls on it. Holding the electron far from that pull is like holding a rubber band stretched<sup class="cit"><a href="#fref-1">1</a></sup>.</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">That stretch is stored energy. The farther out the electron sits, the more it has.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n" for="st2-2">Next step →</label></div></div>
<div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #FFC23D">SNAP</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">Let it move closer: energy comes out</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">If the electron gets the chance to move closer to a positive nucleus, the band snaps back. The energy it held is released<sup class="cit"><a href="#fref-1">1</a>,<a href="#fref-2">2</a></sup>.</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">This is all chemical energy is: electrons moving to spots where they are held more tightly.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n alt" for="st2-1">Back</label><label class="pk-n" for="st2-3">Next step →</label></div></div>
<div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #8FB0FF">CLOSE</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">Pulled in close: little left</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">An electron already sitting close to a strong pull has a slack band. There is little energy left to release.</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Electrons on outer levels have more potential energy than ones close to the nucleus. Electrons close to other electrons (negative charges) also have more, because like charges push apart.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n alt" for="st2-2">Back</label><label class="pk-n alt" for="st2-1">Start again</label></div></div></div>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 14px; min-width: 0">
<div style="display: flex; flex-direction: column; gap: 6px; padding: 16px 18px; border-radius: 14px; background: rgba(255,255,255,0.03); border: 1px solid #FFC23D55"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #FFC23D">THE IDEA TO HOLD</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">The energy is not in the atom. It is in <b>where the electron sits</b> compared with positive and negative charges<sup class="cit"><a href="#fref-1">1</a></sup>. Far from a nucleus = stretched band = high potential energy. Close = slack band = low.</span></div><div style="display: flex; flex-direction: column; gap: 6px; padding: 16px 18px; border-radius: 14px; background: rgba(255,255,255,0.03); border: 1px solid #8FB0FF55"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #8FB0FF">STABLE MEANS LOW ENERGY</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">A ball at the bottom of the stairs is stable: it has nowhere lower to fall. An electron held tightly is the same<sup class="cit"><a href="#fref-2">2</a></sup>. Atoms are also most stable when their outer shell is full: 2 electrons for hydrogen, 8 for carbon, nitrogen and oxygen<sup class="cit"><a href="#fref-1">1</a>,<a href="#fref-2">2</a></sup>. That is why carbon makes 4 bonds, nitrogen 3, oxygen 2 and hydrogen 1.</span></div>
</div>

<span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #FF6B8F">STEP 3 · GETTING INTO THE WEEDS OF ELECTRONEGATIVITY</span>

<p style="margin: 0; font-size: 16px; line-height: 1.6; color: #C9D3E4; max-width: 46em">Most definitions stop at "electronegativity is an atom's tendency to attract electrons." That says what, not why. Here is the why: count the protons, and see what stands between them and the electrons.</p>

: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #8FB0FF; white-space: nowrap; text-align: center; pointer-events: none">6 protons</span><span class="s s2" style="position: absolute; left: 79.5%; top: 42.1%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #93A2BC; white-space: nowrap; text-align: center; pointer-events: none">2 inner electrons</span><span class="s s2" style="position: absolute; left: 79.5%; top: 53.3%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #FFC23D; white-space: nowrap; text-align: center; pointer-events: none">outer electrons feel about +4</span><span class="s s3" style="position: absolute; left: 29.0%; top: 50.5%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #04140B; white-space: nowrap; text-align: center; pointer-events: none">+7</span><span class="s s3" style="position: absolute; left: 79.5%; top: 15.9%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #E8EEF8; white-space: nowrap; text-align: center; pointer-events: none">N</span><span class="s s3" style="position: absolute; left: 79.5%; top: 30.8%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #8FB0FF; white-space: nowrap; text-align: center; pointer-events: none">7 protons</span><span class="s s3" style="position: absolute; left: 79.5%; top: 42.1%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #93A2BC; white-space: nowrap; text-align: center; pointer-events: none">2 inner electrons</span><span class="s s3" style="position: absolute; left: 79.5%; top: 53.3%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #FFC23D; white-space: nowrap; text-align: center; pointer-events: none">outer electrons feel about +5</span><span class="s s4" style="position: absolute; left: 29.0%; top: 50.5%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #04140B; white-space: nowrap; text-align: center; pointer-events: none">+8</span><span class="s s4" style="position: absolute; left: 79.5%; top: 15.9%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #E8EEF8; white-space: nowrap; text-align: center; pointer-events: none">O</span><span class="s s4" style="position: absolute; left: 79.5%; top: 30.8%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #8FB0FF; white-space: nowrap; text-align: center; pointer-events: none">8 protons</span><span class="s s4" style="position: absolute; left: 79.5%; top: 42.1%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #93A2BC; white-space: nowrap; text-align: center; pointer-events: none">2 inner electrons</span><span class="s s4" style="position: absolute; left: 79.5%; top: 53.3%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #FFC23D; white-space: nowrap; text-align: center; pointer-events: none">outer electrons feel about +6</span><span class="s s5" style="position: absolute; left: 29.0%; top: 50.5%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #04140B; white-space: nowrap; text-align: center; pointer-events: none">+16</span><span class="s s5" style="position: absolute; left: 79.5%; top: 15.9%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #E8EEF8; white-space: nowrap; text-align: center; pointer-events: none">S</span><span class="s s5" style="position: absolute; left: 79.5%; top: 30.8%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #8FB0FF; white-space: nowrap; text-align: center; pointer-events: none">16 protons</span><span class="s s5" style="position: absolute; left: 79.5%; top: 42.1%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #93A2BC; white-space: nowrap; text-align: center; pointer-events: none">10 inner electrons</span><span class="s s5" style="position: absolute; left: 79.5%; top: 53.3%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #FFC23D; white-space: nowrap; text-align: center; pointer-events: none">about +6, one shell farther</span><span style="position: absolute; left: 79.5%; top: 65.4%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #93A2BC; white-space: nowrap; text-align: center; pointer-events: none">PULL ON SHARED ELECTRONS</span><span style="position: absolute; left: 79.5%; top: 85.0%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #93A2BC; white-space: nowrap; text-align: center; pointer-events: none">weaker → stronger</span>

<div class="pk-panels"><div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #E8EEF8">HYDROGEN</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">1 proton, but nothing in the way</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Hydrogen's nucleus is a single proton, so its pull is small. But its electron sits in the first shell, very close, with no other electrons in between.</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Small pull, very close. It ends up about level with carbon<sup class="cit"><a href="#fref-3">3</a></sup>.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n" for="st3-2">Next atom →</label></div></div>
<div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #93A2BC">CARBON</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">6 protons, 2 of them hidden</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Carbon has 6 protons. Its 2 inner electrons sit between the nucleus and the outer shell and cancel out about 2 of them. The outer electrons, the ones that form bonds, feel a pull of about +4.</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Carbon and hydrogen pull about equally<sup class="cit"><a href="#fref-3">3</a></sup>. Remember this: it is why C–H bonds share electrons evenly.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n alt" for="st3-1">Back</label><label class="pk-n" for="st3-3">Next atom →</label></div></div>
<div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #8FB0FF">NITROGEN</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">One more proton, same shell</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Nitrogen has 7 protons. The outer electrons are in the same shell as carbon's, but now they feel about +5.</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">A stronger pull at the same distance draws the shell in tighter<sup class="cit"><a href="#fref-2">2</a></sup>. That is why atoms get smaller across a row: <b>the protons make the radius small</b>.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n alt" for="st3-2">Back</label><label class="pk-n" for="st3-4">Next atom →</label></div></div>
<div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #FF6B8F">OXYGEN</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">The strongest pull in biology</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Oxygen has 8 protons. Its outer electrons feel about +6, still in the second shell, close to the nucleus.</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">So oxygen is the most electronegative atom in biological molecules<sup class="cit"><a href="#fref-3">3</a></sup>. In any bond with carbon or hydrogen, the shared electrons are dragged toward oxygen.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n alt" for="st3-3">Back</label><label class="pk-n" for="st3-5">Next atom →</label></div></div>
<div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #FFC23D">SULFUR</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">More protons, but weaker. Why?</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Sulfur has 16 protons, twice oxygen's. But 10 inner electrons in two shells cancel out most of them, and its outer shell is one level farther out.</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">About the same net pull, from farther away, is a weaker grip. So sulfur is less electronegative than oxygen even with more protons<sup class="cit"><a href="#fref-3">3</a></sup>.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n alt" for="st3-4">Back</label><label class="pk-n alt" for="st3-1">Start again</label></div></div></div>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 14px; min-width: 0">
<div style="display: flex; flex-direction: column; gap: 6px; padding: 16px 18px; border-radius: 14px; background: rgba(255,255,255,0.03); border: 1px solid #FFC23D55"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #FFC23D">SO, IS IT PROTONS OR RADIUS?</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">You are right that it starts with the protons. Electronegativity is how hard a nucleus pulls on shared electrons, and the protons do the pulling. The full answer has two parts:<br><b>1 · How much charge the electrons feel</b>: protons minus the inner electrons that cancel some of them.<br><b>2 · How far away they are</b>: a pull gets weaker with distance.<br>Across a row, the protons win and also shrink the atom. Down a column, a new shell farther out wins, so the pull drops.</span></div><div style="display: flex; flex-direction: column; gap: 6px; padding: 16px 18px; border-radius: 14px; background: rgba(94,208,230,0.06); border: 1px solid #5ED0E655"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #5ED0E6">ADDED FROM OUTSIDE THE COURSE MATERIALS</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">The textbook explains the row: more protons hold electrons more tightly. The idea that inner electrons cancel part of the nucleus (called <b>shielding</b>, or effective nuclear charge) is from general chemistry, not the slides. The +4, +5 and +6 are a simple count (protons minus inner electrons), not measured values.</span></div><details id="fc-3--t1" style="padding: 0 14px; border-radius: 12px; background: #0E1524; border: 1px solid #22304A"><summary style="cursor: pointer; padding-block: 12px; font-weight: 700; font-size: 15px; line-height: 1.4">Rank the atoms of life by electronegativity, the way the slides do.</summary><p style="margin: 0; padding-bottom: 14px; font-size: 15px; line-height: 1.55; color: #C9D3E4">O > N, S, P > C ≈ H. Oxygen is the most electronegative; carbon and hydrogen are about equal.</p></details>
</div>

<span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #FFC23D">STEP 4 · TENSION IN A BOND</span>
<h2 style="margin: 0; font-family: 'Unbounded', 'Atkinson Hyperlegible', sans-serif; font-weight: 800; font-size: clamp(22px, 4.6vw, 30px); line-height: 1.15; letter-spacing: -0.03em">Nonpolar vs. polar: where the shared electrons sit</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.6; color: #C9D3E4; max-width: 46em">In a covalent bond two atoms share a pair of electrons. Who pulls harder decides where that pair sits, and so how much energy the bond holds.</p>

: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #8FB0FF; white-space: nowrap; text-align: center; pointer-events: none">δ+</span><span class="s s1" style="position: absolute; left: 43.0%; top: 15.8%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #E8EEF8; white-space: nowrap; text-align: center; pointer-events: none">NONPOLAR C–H</span><span class="s s2" style="position: absolute; left: 43.0%; top: 15.8%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #E8EEF8; white-space: nowrap; text-align: center; pointer-events: none">POLAR O–H</span><span style="position: absolute; left: 87.5%; top: 9.5%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #FFC23D; white-space: nowrap; text-align: center; pointer-events: none">ENERGY</span><span style="position: absolute; left: 87.5%; top: 95.8%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #93A2BC; white-space: nowrap; text-align: center; pointer-events: none">in the bond</span>

<div class="pk-panels"><div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #FFC23D">NONPOLAR COVALENT</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">C–H: a tug of war nobody wins</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Carbon and hydrogen pull about equally, so the shared electrons sit in the middle, far from both nuclei<sup class="cit"><a href="#fref-1">1</a>,<a href="#fref-2">2</a></sup>.</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Both bands stay stretched. The electrons are held loosely, so the bond holds <b>lots of potential energy</b>. C–C bonds are the same.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n" for="st4-2">Next step →</label></div></div>
<div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #FF6B8F">POLAR COVALENT</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">O–H: oxygen wins the tug of war</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Oxygen pulls much harder, so the shared electrons sit close to the oxygen nucleus. Oxygen becomes slightly negative (δ−) and hydrogen slightly positive (δ+).</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Oxygen's band is slack. The electrons are already held tightly, so the bond holds <b>little potential energy</b><sup class="cit"><a href="#fref-1">1</a></sup>. It is stable. C=O bonds are the same.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n alt" for="st4-1">Back</label><label class="pk-n alt" for="st4-1">Start again</label></div></div></div>

<div style="display: flex; flex-direction: column; gap: 6px; padding: 16px 18px; border-radius: 14px; background: rgba(255,255,255,0.03); border: 1px solid #FFC23D55"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #FFC23D">THE TENSION, IN ONE LINE</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Even sharing keeps electrons far from a strong pull: high tension, high energy. Uneven sharing lets them sit close to oxygen: tension released, low energy<sup class="cit"><a href="#fref-1">1</a></sup>.</span></div><div style="display: flex; flex-direction: column; gap: 6px; padding: 16px 18px; border-radius: 14px; background: rgba(255,255,255,0.03); border: 1px solid #39E58C55"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #39E58C">WHERE OUR ENERGY COMES FROM</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">We cannot turn sunlight into chemical energy the way plants do. So we eat molecules full of nonpolar bonds and turn them into molecules with polar bonds, like CO₂ and H₂O. Changing bonds from nonpolar to polar releases energy<sup class="cit"><a href="#fref-1">1</a></sup>.</span></div><div style="display: flex; flex-direction: column; gap: 6px; padding: 16px 18px; border-radius: 14px; background: rgba(255,194,61,0.06); border: 1px solid #FFC23D55"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #FFC23D">THINK ABOUT IT</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">A stable molecule is one with nothing left to give. CO₂ and water are the "exhaust": every electron is already pulled toward oxygen.</span></div>

r: #E8EEF8; white-space: nowrap; text-align: center; pointer-events: none">C</span><span class="s s3" style="position: absolute; left: 42.5%; top: 20.0%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #E8EEF8; white-space: nowrap; text-align: center; pointer-events: none">H</span><span class="s s3" style="position: absolute; left: 57.0%; top: 49.0%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #E8EEF8; white-space: nowrap; text-align: center; pointer-events: none">H</span><span class="s s3" style="position: absolute; left: 42.5%; top: 78.0%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #E8EEF8; white-space: nowrap; text-align: center; pointer-events: none">H</span><span class="s s3" style="position: absolute; left: 28.0%; top: 49.0%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #E8EEF8; white-space: nowrap; text-align: center; pointer-events: none">H</span><span class="s s3" style="position: absolute; left: 42.5%; top: 93.0%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #FFC23D; white-space: nowrap; text-align: center; pointer-events: none">CH₄ · shared evenly, loaded</span><span style="position: absolute; left: 87.5%; top: 9.0%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #FFC23D; white-space: nowrap; text-align: center; pointer-events: none">ENERGY</span><span style="position: absolute; left: 87.5%; top: 91.0%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #93A2BC; white-space: nowrap; text-align: center; pointer-events: none">in the bonds</span>

<div class="pk-panels"><div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #6E9BFF">WATER</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">Every electron already pulled to oxygen</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Water's two bonds are both O–H. In each, the shared pair sits close to oxygen. Oxygen also keeps two lone pairs of its own.</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">The tension is already released. Water is stable and low in energy, which is why it puts fires out instead of feeding them.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n" for="st5-2">Next molecule →</label></div></div>
<div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #93A2BC">CARBON DIOXIDE</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">Carbon has been stripped</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Carbon is double bonded to two oxygens. All four of its shared pairs are dragged toward oxygen, leaving carbon slightly positive.</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">This is carbon with as little potential energy as it can have. It is where every carbon of glucose ends up.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n alt" for="st5-1">Back</label><label class="pk-n" for="st5-3">Next molecule →</label></div></div>
<div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #FFC23D">METHANE</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">Four bonds, all stretched</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Methane is a carbon with four hydrogens. Carbon and hydrogen pull about equally, so all four pairs sit in the middle of their bonds, far from both nuclei. Of the molecules on the slide (CH₄, H₂O, NaCl, NH₃, CO₂), it holds the most potential energy<sup class="cit"><a href="#fref-1">1</a></sup>.</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">The shaking is our picture of all that stored tension, a band pulled back and waiting to snap.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n alt" for="st5-2">Back</label><label class="pk-n alt" for="st5-1">Start again</label></div></div></div>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 14px; min-width: 0">
<div style="display: flex; flex-direction: column; gap: 6px; padding: 16px 18px; border-radius: 14px; background: rgba(255,255,255,0.03); border: 1px solid #FFC23D55"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #FFC23D">WHY WE BURN IT: NATURAL GAS</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Methane is the main gas in natural gas. On a gas stove, CH₄ + 2 O₂ → CO₂ + 2 H₂O. Every electron moves from an even C–H bond to a bond pulled toward oxygen, the bands snap, and the energy leaves as heat and light. Glucose is full of the same C–H and C–C bonds.</span></div><div style="display: flex; flex-direction: column; gap: 6px; padding: 16px 18px; border-radius: 14px; background: rgba(255,107,143,0.06); border: 1px solid #FF6B8F55"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #FF6B8F">COMMON MIX-UP</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">The shaking is a picture, not the energy itself. Molecules really do vibrate, but the stored chemical energy is in <b>where the electrons sit</b>, not in the motion.</span></div><div style="display: flex; flex-direction: column; gap: 6px; padding: 16px 18px; border-radius: 14px; background: rgba(94,208,230,0.06); border: 1px solid #5ED0E655"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #5ED0E6">ADDED FROM OUTSIDE THE COURSE MATERIALS</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Natural gas and the stove equation are general chemistry, not from the slides.</span></div><details id="fc-5--t1" style="padding: 0 14px; border-radius: 12px; background: #0E1524; border: 1px solid #22304A"><summary style="cursor: pointer; padding-block: 12px; font-weight: 700; font-size: 15px; line-height: 1.4">NH₃ and NaCl were also on the slide. Why are they lower than CH₄?</summary><p style="margin: 0; padding-bottom: 14px; font-size: 15px; line-height: 1.55; color: #C9D3E4">N–H bonds are polar: nitrogen pulls the shared electrons toward itself. In NaCl, chlorine has taken sodium's electron completely. In both, electrons already sit close to a strong pull.</p></details>
</div>

<span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #FF6B8F">STEP 6 · THE SNAP</span>
<h2 style="margin: 0; font-family: 'Unbounded', 'Atkinson Hyperlegible', sans-serif; font-weight: 800; font-size: clamp(22px, 4.6vw, 30px); line-height: 1.15; letter-spacing: -0.03em">If glucose let go all at once</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.6; color: #C9D3E4; max-width: 46em">We now know where the energy is: in electrons held far from a strong pull. Let them fall toward oxygen, and the bands snap. The question is how fast.</p>

<span style="position: absolute; left: 17.5%; top: 18.1%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #04140B; white-space: nowrap; text-align: center; pointer-events: none">glucose</span><span style="position: absolute; left: 85.8%; top: 88.1%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #C9D3E4; white-space: nowrap; text-align: center; pointer-events: none">CO₂ + H₂O</span><span style="position: absolute; left: 6.0%; top: 5.7%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #93A2BC; white-space: nowrap; text-align: center; pointer-events: none">ENERGY</span><span class="s s1" style="position: absolute; left: 49.0%; top: 14.3%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #FF6B8F; white-space: nowrap; text-align: center; pointer-events: none">ALL AT ONCE</span><span class="s s1" style="position: absolute; left: 75.0%; top: 43.8%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #FF6B8F; white-space: nowrap; text-align: center; pointer-events: none">heat and light</span><span class="s s1" style="position: absolute; left: 42.5%; top: 88.6%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #FF6B8F; white-space: nowrap; text-align: center; pointer-events: none">no work done</span><span class="s s2" style="position: absolute; left: 49.0%; top: 14.3%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #FFC23D; white-space: nowrap; text-align: center; pointer-events: none">IN SMALL STEPS</span><span class="s s2" style="position: absolute; left: 65.5%; top: 38.1%; transform: translate(-50%, - </div>
<div class="pk-panels"><div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #FF6B8F">ALL AT ONCE</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">A match in gasoline</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Toss a match into gasoline and its energy comes out at once, as an explosion of heat and light. None of it does useful work<sup class="cit"><a href="#fref-2">2</a></sup>.</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">If a cell let glucose's energy out in one go, most of it would leave as heat, far more than the cell could use, and the cell could not harness it<sup class="cit"><a href="#fref-2">2</a></sup>.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n" for="st6-2">Next step →</label></div></div>
<div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #FFC23D">IN SMALL STEPS</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">A staircase instead of a cliff</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Cells take glucose apart in many small reactions<sup class="cit"><a href="#fref-1">1</a>,<a href="#fref-2">2</a></sup>. Each releases a little energy, small enough to catch in a carrier molecule (NADH, FADH₂) or in ATP.</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Some energy still leaves as heat at every step. About a third of glucose's energy ends up in ATP<sup class="cit"><a href="#fref-2">2</a></sup>, better than a car engine.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n alt" for="st6-1">Back</label><label class="pk-n alt" for="st6-1">Start again</label></div></div></div>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 14px; min-width: 0">
<div style="display: flex; flex-direction: column; gap: 6px; padding: 16px 18px; border-radius: 14px; background: rgba(255,255,255,0.03); border: 1px solid #FF6B8F55"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #FF6B8F">NOW WHAT?</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Glucose is loaded. Oxygen is waiting to pull its electrons in. If the bands all snapped at once, the cell would get a burst of heat and nothing it could use. <b>Part 2 is how the cell harnesses the snap step by step.</b></span></div><div style="display: flex; flex-direction: column; gap: 6px; padding: 16px 18px; border-radius: 14px; background: rgba(255,107,143,0.06); border: 1px solid #FF6B8F55"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #FF6B8F">COMMON MIX-UP</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">The energy is not in the breaking. Breaking a bond takes energy <i>in</i>. The energy comes out when electrons settle into new bonds closer to oxygen: C–C becomes C–O<sup class="cit"><a href="#fref-1">1</a></sup>. Respiration is a change of bonds, from loaded to relaxed.</span></div>
</div>
</div>
</section>
<div style="display: flex; flex-direction: column; gap: 8px; padding: 22px 24px; border-radius: 18px; background: #B18CFF12; border: 1px solid #B18CFF66"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.14em; color: #B18CFF">PART 2 · HARNESSING THE EXPLOSION</span><h2 style="margin: 0; font-family: 'Unbounded', 'Atkinson Hyperlegible', sans-serif; font-weight: 800; font-size: clamp(20px, 4.2vw, 28px); line-height: 1.15; letter-spacing: -0.02em">Catching the snap, one step at a time</h2><p style="margin: 0; font-size: 17px; line-height: 1.55; color: #E8EEF8"><b style="color: #B18CFF">The question:</b> If letting glucose's electrons fall all at once would only make heat, how does a cell catch the energy and store it?</p></div>
<section id="fc-7" style="display: flex; flex-direction: column; gap: 18px; padding: 26px; border-radius: 22px; background: #0B1120; border: 1px solid #22304A; scroll-margin-top: 96px">
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #B18CFF">STEP 7 · REDOX</span>
<h2 style="margin: 0; font-family: 'Unbounded', 'Atkinson Hyperlegible', sans-serif; font-weight: 800; font-size: clamp(22px, 4.6vw, 30px); line-height: 1.15; letter-spacing: -0.03em">Electrons are always handed over in pairs of reactions</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.6; color: #C9D3E4; max-width: 46em">To harness the snap, the cell needs a way to move electrons in small, controlled hops. That way is the redox reaction.</p>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(420px, 100%), 1fr)); gap: 18px; align-items: start">
<div style="display: flex; flex-direction: column; gap: 12px; min-width: 0; padding: 20px; border-radius: 16px; background: #0E1524; border: 1px solid #22304A">
<span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #93A2BC">INTERACTIVE · TAP NEXT STEP</span>
<h3 id="fc-7--c1" style="margin: 0; font-weight: 700; font-size: 19px; line-height: 1.3">One hand-off of electrons</h3>
<div class="pk step" id="st7"><input class="pk-r" type="radio" name="st7" id="st7-1" aria-label="1 · Before"><input class="pk-r" type="radio" name="st7" id="st7-2" aria-label="2 · The hand-off"><input class="pk-r" type="radio" name="st7" id="st7-3" aria-label="3 · After">

</svg>
<span style="position: absolute; left: 23.0%; top: 48.4%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #E8EEF8; white-space: nowrap; text-align: center; pointer-events: none">A</span><span style="position: absolute; left: 77.0%; top: 48.4%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #E8EEF8; white-space: nowrap; text-align: center; pointer-events: none">B</span><span class="s s1" style="position: absolute; left: 23.0%; top: 76.8%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #FFC23D; white-space: nowrap; text-align: center; pointer-events: none">holds electrons</span><span class="s s1" style="position: absolute; left: 77.0%; top: 76.8%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #B18CFF; white-space: nowrap; text-align: center; pointer-events: none">empty</span><span class="s s2" style="position: absolute; left: 50.0%; top: 69.5%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #FFC23D; white-space: nowrap; text-align: center; pointer-events: none">handed straight across</span><span class="s s3" style="position: absolute; left: 23.0%; top: 76.8%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #FFC23D; white-space: nowrap; text-align: center; pointer-events: none">OXIDIZED · lost e⁻</span><span class="s s3" style="position: absolute; left: 77.0%; top: 76.8%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #B18CFF; white-space: nowrap; text-align: center; pointer-events: none">REDUCED · gained e⁻</span><span class="s s3" style="position: absolute; left: 23.0%; top: 88.4%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #93A2BC; white-space: nowrap; text-align: center; pointer-events: none">LEO</span><span class="s s3" style="position: absolute; left: 77.0%; top: 88.4%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #93A2BC; white-space: nowrap; text-align: center; pointer-events: none">GER</span>
</div>
<div class="pk-panels"><div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #FFC23D">BEFORE</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">A is loaded, B is empty</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Molecule A has electrons with a lot of potential energy. Molecule B pulls harder<sup class="cit"><a href="#fref-1">1</a></sup>.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n" for="st7-2">Next step →</label></div></div>
<div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #E8EEF8">THE HAND-OFF</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">Electrons go straight from one to the other</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">The electrons move from A directly onto B. They never float free on their own.</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Moving electrons around is how energy moves in a cell. Every chemical reaction in the cell moves electrons<sup class="cit"><a href="#fref-1">1</a></sup>.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n alt" for="st7-1">Back</label><label class="pk-n" for="st7-3">Next step →</label></div></div>
<div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #B18CFF">AFTER</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">One oxidized, one reduced, always together</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">A lost electrons: it is <b>oxidized</b>. B gained them: it is <b>reduced</b>. LEO says GER: Loses Electrons, Oxidation. Gains Electrons, Reduction<sup class="cit"><a href="#fref-1">1</a>,<a href="#fref-2">2</a></sup>.</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">One cannot happen without the other. That is why they are called redox reactions, and why they are always coupled.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n alt" for="st7-2">Back</label><label class="pk-n alt" for="st7-1">Start again</label></div></div></div>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 14px; min-width: 0">
<div style="display: flex; flex-direction: column; gap: 6px; padding: 16px 18px; border-radius: 14px; background: rgba(255,255,255,0.03); border: 1px solid #B18CFF55"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #B18CFF">WHY ALWAYS COUPLED?</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">An electron has to go somewhere. It cannot just leave a molecule into nothing. So if one molecule loses electrons, another must gain them<sup class="cit"><a href="#fref-2">2</a></sup>. The cell uses this: it lets glucose's electrons fall a little at a time, from one molecule to the next, each hand-off a small snap.</span></div><div style="display: flex; flex-direction: column; gap: 6px; padding: 16px 18px; border-radius: 14px; background: rgba(255,255,255,0.03); border: 1px solid #FF6B8F55"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #FF6B8F">WHY NOT LET ELECTRONS LOOSE?</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Loose high-energy electrons are dangerous. When they escape and land on oxygen too early, they make reactive oxygen species, which damage lipids, proteins and DNA<sup class="cit"><a href="#fref-2">2</a></sup>. So the cell keeps its electrons on a leash: always on a carrier, always handed straight to the next.</span></div><div style="display: flex; flex-direction: column; gap: 6px; padding: 16px 18px; border-radius: 14px; background: rgba(94,208,230,0.06); border: 1px solid #5ED0E655"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #5ED0E6">ADDED FROM OUTSIDE THE COURSE MATERIALS</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">The textbook describes reactive oxygen species in chloroplasts. That electrons leaking from our own electron transport chain make them too is general biology, not from the slides.</span></div><div style="display: flex; flex-direction: column; gap: 6px; padding: 16px 18px; border-radius: 14px; background: rgba(255,107,143,0.06); border: 1px solid #FF6B8F55"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #FF6B8F">COMMON MIX-UP</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4"><b>Reduced</b> sounds like less, but a reduced molecule <i>gained</i> electrons and holds <i>more</i> energy.</span></div>
</div>
</div>
</section>
<section id="fc-8" style="display: flex; flex-direction: column; gap: 18px; padding: 26px; border-radius: 22px; background: #0B1120; border: 1px solid #22304A; scroll-margin-top: 96px">
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #6E9BFF">STEP 8 · SUGAR → NAD⁺ → NADH</span>
<h2 style="margin: 0; font-family: 'Unbounded', 'Atkinson Hyperlegible', sans-serif; font-weight: 800; font-size: clamp(22px, 4.6vw, 30px); line-height: 1.15; letter-spacing: -0.03em">The first catch: loading the shuttles</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.6; color: #C9D3E4; max-width: 46em">Each small step in taking glucose apart is a redox reaction, and NAD⁺ is waiting to catch the electrons.</p>
</div>

<span class="s s1" style="position: absolute; left: 23.8%; top: 36.0%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #E8EEF8; white-space: nowrap; text-align: center; pointer-events: none">H–C–OH</span><span class="s s2" style="position: absolute; left: 23.8%; top: 36.0%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #E8EEF8; white-space: nowrap; text-align: center; pointer-events: none">H–C–OH</span><span class="s s3" style="position: absolute; left: 23.8%; top: 36.0%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #E8EEF8; white-space: nowrap; text-align: center; pointer-events: none">C=O</span><span style="position: absolute; left: 23.8%; top: 56.0%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #39E58C; white-space: nowrap; text-align: center; pointer-events: none">part of a sugar</span><span class="s s1" style="position: absolute; left: 76.2%; top: 26.0%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #6E9BFF; white-space: nowrap; text-align: center; pointer-events: none">NAD⁺ · empty</span><span class="s s2" style="position: absolute; left: 76.2%; top: 26.0%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #6E9BFF; white-space: nowrap; text-align: center; pointer-events: none">NAD⁺ · loading</span><span class="s s3" style="position: absolute; left: 76.2%; top: 26.0%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #FFC23D; white-space: nowrap; text-align: center; pointer-events: none">NADH · loaded</span><span class="s s2" style="position: absolute; left: 50.0%; top: 66.0%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #FFC23D; white-space: nowrap; text-align: center; pointer-events: none">2 e⁻ + 2 H⁺</span><span class="s s3" style="position: absolute; left: 60.0%; top: 87.0%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #8FB0FF; white-space: nowrap; text-align: center; pointer-events: none">H⁺ floats off</span><span class="s s3" style="position: absolute; left: 23.8%; top: 80.0%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #39E58C; white-space: nowrap; text-align: center; pointer-events: none">OXIDIZED: lost 2 H</span><span class="s s3" style="position: absolute; left: 76.2%; top: 80.0%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #FFC23D; white-space: nowrap; text-align: center; pointer-events: none">REDUCED: gained 2 e⁻ + 1 H⁺</span>
</div>
<div class="pk-panels"><div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #39E58C">BEFORE</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">A loaded sugar meets an empty shuttle</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">One carbon in the sugar holds an H and an OH. NAD⁺ is a general electron acceptor, an empty shuttle<sup class="cit"><a href="#fref-1">1</a></sup>.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n" for="st8-2">Next step →</label></div></div>
<div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #FFC23D">THE HAND-OFF</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">The sugar gives up 2 H</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">The sugar loses 2 hydrogen atoms, which is 2 electrons and 2 protons (H⁺).</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">NAD⁺ takes both electrons and one proton. The other proton floats off into the solution.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n alt" for="st8-1">Back</label><label class="pk-n" for="st8-3">Next step →</label></div></div>
<div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #6E9BFF">AFTER</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">C=O and NADH</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">H–C–OH + NAD⁺ → C=O + NADH + H⁺<sup class="cit"><a href="#fref-1">1</a>,<a href="#fref-2">2</a></sup>. The sugar carbon is now oxidized: its electrons are pulled toward oxygen in a C=O. NAD⁺ is reduced to NADH and carries the energy away.</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Quick test: more C–H bonds means more reduced, more energy. Fewer means oxidized.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n alt" for="st8-2">Back</label><label class="pk-n alt" for="st8-1">Start again</label></div></div></div>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 14px; min-width: 0">
<div style="display: flex; flex-direction: column; gap: 6px; padding: 16px 18px; border-radius: 14px; background: rgba(255,255,255,0.03); border: 1px solid #6E9BFF55"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #6E9BFF">NAD⁺ AND FAD: THE SHUTTLES</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">NAD⁺ and FAD carry high-energy electrons from glucose to the electron transport chain<sup class="cit"><a href="#fref-1">1</a>,<a href="#fref-2">2</a></sup>. Empty: NAD⁺ and FAD (oxidized). Loaded: NADH and FADH₂ (reduced). Once they drop their electrons off, they go back for more.</span></div><div style="display: flex; flex-direction: column; gap: 6px; padding: 16px 18px; border-radius: 14px; background: rgba(255,255,255,0.03); border: 1px solid #39E58C55"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #39E58C">WHERE THIS HAPPENS</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Glycolysis, pyruvate prep and the citric acid cycle are mostly a long series of these hand-offs. By the end of stage 3, one glucose has loaded 10 NADH and 2 FADH₂.</span></div><div style="display: flex; flex-direction: column; gap: 6px; padding: 16px 18px; border-radius: 14px; background: rgba(255,194,61,0.06); border: 1px solid #FFC23D55"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #FFC23D">THINK ABOUT IT</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">NAD⁺ is a nucleotide, like ATP. You don't need its structure, but recognize it as a nucleotide that can carry electrons.</span></div>
</div>
</div>
</section>
<section id="fc-9" style="display: flex; flex-direction: column; gap: 18px; padding: 26px; border-radius: 22px; background: #0B1120; border: 1px solid #22304A; scroll-margin-top: 96px">

<span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #B18CFF">STEP 9 · THE ELECTRON TRANSPORT CHAIN</span>
<h2 style="margin: 0; font-family: 'Unbounded', 'Atkinson Hyperlegible', sans-serif; font-weight: 800; font-size: clamp(22px, 4.6vw, 30px); line-height: 1.15; letter-spacing: -0.03em">Harnessing the snap, one step at a time</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.6; color: #C9D3E4; max-width: 46em">Stage 4 is where most of the energy is caught. The loaded shuttles drop their electrons at the top of a staircase, and the electrons step down to oxygen.</p>

-align: center; pointer-events: none">FADH₂</span><span style="position: absolute; left: 4.5%; top: 42.9%; transform: translate(0, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #93A2BC; white-space: nowrap; text-align: left; pointer-events: none">energy</span><span style="position: absolute; left: 75.0%; top: 59.3%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #FF6B8F; white-space: nowrap; text-align: center; pointer-events: none">½ O₂ + 2 e⁻ + 2 H⁺ → H₂O</span><span style="position: absolute; left: 10.0%; top: 68.6%; transform: translate(0, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #8FB0FF; white-space: nowrap; text-align: left; pointer-events: none">H⁺ crowded here</span><span style="position: absolute; left: 10.0%; top: 92.1%; transform: translate(0, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #93A2BC; white-space: nowrap; text-align: left; pointer-events: none">matrix</span><span style="position: absolute; left: 17.5%; top: 79.6%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #E8EEF8; white-space: nowrap; text-align: center; pointer-events: none">I</span><span style="position: absolute; left: 42.5%; top: 79.6%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #E8EEF8; white-space: nowrap; text-align: center; pointer-events: none">III</span><span style="position: absolute; left: 62.5%; top: 79.6%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #E8EEF8; white-space: nowrap; text-align: center; pointer-events: none">IV</span><span style="position: absolute; left: 85.0%; top: 79.6%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); </div>
<div class="pk-panels"><div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #6E9BFF">COMPLEX I</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">NADH hands its electrons to the top of the chain</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">The chain is a series of protein complexes in the inner membrane of the mitochondrion<sup class="cit"><a href="#fref-1">1</a>,<a href="#fref-2">2</a></sup>. NADH gives 2 high-energy electrons to Complex I, at the top of the stairs.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n" for="st9-2">Next step →</label></div></div>
<div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #5ED0E6">COMPLEX II</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">FADH₂ gets on a step lower</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">FADH₂ hands its electrons to Complex II, which passes them to Q. They skip the first step.</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">That is why FADH₂ is worth less: each NADH holds about 3 times the energy of an ATP, each FADH₂ about 2 times<sup class="cit"><a href="#fref-1">1</a></sup>.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n alt" for="st9-1">Back</label><label class="pk-n" for="st9-3">Next step →</label></div></div>
<div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #B18CFF">EACH HAND-OFF</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">Every step is a little lower</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Each carrier hands the electrons to the next, which is more electronegative and pulls harder. Every hand-off is a small snap, so the electrons have <b>less energy at every step</b><sup class="cit"><a href="#fref-1">1</a></sup>.</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Complexes I, III and IV use the energy of each snap to pump protons (H⁺) across the membrane, crowding them into the space outside<sup class="cit"><a href="#fref-2">2</a></sup>.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n alt" for="st9-2">Back</label><label class="pk-n" for="st9-4">Next step →</label></div></div>
<div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #39E58C">THE PAYOUT</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">Protons rush back, and the motor spins</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">The crowded protons want back in, like water behind a dam. Their only way through is ATP synthase. As they flow through, it turns like a motor and joins ADP and phosphate into ATP<sup class="cit"><a href="#fref-1">1</a>,<a href="#fref-2">2</a></sup>.</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">So the electrons do not make ATP directly. Electron flow pumps protons, and protons make ATP. That link is the second kind of coupling.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n alt" for="st9-3">Back</label><label class="pk-n alt" for="st9-1">Start again</label></div></div></div>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 14px; min-width: 0">
<div style="display: flex; flex-direction: column; gap: 6px; padding: 16px 18px; border-radius: 14px; background: rgba(255,255,255,0.03); border: 1px solid #B18CFF55"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #B18CFF">TWO KINDS OF COUPLING</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4"><b>1 · Redox coupling</b>: every oxidation is paired with a reduction, so electrons always land somewhere. <b>2 · Energy coupling</b>: the energy of electrons falling is used to pump protons, and the protons flowing back power ATP synthase. Together this is called chemiosmosis<sup class="cit"><a href="#fref-1">1</a>,<a href="#fref-2">2</a></sup>.</span></div><details id="fc-9--t1" style="padding: 0 14px; border-radius: 12px; background: #0E1524; border: 1px solid #22304A"><summary style="cursor: pointer; padding-block: 12px; font-weight: 700; font-size: 15px; line-height: 1.4">True or false: the energy of electrons moving down the chain is used directly to make ATP.</summary><p style="margin: 0; padding-bottom: 14px; font-size: 15px; line-height: 1.55; color: #C9D3E4">False. It pumps protons. The proton gradient powers ATP synthase<sup class="cit"><a href="#fref-1">1</a></sup>.</p></details><div style="display: flex; flex-direction: column; gap: 6px; padding: 16px 18px; border-radius: 14px; background: rgba(255,255,255,0.03); border: 1px solid #39E58C55"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #39E58C">PLANTS ONLY? THE PHOTOSYSTEMS</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">You're right that the photosystems are for plants (and algae and some bacteria), not us. In photosynthesis, light hits Photosystem II and Photosystem I and kicks electrons back up to a high energy level, then they run down a chain much like ours<sup class="cit"><a href="#fref-4">4</a>,<a href="#fref-2">2</a></sup>. Plants run both chains. We only run this one, and in ours electrons only ever go downhill. Photosynthesis gets its own module.</span></div>
</div>
</div>
</section>
<section id="fc-10" style="display: flex; flex-direction: column; gap: 18px; padding: 26px; border-radius: 22px; background: #0B1120; border: 1px solid #22304A; scroll-margin-top: 96px">
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #FF6B8F">STEP 10 · OXYGEN, THE FINAL ACCEPTOR</span>
<h2 style="margin: 0; font-family: 'Unbounded', 'Atkinson Hyperlegible', sans-serif; font-weight: 800; font-size: clamp(22px, 4.6vw, 30px); line-height: 1.15; letter-spacing: -0.03em">Why the chain ends at oxygen, and why you breathe</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.6; color: #C9D3E4; max-width: 46em">Every staircase needs a bottom. In our cells, it is oxygen.</p>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(420px, 100%), 1fr)); gap: 18px; align-items: start">
<div style="display: flex; flex-direction: column; gap: 12px; min-width: 0; padding: 20px; border-radius: 16px; background: #0E1524; border: 1px solid #22304A">
<span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #93A2BC">INTERACTIVE · TAP NEXT STEP</span>
<h3 id="fc-10--c1" style="margin: 0; font-weight: 700; font-size: 19px; line-height: 1.3">From your lungs to the end of the chain</h3>
<div class="pk step" id="st10"><input class="pk-r" type="radio" name="st10" id="st10-1" aria-label="1 · Breathe in O₂"><input class="pk-r" type="radio" name="st10" id="st10-2" aria-label="2 · Breathe out CO₂"><input class="pk-r" type="radio" name="st10" id="st10-3" aria-label="3 · Eat glucose">
<span class="pk-hint"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11V5a1.6 1.6 0 0 1 3.2 0v5"></path><path d="M12.2 10V8.4a1.6 1.6 0 0 1 3.2 0V11"></path><path d="M15.4 11v-.6a1.6 1.6 0 0 1 3.2 0V15a6 6 0 0 1-6 6h-1.2a5.6 5.6 0 0 1-4.6-2.4L4 14.6a1.6 1.6 0 0 1 2.6-1.8L9 15"></path></svg>Tap the buttons, or Next step, to click through all 3</span>
<div class="pk-bar"><label class="pk-l l1" for="st10-1" style="color: #FF6B8F"><span>1 · Breathe in O₂</span></label><label class="pk-l l2" for="st10-2" style="color: #93A2BC"><span>2 · Breathe out CO₂</span></label><label class="pk-l l3" for="st10-3" style="color: #39E58C"><span>3 · Eat glucose</span></label></div>
<div class="pk-fig">
