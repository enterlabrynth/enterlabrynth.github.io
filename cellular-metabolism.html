</svg>
<span style="position: absolute; left: 17.5%; top: 86.0%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #FF6B8F; white-space: nowrap; text-align: center; pointer-events: none">your lungs</span><span style="position: absolute; left: 70.5%; top: 11.0%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #5ED0E6; white-space: nowrap; text-align: center; pointer-events: none">mitochondrion</span><span style="position: absolute; left: 62.5%; top: 35.0%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #E8EEF8; white-space: nowrap; text-align: center; pointer-events: none">CAC</span><span style="position: absolute; left: 83.0%; top: 65.0%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #E8EEF8; white-space: nowrap; text-align: center; pointer-events: none">chain end</span><span class="h h1" style="position: absolute; left: 45.0%; top: 64.0%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #FF6B8F; white-space: nowrap; text-align: center; pointer-events: none">O₂ in</span><span class="h h2" style="position: absolute; left: 41.5%; top: 12.0%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #C9D3E4; white-space: nowrap; text-align: center; pointer-events: none">CO₂ out</span><span class="h h3" style="position: absolute; left: 30.0%; top: 92.0%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #39E58C; white-space: nowrap; text-align: center; pointer-events: none">food</span><span class="h h1" style="position: absolute; left: 82.5%; top: 80.0%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #FF6B8F; white-space: nowrap; text-align: center; pointer-events: none">O₂ + 4 e⁻ + 4 H⁺ → 2 H₂O</span>
</div>
<div class="pk-panels"><div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #FF6B8F">THE LANDING PAD</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">Oxygen catches the electrons at the bottom</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Oxygen is the most electronegative molecule in the chain, the ultimate electron hog. It is the final electron acceptor<sup class="cit"><a href="#fref-1">1</a>,<a href="#fref-2">2</a></sup>.</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">At Complex IV, oxygen takes the electrons and protons and becomes water: O₂ + 4 e⁻ + 4 H⁺ → 2 H₂O<sup class="cit"><a href="#fref-2">2</a></sup>. Without it, the electrons have nowhere to go.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n" for="st10-2">Next step →</label></div></div>
<div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #93A2BC">THE EXHAUST</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">The CO₂ you breathe out</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Glucose's carbons leave as CO₂ in stage 2 (pyruvate prep) and stage 3 (the citric acid cycle)<sup class="cit"><a href="#fref-2">2</a></sup>. Your blood carries it back to your lungs, and you breathe it out.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n alt" for="st10-1">Back</label><label class="pk-n" for="st10-3">Next step →</label></div></div>
<div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #39E58C">THE FUEL</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">Glucose starts it all</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">The food you eat supplies the loaded electrons. Glucose is the original electron donor; oxygen is the last acceptor<sup class="cit"><a href="#fref-1">1</a>,<a href="#fref-2">2</a></sup>.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n alt" for="st10-2">Back</label><label class="pk-n alt" for="st10-1">Start again</label></div></div></div>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 14px; min-width: 0">
<div style="display: flex; flex-direction: column; gap: 6px; padding: 16px 18px; border-radius: 14px; background: rgba(255,255,255,0.03); border: 1px solid #FF6B8F55"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #FF6B8F">THIS IS LITERALLY WHY WE BREATHE</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Every breath in brings oxygen to be the landing pad at the end of the chain. Every breath out carries away the carbons of glucose as CO₂<sup class="cit"><a href="#fref-2">2</a></sup>. Breathing is the outside view of cellular respiration.</span></div><div style="display: flex; flex-direction: column; gap: 6px; padding: 16px 18px; border-radius: 14px; background: rgba(255,194,61,0.06); border: 1px solid #FFC23D55"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #FFC23D">THINK ABOUT IT</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Glucose's electrons start in even C–H bonds, far from a strong pull, and end in O–H bonds in water, as close to oxygen as they can get. The whole trip is one long, controlled snap.</span></div>
</div>
</div>
</section>
<section id="fc-11" style="display: flex; flex-direction: column; gap: 18px; padding: 26px; border-radius: 22px; background: #0B1120; border: 1px solid #22304A; scroll-margin-top: 96px">
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #FF6B8F">STEP 11 · WHAT IF WE REMOVE O₂?</span>
<h2 style="margin: 0; font-family: 'Unbounded', 'Atkinson Hyperlegible', sans-serif; font-weight: 800; font-size: clamp(22px, 4.6vw, 30px); line-height: 1.15; letter-spacing: -0.03em">The electron traffic jam</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.6; color: #C9D3E4; max-width: 46em">Oxygen is the landing pad. Take it away and see what backs up.</p>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(420px, 100%), 1fr)); gap: 18px; align-items: start">
<div style="display: flex; flex-direction: column; gap: 12px; min-width: 0; padding: 20px; border-radius: 16px; background: #0E1524; border: 1px solid #22304A">
<span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #93A2BC">INTERACTIVE · TAP NEXT STEP</span>
<h3 id="fc-11--c1" style="margin: 0; font-weight: 700; font-size: 19px; line-height: 1.3">The chain with and without oxygen</h3>
<div class="pk step" id="st11"><input class="pk-r" type="radio" name="st11" id="st11-1" aria-label="1 · With O₂"><input class="pk-r" type="radio" name="st11" id="st11-2" aria-label="2 · Remove O₂"><input class="pk-r" type="radio" name="st11" id="st11-3" aria-label="3 · The backup"><input class="pk-r" type="radio" name="st11" id="st11-4" aria-label="4 · Fermentation">
<span class="pk-hint"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11V5a1.6 1.6 0 0 1 3.2 0v5"></path><path d="M12.2 10V8.4a1.6 1.6 0 0 1 3.2 0V11"></path><path d="M15.4 11v-.6a1.6 1.6 0 0 1 3.2 0V15a6 6 0 0 1-6 6h-1.2a5.6 5.6 0 0 1-4.6-2.4L4 14.6a1.6 1.6 0 0 1 2.6-1.8L9 15"></path></svg>Tap the buttons, or Next step, to click through all 4</span>
<div class="pk-bar"><label class="pk-l l1" for="st11-1" style="color: #FFC23D"><span>1 · With O₂</span></label><label class="pk-l l2" for="st11-2" style="color: #FF6B8F"><span>2 · Remove O₂</span></label><label class="pk-l l3" for="st11-3" style="color: #6E9BFF"><span>3 · The backup</span></label><label class="pk-l l4" for="st11-4" style="color: #39E58C"><span>4 · Fermentation</span></label></div>

<span style="position: absolute; left: 42.5%; top: 19.0%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #93A2BC; white-space: nowrap; text-align: center; pointer-events: none">THE CHAIN</span><span style="position: absolute; left: 89.8%; top: 19.0%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #FF6B8F; white-space: nowrap; text-align: center; pointer-events: none">LANDING PAD</span><span class="s s1" style="position: absolute; left: 89.8%; top: 53.3%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #FF6B8F; white-space: nowrap; text-align: center; pointer-events: none">O₂ → H₂O</span><span class="s s1" style="position: absolute; left: 42.5%; top: 53.3%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #FFC23D; white-space: nowrap; text-align: center; pointer-events: none">electrons flowing, ATP being made</span><span class="s s2" style="position: absolute; left: 89.8%; top: 53.3%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #FF6B8F; white-space: nowrap; text-align: center; pointer-events: none">no O₂</span><span class="s s2" style="position: absolute; left: 42.5%; top: 53.3%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #B18CFF; white-space: nowrap; text-align: center; pointer-events: none">carriers stuck, still loaded</span><span class="s s3" style="position: absolute; left: 23.8%; top: 68.6%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #39E58C; white-space: nowrap; text-align: center; pointer-events: none">glycolysis</span><span class="s s3" style="position: absolute; left: 62.5%; top: 80.0%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #6E9BFF; white-space: nowrap; text-align: center; pointer-events: none">NADH piling up</span><span class="s s3" style="position: absolute; left: 23.8%; top: 93.3%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #FF6B8F; white-space: nowrap; text-align: center; pointer-events: none">no NAD⁺ left: stalls</span><span class="s s4" style="position: absolute; left: 23.8%; top: 68.6%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #39E58C; white-space: nowrap; text-align: center; pointer-events: none">glycolysis: 2 ATP</span><span class="s s4" style="position: absolute; left: 76.2%; top: 68.6%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #FFC23D; white-space: nowrap; text-align: center; pointer-events: none">pyruvate → lactic acid</span><span class="s s4" style="position: absolute; left: 50.0%; top: 60.0%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #FFC23D; white-space: nowrap; text-align: center; pointer-events: none">NADH</span><span class="s s4" style="position: absolute; left: 50.0%; top: 83.8%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #6E9BFF; white-space: nowrap; text-align: center; pointer-events: none">NAD⁺ back</span>
</div>
<div class="pk-panels"><div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #FFC23D">NORMAL</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">Traffic flowing</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">With oxygen at the end, electrons keep moving down the chain, protons keep being pumped, and ATP synthase keeps turning.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n" for="st11-2">Next step →</label></div></div>
<div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #FF6B8F">NO LANDING PAD</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">The electron traffic jam</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Take oxygen away and Complex IV has nowhere to put its electrons. It stays loaded. Then Complex III cannot hand off, then Q, then Complex I. The whole chain backs up<sup class="cit"><a href="#fref-1">1</a></sup>.</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">No electron flow means no proton pumping, so ATP synthase stops.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n alt" for="st11-1">Back</label><label class="pk-n" for="st11-3">Next step →</label></div></div>
<div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #6E9BFF">THE BACKUP</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">No NAD⁺ comes back</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">NADH can only unload at the chain. With the chain jammed, NADH piles up and the cell runs out of empty NAD⁺. Glycolysis needs NAD⁺, so even glycolysis would stall<sup class="cit"><a href="#fref-1">1</a>,<a href="#fref-2">2</a></sup>.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n alt" for="st11-2">Back</label><label class="pk-n" for="st11-4">Next step →</label></div></div>
<div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #39E58C">PLAN B</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">Fermentation keeps glycolysis going</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">In fermentation, pyruvate takes the electrons from NADH. In animals and many bacteria it becomes lactic acid; yeast make ethanol and CO₂. NAD⁺ is freed to go back to glycolysis<sup class="cit"><a href="#fref-1">1</a>,<a href="#fref-2">2</a></sup>.</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">It works, but it pays only the <b>2 ATP</b> of glycolysis, against about 32 with oxygen<sup class="cit"><a href="#fref-1">1</a>,<a href="#fref-2">2</a></sup>. Lactic acid still holds most of the energy.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n alt" for="st11-3">Back</label><label class="pk-n alt" for="st11-1">Start again</label></div></div></div>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 14px; min-width: 0">
<div style="display: flex; flex-direction: column; gap: 6px; padding: 16px 18px; border-radius: 14px; background: rgba(255,255,255,0.03); border: 1px solid #FF6B8F55"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #FF6B8F">THE DYSFUNCTION, THEN THE DEATH</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Fermentation buys time, not enough for every cell. Without ATP, the pumps and machines that keep a cell alive stop, and the cell dies. A poison that blocks the chain causes the same jam<sup class="cit"><a href="#fref-1">1</a></sup>. Cyanide does exactly this: it blocks Complex IV, so even with plenty of oxygen the electrons can't land.</span></div><div style="display: flex; flex-direction: column; gap: 6px; padding: 16px 18px; border-radius: 14px; background: rgba(94,208,230,0.06); border: 1px solid #5ED0E655"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #5ED0E6">ADDED FROM OUTSIDE THE COURSE MATERIALS</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Cyanide blocking Complex IV is general biology, not from the slides. The slides ask what a poison that blocks the chain would do.</span></div><details id="fc-11--t1" style="padding: 0 14px; border-radius: 12px; background: #0E1524; border: 1px solid #22304A"><summary style="cursor: pointer; padding-block: 12px; font-weight: 700; font-size: 15px; line-height: 1.4">If the first step of the citric acid cycle were blocked, what would happen to NAD⁺?</summary><p style="margin: 0; padding-bottom: 14px; font-size: 15px; line-height: 1.55; color: #C9D3E4">NAD⁺ would pile up in its oxidized form: nothing would be loading it. That cuts off the electrons to the chain, so oxidative phosphorylation would drop<sup class="cit"><a href="#fref-1">1</a></sup>.</p></details>
</div>
</div>
</section>
<section id="fc-12" style="display: flex; flex-direction: column; gap: 18px; padding: 26px; border-radius: 22px; background: #0B1120; border: 1px solid #22304A; scroll-margin-top: 96px">

<h2 style="margin: 0; font-family: 'Unbounded', 'Atkinson Hyperlegible', sans-serif; font-weight: 800; font-size: clamp(22px, 4.6vw, 30px); line-height: 1.15; letter-spacing: -0.03em">Caught the energy. Now how do we store it?</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.6; color: #C9D3E4; max-width: 46em">The electrons have landed on oxygen and the energy has been caught. The cell keeps it in three sizes.</p>
</div>

#FFC23D; white-space: nowrap; text-align: center; pointer-events: none">spend it</span>

<div class="pk-panels"><div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #39E58C">THE MOTHERLODE</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">Glucose: a king-sized candy bar</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Glucose is packed with C–H and C–C bonds, and holds by far the most energy<sup class="cit"><a href="#fref-1">1</a></sup>. Too much to spend at once, and released at once it would be a burst of heat.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n" for="st12-2">Next step →</label></div></div>
<div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #6E9BFF">THE PAYCHECKS</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">NADH and FADH₂: medium-sized bars</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Much more energy than ATP, much less than glucose. Each NADH is worth about 3 ATP; each FADH₂ about 2<sup class="cit"><a href="#fref-1">1</a></sup>. They carry electrons, not cash: they have to be cashed in at the electron transport chain.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n alt" for="st12-1">Back</label><label class="pk-n" for="st12-3">Next step →</label></div></div>
<div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #FFC23D">THE POCKET CHANGE</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">ATP: bite-sized pieces</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">ATP holds a small, set amount of energy, the right size to pay for one job: a pump, a motor protein, building a molecule<sup class="cit"><a href="#fref-1">1</a>,<a href="#fref-2">2</a></sup>. It is the one form every part of the cell can spend.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n alt" for="st12-2">Back</label><label class="pk-n alt" for="st12-1">Start again</label></div></div></div>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 14px; min-width: 0">
<div style="display: flex; flex-direction: column; gap: 6px; padding: 16px 18px; border-radius: 14px; background: rgba(255,255,255,0.03); border: 1px solid #FFC23D55"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #FFC23D">WHY NOT JUST USE GLUCOSE?</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">You can't pay for a snack with a gold bar. Glucose holds too much to spend in one reaction, and loose electrons are dangerous. So the cell breaks the motherlode down into carriers, and the carriers into ATP, small change it can spend anywhere.</span></div><details id="fc-12--t1" style="padding: 0 14px; border-radius: 12px; background: #0E1524; border: 1px solid #22304A"><summary style="cursor: pointer; padding-block: 12px; font-weight: 700; font-size: 15px; line-height: 1.4">Which carries the least energy: acetyl-CoA, NADH, ATP, pyruvate or FADH₂?</summary><p style="margin: 0; padding-bottom: 14px; font-size: 15px; line-height: 1.55; color: #C9D3E4">ATP<sup class="cit"><a href="#fref-1">1</a></sup>. Then FADH₂, NADH, acetyl-CoA, pyruvate, and glucose at the top.</p></details>
</div>
</div>
</section>
<section id="fc-13" style="display: flex; flex-direction: column; gap: 18px; padding: 26px; border-radius: 22px; background: #0B1120; border: 1px solid #22304A; scroll-margin-top: 96px">
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #FFC23D">STEP 13 · ATP UP CLOSE</span>
<h2 style="margin: 0; font-family: 'Unbounded', 'Atkinson Hyperlegible', sans-serif; font-weight: 800; font-size: clamp(22px, 4.6vw, 30px); line-height: 1.15; letter-spacing: -0.03em">The cash in the wallet</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.6; color: #C9D3E4; max-width: 46em">ATP is the form of energy the cell actually spends. Its structure explains why it holds energy, and why it looks so much like a piece of DNA.</p>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(420px, 100%), 1fr)); gap: 18px; align-items: start">
<div style="display: flex; flex-direction: column; gap: 12px; min-width: 0; padding: 20px; border-radius: 16px; background: #0E1524; border: 1px solid #22304A">
<span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #93A2BC">INTERACTIVE · TAP A PART</span>
<h3 id="fc-13--c1" style="margin: 0; font-weight: 700; font-size: 19px; line-height: 1.3">ATP, piece by piece</h3>

<span class="h h1" style="position: absolute; left: 13.0%; top: 47.3%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #E8EEF8; white-space: nowrap; text-align: center; pointer-events: none">P</span><span class="h h1" style="position: absolute; left: 28.0%; top: 47.3%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #E8EEF8; white-space: nowrap; text-align: center; pointer-events: none">P</span><span class="h h1" style="position: absolute; left: 43.0%; top: 47.3%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #E8EEF8; white-space: nowrap; text-align: center; pointer-events: none">P</span><span class="h h1" style="position: absolute; left: 13.0%; top: 62.7%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #E8EEF8; white-space: nowrap; text-align: center; pointer-events: none">−</span><span class="h h1" style="position: absolute; left: 28.0%; top: 62.7%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #E8EEF8; white-space: nowrap; text-align: center; pointer-events: none">−</span><span class="h h1" style="position: absolute; left: 43.0%; top: 62.7%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #E8EEF8; white-space: nowrap; text-align: center; pointer-events: none">−</span><span class="h h1" style="position: absolute; left: 28.0%; top: 21.8%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #FF6B8F; white-space: nowrap; text-align: center; pointer-events: none">push apart</span><span class="h h1" style="position: absolute; left: 28.0%; top: 80.9%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #FFC23D; white-space: nowrap; text-align: center; pointer-events: none">3 phosphates, all negative</span><span style="position: absolute; left: 62.0%; top: 56.4%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #E8EEF8; white-space: nowrap; text-align: center; pointer-events: none">ribose</span><span style="position: absolute; left: 82.5%; top: 54.5%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #6E9BFF; white-space: nowrap; text-align: center; pointer-events: none">adenine</span><span class="h h4" style="position: absolute; left: 75.8%; top: 88.2%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #39E58C; white-space: nowrap; text-align: center; pointer-events: none">adenosine: a building block of DNA and RNA</span>
</div>
<div class="pk-panels"><div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #FFC23D">THE TENSION</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">Three negative charges, forced together</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">At the pH of a cell, all three phosphate groups are negatively charged, and like charges push apart. Holding them side by side takes energy, so ATP is loaded like a stretched band<sup class="cit"><a href="#fref-1">1</a>,<a href="#fref-2">2</a></sup>.</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">When the last phosphate comes off (ATP + H₂O → ADP + Pᵢ), the push is relieved and about 7.3 kcal/mol is released<sup class="cit"><a href="#fref-2">2</a></sup>. Same idea as Part 1: charges held where they don't want to be.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n" for="st13-2">Next step →</label></div></div>
<div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #FF6B8F">THE SUGAR</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">Ribose</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">A 5-carbon sugar. The phosphates hang off one end of it and the base off another<sup class="cit"><a href="#fref-2">2</a></sup>.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n alt" for="st13-1">Back</label><label class="pk-n" for="st13-3">Next step →</label></div></div>
<div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #6E9BFF">THE N PART</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">Adenine, a nitrogenous base</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Two rings containing nitrogen. It is the same A that is in DNA and RNA<sup class="cit"><a href="#fref-2">2</a></sup>.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n alt" for="st13-2">Back</label><label class="pk-n" for="st13-4">Next step →</label></div></div>
<div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #39E58C">THE CONNECTION</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">Yes, there is one</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Adenine + ribose is <b>adenosine</b>, one of the building blocks of DNA and RNA<sup class="cit"><a href="#fref-2">2</a></sup>. ATP is an RNA letter with two extra phosphates. DNA's version uses deoxyribose, a ribose missing one oxygen<sup class="cit"><a href="#fref-5">5</a></sup>.</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">And the extra phosphates are not a coincidence. To add a letter to a new DNA strand, the cell uses the energy of the incoming nucleotide's extra phosphates to make the bond<sup class="cit"><a href="#fref-6">6</a></sup>. The same tension that powers your cells pays for copying your genes.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n alt" for="st13-3">Back</label><label class="pk-n alt" for="st13-1">Start again</label></div></div></div>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 14px; min-width: 0">
<div style="display: flex; flex-direction: column; gap: 6px; padding: 16px 18px; border-radius: 14px; background: rgba(255,255,255,0.03); border: 1px solid #FFC23D55"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #FFC23D">BACK TO THE PHYSICS</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Part 1 was electrons held far from a positive nucleus. ATP is negative charges held close to each other. Different setup, same rule: charges held where they don't want to be store energy, and letting them relax releases it.</span></div><div style="display: flex; flex-direction: column; gap: 6px; padding: 16px 18px; border-radius: 14px; background: rgba(255,255,255,0.03); border: 1px solid #B18CFF55"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #B18CFF">EVERY STEP IS A LITTLE LESS</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Glucose → pyruvate → acetyl-CoA → NADH → down the chain → ATP. At every step the energy comes in smaller pieces, and at every step some leaves as heat. What reaches ATP is about a third of what glucose started with.</span></div><div style="display: flex; flex-direction: column; gap: 6px; padding: 16px 18px; border-radius: 14px; background: rgba(255,194,61,0.06); border: 1px solid #FFC23D55"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #FFC23D">THINK ABOUT IT</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">ATP is the cell's energy currency. Do you think the cell keeps a big stockpile of it, or keeps remaking it from ADP all day?</span></div>
</div>
</div>

<span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #39E58C">SOURCES · FLOW CHART</span>
<h2 style="margin: 0; font-family: 'Unbounded', 'Atkinson Hyperlegible', sans-serif; font-weight: 800; font-size: clamp(20px, 4vw, 26px); line-height: 1.2; letter-spacing: -0.02em">Where this flow chart comes from</h2>
<p style="margin: 0; font-size: 14.5px; line-height: 1.55; color: #C9D3E4">The small numbers in the text point to this list.</p>
<h3 id="fc-sources--c1" style="margin: 0; font-weight: 700; font-size: 19px; line-height: 1.3">Main textbook</h3><ol style="margin: 0; padding-left: 30px; display: flex; flex-direction: column; gap: 10px; font-size: 14.5px; line-height: 1.55; color: #C9D3E4"><li id="fref-2" value="2" style="padding-left: 4px; scroll-margin-top: 110px">Morris, J., Hartl, D., Knoll, A., Lue, R., Michael, M., et al. (2023). <i>Biology: How Life Works</i> (4th ed.). Macmillan Learning. Section 2.2 and Figure 2.7 (polar covalent bonds and electronegativity); Chapter 6, Figures 6.3, 6.4 and 6.9 (potential energy, ATP structure, ATP hydrolysis); Sections 7.1 to 7.6, Figures 7.1, 7.2, 7.3, 7.9, 7.10 and 7.13 (cellular respiration, oxidative phosphorylation, fermentation); Chapter 8 (photosystems and reactive oxygen species).</li></ol>
<h3 id="fc-sources--c2" style="margin: 0; font-weight: 700; font-size: 19px; line-height: 1.3">Course material</h3><ol style="margin: 0; padding-left: 30px; display: flex; flex-direction: column; gap: 10px; font-size: 14.5px; line-height: 1.55; color: #C9D3E4"><li id="fref-1" value="1" style="padding-left: 4px; scroll-margin-top: 110px">The author's own lecture slides and class notes from a university introductory course in molecular and cellular biology, 2026: the lectures on cellular metabolism (respiration, redox, energy carriers, glycolysis, pyruvate processing, the citric acid cycle) and on oxidative phosphorylation, fermentation and regulation. The order of the four stages, the key ideas and the practice questions follow these.</li><li id="fref-3" value="3" style="padding-left: 4px; scroll-margin-top: 110px">The same course's lecture slides on basic chemistry: atomic structure, electron shells, the octet rule, and electronegativity (O > N, S, P > C, H).</li><li id="fref-4" value="4" style="padding-left: 4px; scroll-margin-top: 110px">The same course's lecture slides on photosynthesis: Photosystems II and I, the photosynthetic electron transport chain, and the comparison of oxidative phosphorylation and photophosphorylation.</li><li id="fref-5" value="5" style="padding-left: 4px; scroll-margin-top: 110px">The same course's lecture slides on nucleic acids: RNA and DNA nucleotides differ at the 2′ carbon of the sugar.</li><li id="fref-6" value="6" style="padding-left: 4px; scroll-margin-top: 110px">The same course's lecture slides on DNA replication: the energy for each new bond comes from the phosphate groups of the incoming nucleotide.</li></ol>
<h3 id="fc-sources--c3" style="margin: 0; font-weight: 700; font-size: 19px; line-height: 1.3">Other textbooks read for this unit</h3><p style="margin: 0; font-size: 14.5px; line-height: 1.55; color: #C9D3E4">Read alongside the main textbook. What the author learned from them shaped how this flow chart is explained and organized.</p><ol style="margin: 0; padding-left: 30px; display: flex; flex-direction: column; gap: 10px; font-size: 14.5px; line-height: 1.55; color: #C9D3E4"><li id="fref-7" value="7" style="padding-left: 4px; scroll-margin-top: 110px"><i>Campbell Biology</i>. Pearson.</li><li id="fref-8" value="8" style="padding-left: 4px; scroll-margin-top: 110px">Freeman, S., and colleagues. <i>Biological Science</i>. Pearson.</li><li id="fref-9" value="9" style="padding-left: 4px; scroll-margin-top: 110px">Zumdahl, S. S. <i>Chemical Principles</i>.</li></ol>
<h3 id="fc-sources--c4" style="margin: 0; font-weight: 700; font-size: 19px; line-height: 1.3">Added from general science</h3><p style="margin: 0; font-size: 14.5px; line-height: 1.55; color: #C9D3E4">A few points are not in the course materials and are marked on the page with a blue box: shielding by inner electrons (effective nuclear charge), methane as natural gas, reactive oxygen species from the electron transport chain, and cyanide blocking Complex IV. They are standard general chemistry and biology.</p>
<h3 id="fc-sources--c5" style="margin: 0; font-weight: 700; font-size: 19px; line-height: 1.3">How it was made</h3><p style="margin: 0; font-size: 14.5px; line-height: 1.55; color: #C9D3E4">The explanations and drawings on this page were drafted with the help of two AI tools, ChatGPT (OpenAI) and Claude (Anthropic), and then checked against the sources above. Every drawing is original. None is copied from the textbook or the slides.</p>

<article style="flex: 999 1 600px; min-width: 0; display: flex; flex-direction: column; gap: 22px">

<div style="display: flex; flex-direction: column; gap: 8px; padding: 22px 24px; border-radius: 16px; background: rgba(57,229,140,0.07); border: 1px solid rgba(57,229,140,0.35)">
<span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #6FF0AE">THE BIG IDEA</span>
<p style="margin: 0; font-size: 18px; line-height: 1.6">Food stores energy in electrons that are shared evenly between carbon and hydrogen. Respiration moves those electrons, one controlled step at a time, onto carriers the cell can spend. What is left of the glucose leaves as CO₂.</p>
</div>

<section id="n1" style="display: flex; flex-direction: column; gap: 12px; padding: 26px; border-radius: 16px; background: #0E1524; border: 1px solid #22304A">
<span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #93A2BC">SECTION 1</span>
<h2 style="margin: 0; font-family: 'Unbounded', 'Atkinson Hyperlegible', sans-serif; font-weight: 800; font-size: 24px; letter-spacing: -0.02em">Energy lives in electrons</h2>
<ul style="margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 10px; font-size: 16px; line-height: 1.6; color: #C9D3E4">
<li>An electron's potential energy depends on <b style="color: #E8EEF8">where it sits</b>. Far from a positive nucleus, it has a lot. Pulled in close to one, it has little.</li>
<li>In a <b style="color: #6FF0AE">nonpolar bond</b> (C–C, C–H) the two atoms share electrons almost evenly, so the electrons stay relatively far from either nucleus. These bonds are energy-rich.</li>
<li>In a <b style="color: #E8EEF8">polar bond</b> (O–H, C=O) oxygen pulls the electrons toward itself. These bonds are energy-poor.</li>
<li>Respiration turns fuel bonds into exhaust bonds. Glucose goes in, CO₂ and H₂O come out, and the energy difference is what the cell captures.</li>
<li>Plants build fuel bonds using sunlight. Animals can't, so we eat molecules that already have them.</li>
</ul>
<div style="display: flex; flex-direction: column; gap: 4px; padding: 14px 16px; border-radius: 12px; background: #141D30">
<span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.1em; color: #8FB0FF">THINK ABOUT IT</span>
<span style="font-size: 15px; line-height: 1.55">Gasoline is almost all C–C and C–H bonds. Water is all O–H. That is why one burns and the other puts out fires.</span>
</div>
</section>

<section id="n2" style="display: flex; flex-direction: column; gap: 12px; padding: 26px; border-radius: 16px; background: #0E1524; border: 1px solid #22304A">
<span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #93A2BC">SECTION 2</span>
<h2 style="margin: 0; font-family: 'Unbounded', 'Atkinson Hyperlegible', sans-serif; font-weight: 800; font-size: 24px; letter-spacing: -0.02em">Redox reactions</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(200px, 100%), 1fr)); gap: 10px">
<div style="display: flex; flex-direction: column; gap: 4px; padding: 14px 16px; border-radius: 12px; background: #141D30; border: 1px solid #FF6B8F"><span style="font-family: 'Unbounded', 'Atkinson Hyperlegible', sans-serif; font-weight: 800; font-size: 20px; color: #FF8FAA">OIL</span><span style="font-size: 15px">Oxidation Is Loss of electrons</span></div>
<div style="display: flex; flex-direction: column; gap: 4px; padding: 14px 16px; border-radius: 12px; background: #141D30; border: 1px solid #6E9BFF"><span style="font-family: 'Unbounded', 'Atkinson Hyperlegible', sans-serif; font-weight: 800; font-size: 20px; color: #8FB0FF">RIG</span><span style="font-size: 15px">Reduction Is Gain of electrons</span></div>
</div>
<ul style="margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 10px; font-size: 16px; line-height: 1.6; color: #C9D3E4">
<li>Redox reactions are electron hand-offs. They are <b style="color: #E8EEF8">always paired</b>: if one molecule loses electrons, another gains them.</li>
<li>In cells, electrons usually travel with a proton as a <b style="color: #E8EEF8">hydrogen atom</b>. Losing H means oxidized. Gaining H means reduced.</li>
<li>Example: a carbon in sugar gives up 2 electrons and 2 H⁺. NAD⁺ takes the 2 electrons and 1 H⁺, becoming NADH. The other H⁺ floats off into solution.</li>
<li>In respiration, <b style="color: #6FF0AE">glucose is the first donor</b> and <b style="color: #E8EEF8">oxygen is the last acceptor</b>. When O₂ is reduced, it becomes water.</li>
</ul>
</section>

<section id="n3" style="display: flex; flex-direction: column; gap: 12px; padding: 26px; border-radius: 16px; background: #0E1524; border: 1px solid #22304A">
<span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #93A2BC">SECTION 3</span>
<h2 style="margin: 0; font-family: 'Unbounded', 'Atkinson Hyperlegible', sans-serif; font-weight: 800; font-size: 24px; letter-spacing: -0.02em">The energy carriers</h2>
<div style="overflow-x: auto">
<table style="width: 100%; min-width: 520px; border-collapse: collapse; font-size: 15px; line-height: 1.45">
<thead><tr style="text-align: left; color: #93A2BC; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.08em">
<th style="padding: 10px 12px 10px 0; border-bottom: 1px solid #2C3B58; font-weight: 500">MOLECULE</th>
<th style="padding: 10px 12px; border-bottom: 1px solid #2C3B58; font-weight: 500">JOB</th>
<th style="padding: 10px 12px; border-bottom: 1px solid #2C3B58; font-weight: 500; text-align: right">KCAL/MOL</th>
<th style="padding: 10px 0 10px 12px; border-bottom: 1px solid #2C3B58; font-weight: 500">THINK OF IT AS</th>
</tr></thead>
<tbody>
<tr><td style="padding: 12px 12px 12px 0; border-bottom: 1px solid #22304A; font-weight: 700; color: #6FF0AE">Glucose</td><td style="padding: 12px; border-bottom: 1px solid #22304A; color: #C9D3E4">Stored fuel</td><td style="padding: 12px; border-bottom: 1px solid #22304A; text-align: right; font-family: 'JetBrains Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums">686</td><td style="padding: 12px 0 12px 12px; border-bottom: 1px solid #22304A; color: #C9D3E4">The vault</td></tr>
<tr><td style="padding: 12px 12px 12px 0; border-bottom: 1px solid #22304A; font-weight: 700; color: #9DBBFF">NADH, FADH₂</td><td style="padding: 12px; border-bottom: 1px solid #22304A; color: #C9D3E4">Carry high-energy electrons to the mitochondrial membrane</td><td style="padding: 12px; border-bottom: 1px solid #22304A; text-align: right; font-family: 'JetBrains Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums">52.6</td><td style="padding: 12px 0 12px 12px; border-bottom: 1px solid #22304A; color: #C9D3E4">The paycheck</td></tr>
<tr><td style="padding: 12px 12px 12px 0; font-weight: 700; color: #FFD27A">ATP</td><td style="padding: 12px; color: #C9D3E4">Spent directly on cell work</td><td style="padding: 12px; text-align: right; font-family: 'JetBrains Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums">7.3</td><td style="padding: 12px 0 12px 12px; color: #C9D3E4">Pocket change</td></tr>
</tbody>
</table>
</div>
<ul style="margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 10px; font-size: 16px; line-height: 1.6; color: #C9D3E4">
<li>The NADH value is for passing its electrons all the way to O₂. FADH₂ carries a bit less.</li>
<li>ATP stores energy in three negatively charged phosphates packed side by side. Removing the last one relieves that repulsion.</li>
<li><b style="color: #E8EEF8">NADH and FADH₂</b> are the reduced, loaded forms. <b style="color: #E8EEF8">NAD⁺ and FAD</b> are the oxidized, empty forms.</li>
<li>All three carriers are modified nucleotides. Recognize them; you don't need to draw their structures.</li>
</ul>
</section>

<section id="n4" style="display: flex; flex-direction: column; gap: 12px; padding: 26px; border-radius: 16px; background: #0E1524; border: 1px solid #22304A">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; align-items: center">
<span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #93A2BC">SECTION 4</span>
<span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.08em; color: #6FF0AE; padding: 4px 9px; border-radius: 999px; background: rgba(57,229,140,0.12)">CYTOPLASM · NO O₂ NEEDED</span>
</div>
<h2 style="margin: 0; font-family: 'Unbounded', 'Atkinson Hyperlegible', sans-serif; font-weight: 800; font-size: 24px; letter-spacing: -0.02em">Glycolysis</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.6; color: #C9D3E4">"Sugar splitting." Ten enzyme steps turn one glucose (6 carbons) into two pyruvate (3 carbons each). You only need the three phases, not every step.</p>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(200px, 100%), 1fr)); gap: 10px">
<div style="display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; border-radius: 12px; background: #141D30"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.08em; color: #FF8FAA">1 · INVEST</span><span style="font-size: 15px; line-height: 1.5">2 ATP add phosphates to glucose, making <b>fructose 1,6-bisphosphate</b>. This is the one intermediate worth knowing by name.</span></div>
<div style="display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; border-radius: 12px; background: #141D30"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.08em; color: #B7C3D8">2 · SPLIT</span><span style="font-size: 15px; line-height: 1.5">The 6-carbon sugar breaks into two 3-carbon molecules of G3P (glyceraldehyde 3-phosphate).</span></div>
<div style="display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; border-radius: 12px; background: #141D30"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.08em; color: #6FF0AE">3 · PAYOFF</span><span style="font-size: 15px; line-height: 1.5">Each G3P becomes pyruvate, making 1 NADH and 2 ATP along the way.</span></div>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr)); gap: 10px">
<div style="display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; border-radius: 12px; border: 1px solid #2C3B58"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.08em; color: #93A2BC">GOES IN</span><span style="font-size: 15px; line-height: 1.5">1 glucose · 2 ATP · 2 NAD⁺</span></div>
<div style="display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; border-radius: 12px; border: 1px solid rgba(57,229,140,0.4)"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.08em; color: #6FF0AE">COMES OUT</span><span style="font-size: 15px; line-height: 1.5">2 pyruvate · 4 ATP (net 2) · 2 NADH</span></div>
</div>
<ul style="margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 10px; font-size: 16px; line-height: 1.6; color: #C9D3E4">
<li>Glycolysis makes ATP by <b style="color: #E8EEF8">substrate-level phosphorylation</b>: an enzyme moves a phosphate directly from a sugar molecule onto ADP.</li>
<li>Only partial oxidation happens here. The two pyruvates still hold <b style="color: #E8EEF8">most of glucose's energy</b>.</li>
</ul>
</section>

<section id="n5" style="display: flex; flex-direction: column; gap: 12px; padding: 26px; border-radius: 16px; background: #0E1524; border: 1px solid #22304A">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; align-items: center">
<span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #93A2BC">SECTION 5</span>
<span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.08em; color: #9DBBFF; padding: 4px 9px; border-radius: 999px; background: rgba(110,155,255,0.12)">MITOCHONDRIAL MATRIX</span>
</div>
<h2 style="margin: 0; font-family: 'Unbounded', 'Atkinson Hyperlegible', sans-serif; font-weight: 800; font-size: 24px; letter-spacing: -0.02em">Pyruvate processing</h2>
<ul style="margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 10px; font-size: 16px; line-height: 1.6; color: #C9D3E4">
<li>Pyruvate moves into the mitochondrion. One of its 3 carbons is cut off and leaves as <b style="color: #E8EEF8">CO₂</b>.</li>
<li>The remaining 2-carbon piece is attached to <b style="color: #E8EEF8">coenzyme A</b> (built from a B vitamin), giving <b style="color: #E8EEF8">acetyl-CoA</b>.</li>
<li>Each pyruvate makes <b style="color: #9DBBFF">1 NADH</b>, so 2 per glucose.</li>
<li>Bacteria have no mitochondria, so they run this step and the next one in their cytosol.</li>
</ul>
</section>

<section id="n6" style="display: flex; flex-direction: column; gap: 12px; padding: 26px; border-radius: 16px; background: #0E1524; border: 1px solid #22304A">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; align-items: center">
<span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #93A2BC">SECTION 6</span>
<span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.08em; color: #9DBBFF; padding: 4px 9px; border-radius: 999px; background: rgba(110,155,255,0.12)">MITOCHONDRIAL MATRIX</span>
</div>
<h2 style="margin: 0; font-family: 'Unbounded', 'Atkinson Hyperlegible', sans-serif; font-weight: 800; font-size: 24px; letter-spacing: -0.02em">Citric acid cycle</h2>
<ul style="margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 10px; font-size: 16px; line-height: 1.6; color: #C9D3E4">
<li>Acetyl-CoA feeds into a loop of reactions. Its 2 carbons are stripped off as <b style="color: #E8EEF8">2 CO₂</b>, and the loop resets for the next one.</li>
<li>One turn makes <b style="color: #9DBBFF">3 NADH</b>, <b style="color: #FFD27A">1 FADH₂</b> and <b style="color: #6FF0AE">1 ATP</b>. One glucose gives two acetyl-CoA, so two turns.</li>
<li>Its real product is <b style="color: #E8EEF8">loaded electron carriers</b>, not ATP.</li>
</ul>
<div style="overflow-x: auto; padding: 14px 16px; border-radius: 12px; background: #141D30; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; line-height: 1.7; white-space: nowrap; color: #E8EEF8">2 acetyl-CoA + 6 NAD⁺ + 2 FAD + 2 ADP + 2 Pᵢ → 4 CO₂ + 6 NADH + 2 FADH₂ + 2 ATP</div>
</section>

<section id="n7" style="display: flex; flex-direction: column; gap: 12px; padding: 26px; border-radius: 16px; background: #0E1524; border: 1px solid #22304A">
<span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #93A2BC">SECTION 7</span>
<h2 style="margin: 0; font-family: 'Unbounded', 'Atkinson Hyperlegible', sans-serif; font-weight: 800; font-size: 24px; letter-spacing: -0.02em">Scorecard per glucose</h2>
<div style="overflow-x: auto">
<table style="width: 100%; min-width: 560px; border-collapse: collapse; font-size: 15px; font-variant-numeric: tabular-nums">
<thead><tr style="color: #93A2BC; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.08em">
<th style="padding: 10px 12px 10px 0; border-bottom: 1px solid #2C3B58; font-weight: 500; text-align: left">STAGE</th>
<th style="padding: 10px 12px; border-bottom: 1px solid #2C3B58; font-weight: 500; text-align: left">WHERE</th>
<th style="padding: 10px 12px; border-bottom: 1px solid #2C3B58; font-weight: 500; text-align: right; color: #6FF0AE">ATP</th>
<th style="padding: 10px 12px; border-bottom: 1px solid #2C3B58; font-weight: 500; text-align: right; color: #9DBBFF">NADH</th>
<th style="padding: 10px 12px; border-bottom: 1px solid #2C3B58; font-weight: 500; text-align: right; color: #FFD27A">FADH₂</th>
<th style="padding: 10px 0 10px 12px; border-bottom: 1px solid #2C3B58; font-weight: 500; text-align: right">CO₂</th>
</tr></thead>
<tbody>
<tr><td style="padding: 12px 12px 12px 0; border-bottom: 1px solid #22304A; font-weight: 700">Glycolysis</td><td style="padding: 12px; border-bottom: 1px solid #22304A; color: #B7C3D8">Cytoplasm</td><td style="padding: 12px; border-bottom: 1px solid #22304A; text-align: right; font-family: 'JetBrains Mono', ui-monospace, monospace">2 net</td><td style="padding: 12px; border-bottom: 1px solid #22304A; text-align: right; font-family: 'JetBrains Mono', ui-monospace, monospace">2</td><td style="padding: 12px; border-bottom: 1px solid #22304A; text-align: right; font-family: 'JetBrains Mono', ui-monospace, monospace; color: #5B6A86">0</td><td style="padding: 12px 0 12px 12px; border-bottom: 1px solid #22304A; text-align: right; font-family: 'JetBrains Mono', ui-monospace, monospace; color: #5B6A86">0</td></tr>
<tr><td style="padding: 12px 12px 12px 0; border-bottom: 1px solid #22304A; font-weight: 700">Pyruvate processing</td><td style="padding: 12px; border-bottom: 1px solid #22304A; color: #B7C3D8">Matrix</td><td style="padding: 12px; border-bottom: 1px solid #22304A; text-align: right; font-family: 'JetBrains Mono', ui-monospace, monospace; color: #5B6A86">0</td><td style="padding: 12px; border-bottom: 1px solid #22304A; text-align: right; font-family: 'JetBrains Mono', ui-monospace, monospace">2</td><td style="padding: 12px; border-bottom: 1px solid #22304A; text-align: right; font-family: 'JetBrains Mono', ui-monospace, monospace; color: #5B6A86">0</td><td style="padding: 12px 0 12px 12px; border-bottom: 1px solid #22304A; text-align: right; font-family: 'JetBrains Mono', ui-monospace, monospace">2</td></tr>
<tr><td style="padding: 12px 12px 12px 0; border-bottom: 1px solid #22304A; font-weight: 700">Citric acid cycle</td><td style="padding: 12px; border-bottom: 1px solid #22304A; color: #B7C3D8">Matrix</td><td style="padding: 12px; border-bottom: 1px solid #22304A; text-align: right; font-family: 'JetBrains Mono', ui-monospace, monospace">2</td><td style="padding: 12px; border-bottom: 1px solid #22304A; text-align: right; font-family: 'JetBrains Mono', ui-monospace, monospace">6</td><td style="padding: 12px; border-bottom: 1px solid #22304A; text-align: right; font-family: 'JetBrains Mono', ui-monospace, monospace">2</td><td style="padding: 12px 0 12px 12px; border-bottom: 1px solid #22304A; text-align: right; font-family: 'JetBrains Mono', ui-monospace, monospace">4</td></tr>
<tr style="font-weight: 700"><td style="padding: 12px 12px 12px 0">Total</td><td style="padding: 12px"></td><td style="padding: 12px; text-align: right; font-family: 'JetBrains Mono', ui-monospace, monospace; color: #6FF0AE">4</td><td style="padding: 12px; text-align: right; font-family: 'JetBrains Mono', ui-monospace, monospace; color: #9DBBFF">10</td><td style="padding: 12px; text-align: right; font-family: 'JetBrains Mono', ui-monospace, monospace; color: #FFD27A">2</td><td style="padding: 12px 0 12px 12px; text-align: right; font-family: 'JetBrains Mono', ui-monospace, monospace">6</td></tr>
</tbody>
</table>
</div>
<p style="margin: 0; font-size: 15px; line-height: 1.55; color: #B7C3D8">Only 4 ATP so far. The 10 NADH and 2 FADH₂ are where the rest of the energy is waiting, and the next module shows how the electron transport chain cashes them in.</p>
</section>

<section id="n8" style="display: flex; flex-direction: column; gap: 12px; padding: 26px; border-radius: 16px; background: #0E1524; border: 1px solid #22304A">
<span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #93A2BC">SECTION 8</span>
<h2 style="margin: 0; font-family: 'Unbounded', 'Atkinson Hyperlegible', sans-serif; font-weight: 800; font-size: 24px; letter-spacing: -0.02em">Exam checklist</h2>
<p style="margin: 0; font-size: 15px; color: #B7C3D8">You're ready when you can:</p>
<ul style="margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 10px; font-size: 16px; line-height: 1.6; color: #C9D3E4">
<li>Explain why breaking down nonpolar bonds and forming polar ones releases energy.</li>
<li>Say which molecule is oxidized and which is reduced in a redox example, including NAD⁺ → NADH.</li>
<li>Rank glucose, pyruvate, acetyl-CoA, NADH and ATP by how much energy they carry. (ATP is smallest.)</li>
<li>List what goes in and what comes out of glycolysis, pyruvate processing and the citric acid cycle.</li>
<li>Point to the stage that makes most of the electron carriers (the citric acid cycle).</li>
<li>Name where each stage happens in a eukaryotic cell.</li>
</ul>
<div style="display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; border-radius: 12px; background: rgba(255,194,61,0.08); border: 1px solid rgba(255,194,61,0.3)">
<span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.1em; color: #FFC23D">COMMON MIX-UP</span>
<span style="font-size: 15px; line-height: 1.55">"Reduced" sounds like less, but a reduced molecule gained electrons and holds more energy. NADH is reduced. NAD⁺ is oxidized.</span>
</div>
<div style="display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; border-radius: 12px; background: rgba(177,140,255,0.08); border: 1px solid rgba(177,140,255,0.3)">
<span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.1em; color: #C7AEFF">REAL WORLD</span>
<span style="font-size: 15px; line-height: 1.55">Many tumors burn through glucose far faster than healthy tissue. PET scans use a radioactive glucose look-alike that piles up wherever cells are eating the most.</span>
</div>
</section>

</article>

<script src="assets/dc-lite.js"></script>
<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'flow', i: 0, flipped: false, slide: 0 };
    this.slideCount = 10;
    this.cards = [
      { q: 'Which bond holds more usable energy: C–H or O–H?', a: 'C–H. Its electrons are shared almost evenly, so they sit far from either nucleus with lots of potential energy. In O–H, oxygen pulls them in close.' },
      { q: 'NAD⁺ picks up two electrons and a proton. Was it oxidized or reduced?', a: 'Reduced. It gained electrons (RIG) and became energy-rich NADH.' },
      { q: 'Glycolysis makes 4 ATP. Why is the net only 2?', a: 'The cell spent 2 ATP up front in the investment phase to prime glucose before splitting it.' },
      { q: 'How is ATP made during glycolysis?', a: 'Substrate-level phosphorylation: an enzyme transfers a phosphate directly from a sugar molecule onto ADP.' },
      { q: 'Rank by energy per molecule: ATP, glucose, NADH.', a: 'Glucose (686) > NADH (52.6) > ATP (7.3), in kcal/mol.' },
      { q: 'What happens to pyruvate when it enters the mitochondrion?', a: 'It loses one carbon as CO₂, the 2-carbon remainder joins coenzyme A to form acetyl-CoA, and 1 NADH is made.' },
      { q: 'Where do glucose’s 6 carbons end up?', a: 'All as CO₂: 2 leave during pyruvate processing and 4 in the citric acid cycle.' },
      { q: 'Which stage makes the most NADH per glucose?', a: 'The citric acid cycle, with 6 of the 10. It also makes both FADH₂.' },
      { q: 'In respiration, what is the first electron donor and the last electron acceptor?', a: 'Glucose donates first. Oxygen accepts last and becomes water.' }
    ];
  }
  tabStyle(name) {
    const on = this.state.tab === name;
    return on
      ? { bg: '#39E58C', fg: '#04140B', border: '#39E58C' }
      : { bg: 'transparent', fg: '#E8EEF8', border: '#22304A' };
  }
  renderVals() {
    const tab = this.state.tab;
    const n = this.cards.length;
    const i = this.state.i;
    const flipped = this.state.flipped;
    const card = this.cards[i];
    const s = this.state.slide;
    const S = this.slideCount;
    const names = ['flow', 'notes', 'info', 'slides', 'quiz', 'video', 'podcast'];
    const tb = {}; const go = {}; const show = {};
    names.forEach((nm) => {
      tb[nm] = this.tabStyle(nm);
      go[nm] = () => this.setState({ tab: nm });
      show[nm] = tab === nm;
    });
    const sl = {};
    for (let k = 0; k < S; k++) sl['s' + k] = s === k;
    const dots = [];
    for (let k = 0; k < S; k++) {
      dots.push({
        label: 'Go to slide ' + (k + 1),
        w: k === s ? '24px' : '8px',
        bg: k === s ? '#39E58C' : '#3A4A68',
        go: () => this.setState({ slide: k })
      });
    }
    return {
      tb, go, show, sl, dots,
      slideCounter: (s + 1) + ' / ' + S,
      prevSlide: () => this.setState({ slide: (s - 1 + S) % S }),
      nextSlide: () => this.setState({ slide: (s + 1) % S }),
      counter: (i + 1) + ' / ' + n,
      sideLabel: flipped ? 'ANSWER' : 'QUESTION',
      cardText: flipped ? card.a : card.q,
      flipLabel: flipped ? 'Show question' : 'Flip card',
      cardBorder: flipped ? '#FF6B8F' : '#2C3B58',
      cardGlow: flipped ? '0 0 40px -12px rgba(255,107,143,0.6)' : 'none',
      flip: () => this.setState({ flipped: !flipped }),
      next: () => this.setState({ i: (i + 1) % n, flipped: false })
    };
  }
}
DCLite.mount(Component);
</script>
