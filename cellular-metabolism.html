<p style="margin: 0; font-size: 18px; line-height: 1.6; color: #B7C3D8; max-width: 40em">Where the energy in food actually lives, and how a cell pulls it out of glucose in small, controlled steps: glycolysis, pyruvate processing and the citric acid cycle.</p>

<article style="flex: 999 1 600px; min-width: 0; display: flex; flex-direction: column; gap: 22px">

<div style="display: flex; flex-direction: column; gap: 8px; padding: 22px 24px; border-radius: 16px; background: rgba(57,229,140,0.07); border: 1px solid rgba(57,229,140,0.35)">
<span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #6FF0AE">THE BIG IDEA</span>
<p style="margin: 0; font-size: 18px; line-height: 1.6">Food stores energy in electrons that are shared evenly between carbon and hydrogen. Respiration moves those electrons, one controlled step at a time, onto carriers the cell can spend. What is left of the glucose leaves as CO₂.</p>
</div>

<section id="n1" style="display: flex; flex-direction: column; gap: 12px; padding: 26px; border-radius: 16px; background: #0E1524; border: 1px solid #22304A">
<span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #93A2BC">SECTION 1</span>
<h2 style="margin: 0; font-family: 'Unbounded', 'Atkinson Hyperlegible', sans-serif; font-weight: 800; font-size: 24px; letter-spacing: -0.02em">Energy lives in electrons</h2>
<ul style="margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 10px; font-size: 16px; line-height: 1.6; color: #C9D3E4">
<li>An electron's potential energy depends on <b style="color: #E8EEF8">where it sits</b>. Far from a positive nucleus, it has a lot. Pulled in close to one, it has little.</li>
<li>In a <b style="color: #6FF0AE">nonpolar bond</b> (C–C, C–H) the two atoms share electrons almost evenly, so the electrons stay relatively far from either nucleus. These bonds are energy-rich.</li>
<li>In a <b style="color: #E8EEF8">polar bond</b> (O–H, C=O) oxygen pulls the electrons toward itself. These bonds are energy-poor.</li>
<li>Respiration turns fuel bonds into exhaust bonds. Glucose goes in, CO₂ and H₂O come out, and the energy difference is what the cell captures.</li>
<li>Plants build fuel bonds using sunlight. Animals can't, so we eat molecules that already have them.</li>
</ul>
<div style="display: flex; flex-direction: column; gap: 4px; padding: 14px 16px; border-radius: 12px; background: #141D30">
<span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.1em; color: #8FB0FF">THINK ABOUT IT</span>
<span style="font-size: 15px; line-height: 1.55">Gasoline is almost all C–C and C–H bonds. Water is all O–H. That is why one burns and the other puts out fires.</span>
</div>
</section>

<section id="n2" style="display: flex; flex-direction: column; gap: 12px; padding: 26px; border-radius: 16px; background: #0E1524; border: 1px solid #22304A">
<span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #93A2BC">SECTION 2</span>
<h2 style="margin: 0; font-family: 'Unbounded', 'Atkinson Hyperlegible', sans-serif; font-weight: 800; font-size: 24px; letter-spacing: -0.02em">Redox reactions</h2>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(200px, 100%), 1fr)); gap: 10px">
<div style="display: flex; flex-direction: column; gap: 4px; padding: 14px 16px; border-radius: 12px; background: #141D30; border: 1px solid #FF6B8F"><span style="font-family: 'Unbounded', 'Atkinson Hyperlegible', sans-serif; font-weight: 800; font-size: 20px; color: #FF8FAA">OIL</span><span style="font-size: 15px">Oxidation Is Loss of electrons</span></div>
<div style="display: flex; flex-direction: column; gap: 4px; padding: 14px 16px; border-radius: 12px; background: #141D30; border: 1px solid #6E9BFF"><span style="font-family: 'Unbounded', 'Atkinson Hyperlegible', sans-serif; font-weight: 800; font-size: 20px; color: #8FB0FF">RIG</span><span style="font-size: 15px">Reduction Is Gain of electrons</span></div>
</div>
<ul style="margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 10px; font-size: 16px; line-height: 1.6; color: #C9D3E4">
<li>Redox reactions are electron hand-offs. They are <b style="color: #E8EEF8">always paired</b>: if one molecule loses electrons, another gains them.</li>
<li>In cells, electrons usually travel with a proton as a <b style="color: #E8EEF8">hydrogen atom</b>. Losing H means oxidized. Gaining H means reduced.</li>
<li>Example: a carbon in sugar gives up 2 electrons and 2 H⁺. NAD⁺ takes the 2 electrons and 1 H⁺, becoming NADH. The other H⁺ floats off into solution.</li>
<li>In respiration, <b style="color: #6FF0AE">glucose is the first donor</b> and <b style="color: #E8EEF8">oxygen is the last acceptor</b>. When O₂ is reduced, it becomes water.</li>
</ul>
</section>

<section id="n3" style="display: flex; flex-direction: column; gap: 12px; padding: 26px; border-radius: 16px; background: #0E1524; border: 1px solid #22304A">
<span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #93A2BC">SECTION 3</span>
<h2 style="margin: 0; font-family: 'Unbounded', 'Atkinson Hyperlegible', sans-serif; font-weight: 800; font-size: 24px; letter-spacing: -0.02em">The energy carriers</h2>
<div style="overflow-x: auto">
<table style="width: 100%; min-width: 520px; border-collapse: collapse; font-size: 15px; line-height: 1.45">
<thead><tr style="text-align: left; color: #93A2BC; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.08em">
<th style="padding: 10px 12px 10px 0; border-bottom: 1px solid #2C3B58; font-weight: 500">MOLECULE</th>
<th style="padding: 10px 12px; border-bottom: 1px solid #2C3B58; font-weight: 500">JOB</th>
<th style="padding: 10px 12px; border-bottom: 1px solid #2C3B58; font-weight: 500; text-align: right">KCAL/MOL</th>
<th style="padding: 10px 0 10px 12px; border-bottom: 1px solid #2C3B58; font-weight: 500">THINK OF IT AS</th>
</tr></thead>
<tbody>
<tr><td style="padding: 12px 12px 12px 0; border-bottom: 1px solid #22304A; font-weight: 700; color: #6FF0AE">Glucose</td><td style="padding: 12px; border-bottom: 1px solid #22304A; color: #C9D3E4">Stored fuel</td><td style="padding: 12px; border-bottom: 1px solid #22304A; text-align: right; font-family: 'JetBrains Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums">686</td><td style="padding: 12px 0 12px 12px; border-bottom: 1px solid #22304A; color: #C9D3E4">The vault</td></tr>
<tr><td style="padding: 12px 12px 12px 0; border-bottom: 1px solid #22304A; font-weight: 700; color: #9DBBFF">NADH, FADH₂</td><td style="padding: 12px; border-bottom: 1px solid #22304A; color: #C9D3E4">Carry high-energy electrons to the mitochondrial membrane</td><td style="padding: 12px; border-bottom: 1px solid #22304A; text-align: right; font-family: 'JetBrains Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums">52.6</td><td style="padding: 12px 0 12px 12px; border-bottom: 1px solid #22304A; color: #C9D3E4">The paycheck</td></tr>
<tr><td style="padding: 12px 12px 12px 0; font-weight: 700; color: #FFD27A">ATP</td><td style="padding: 12px; color: #C9D3E4">Spent directly on cell work</td><td style="padding: 12px; text-align: right; font-family: 'JetBrains Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums">7.3</td><td style="padding: 12px 0 12px 12px; color: #C9D3E4">Pocket change</td></tr>
</tbody>
</table>
</div>
<ul style="margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 10px; font-size: 16px; line-height: 1.6; color: #C9D3E4">
<li>The NADH value is for passing its electrons all the way to O₂. FADH₂ carries a bit less.</li>
<li>ATP stores energy in three negatively charged phosphates packed side by side. Removing the last one relieves that repulsion.</li>
<li><b style="color: #E8EEF8">NADH and FADH₂</b> are the reduced, loaded forms. <b style="color: #E8EEF8">NAD⁺ and FAD</b> are the oxidized, empty forms.</li>
<li>All three carriers are modified nucleotides. Recognize them; you don't need to draw their structures.</li>
</ul>
</section>

<section id="n4" style="display: flex; flex-direction: column; gap: 12px; padding: 26px; border-radius: 16px; background: #0E1524; border: 1px solid #22304A">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; align-items: center">
<span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #93A2BC">SECTION 4</span>
<span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.08em; color: #6FF0AE; padding: 4px 9px; border-radius: 999px; background: rgba(57,229,140,0.12)">CYTOPLASM · NO O₂ NEEDED</span>
</div>
<h2 style="margin: 0; font-family: 'Unbounded', 'Atkinson Hyperlegible', sans-serif; font-weight: 800; font-size: 24px; letter-spacing: -0.02em">Glycolysis</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.6; color: #C9D3E4">"Sugar splitting." Ten enzyme steps turn one glucose (6 carbons) into two pyruvate (3 carbons each). You only need the three phases, not every step.</p>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(200px, 100%), 1fr)); gap: 10px">
<div style="display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; border-radius: 12px; background: #141D30"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.08em; color: #FF8FAA">1 · INVEST</span><span style="font-size: 15px; line-height: 1.5">2 ATP add phosphates to glucose, making <b>fructose 1,6-bisphosphate</b>. This is the one intermediate worth knowing by name.</span></div>
<div style="display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; border-radius: 12px; background: #141D30"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.08em; color: #B7C3D8">2 · SPLIT</span><span style="font-size: 15px; line-height: 1.5">The 6-carbon sugar breaks into two 3-carbon molecules of G3P (glyceraldehyde 3-phosphate).</span></div>
<div style="display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; border-radius: 12px; background: #141D30"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.08em; color: #6FF0AE">3 · PAYOFF</span><span style="font-size: 15px; line-height: 1.5">Each G3P becomes pyruvate, making 1 NADH and 2 ATP along the way.</span></div>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr)); gap: 10px">
<div style="display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; border-radius: 12px; border: 1px solid #2C3B58"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.08em; color: #93A2BC">GOES IN</span><span style="font-size: 15px; line-height: 1.5">1 glucose · 2 ATP · 2 NAD⁺</span></div>
<div style="display: flex; flex-direction: column; gap: 6px; padding: 14px 16px; border-radius: 12px; border: 1px solid rgba(57,229,140,0.4)"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.08em; color: #6FF0AE">COMES OUT</span><span style="font-size: 15px; line-height: 1.5">2 pyruvate · 4 ATP (net 2) · 2 NADH</span></div>
</div>
<ul style="margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 10px; font-size: 16px; line-height: 1.6; color: #C9D3E4">
<li>Glycolysis makes ATP by <b style="color: #E8EEF8">substrate-level phosphorylation</b>: an enzyme moves a phosphate directly from a sugar molecule onto ADP.</li>
<li>Only partial oxidation happens here. The two pyruvates still hold <b style="color: #E8EEF8">most of glucose's energy</b>.</li>
</ul>
</section>

<section id="n5" style="display: flex; flex-direction: column; gap: 12px; padding: 26px; border-radius: 16px; background: #0E1524; border: 1px solid #22304A">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; align-items: center">
<span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #93A2BC">SECTION 5</span>
<span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.08em; color: #9DBBFF; padding: 4px 9px; border-radius: 999px; background: rgba(110,155,255,0.12)">MITOCHONDRIAL MATRIX</span>
</div>
<h2 style="margin: 0; font-family: 'Unbounded', 'Atkinson Hyperlegible', sans-serif; font-weight: 800; font-size: 24px; letter-spacing: -0.02em">Pyruvate processing</h2>
<ul style="margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 10px; font-size: 16px; line-height: 1.6; color: #C9D3E4">
<li>Pyruvate moves into the mitochondrion. One of its 3 carbons is cut off and leaves as <b style="color: #E8EEF8">CO₂</b>.</li>
<li>The remaining 2-carbon piece is attached to <b style="color: #E8EEF8">coenzyme A</b> (built from a B vitamin), giving <b style="color: #E8EEF8">acetyl-CoA</b>.</li>
<li>Each pyruvate makes <b style="color: #9DBBFF">1 NADH</b>, so 2 per glucose.</li>
<li>Bacteria have no mitochondria, so they run this step and the next one in their cytosol.</li>
</ul>

</div>
<h2 style="margin: 0; font-family: 'Unbounded', 'Atkinson Hyperlegible', sans-serif; font-weight: 800; font-size: 24px; letter-spacing: -0.02em">Citric acid cycle</h2>
<ul style="margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 10px; font-size: 16px; line-height: 1.6; color: #C9D3E4">
<li>Acetyl-CoA feeds into a loop of reactions. Its 2 carbons are stripped off as <b style="color: #E8EEF8">2 CO₂</b>, and the loop resets for the next one.</li>
<li>One turn makes <b style="color: #9DBBFF">3 NADH</b>, <b style="color: #FFD27A">1 FADH₂</b> and <b style="color: #6FF0AE">1 ATP</b>. One glucose gives two acetyl-CoA, so two turns.</li>
<li>Its real product is <b style="color: #E8EEF8">loaded electron carriers</b>, not ATP.</li>
</ul>

<script src="assets/dc-lite.js"></script>
<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'notes', i: 0, flipped: false, slide: 0 };
    this.slideCount = 10;
    this.cards = [
      { q: 'Which bond holds more usable energy: C–H or O–H?', a: 'C–H. Its electrons are shared almost evenly, so they sit far from either nucleus with lots of potential energy. In O–H, oxygen pulls them in close.' },
      { q: 'NAD⁺ picks up two electrons and a proton. Was it oxidized or reduced?', a: 'Reduced. It gained electrons (RIG) and became energy-rich NADH.' },
      { q: 'Glycolysis makes 4 ATP. Why is the net only 2?', a: 'The cell spent 2 ATP up front in the investment phase to prime glucose before splitting it.' },
      { q: 'How is ATP made during glycolysis?', a: 'Substrate-level phosphorylation: an enzyme transfers a phosphate directly from a sugar molecule onto ADP.' },
      { q: 'Rank by energy per molecule: ATP, glucose, NADH.', a: 'Glucose (686) > NADH (52.6) > ATP (7.3), in kcal/mol.' },
      { q: 'What happens to pyruvate when it enters the mitochondrion?', a: 'It loses one carbon as CO₂, the 2-carbon remainder joins coenzyme A to form acetyl-CoA, and 1 NADH is made.' },
      { q: 'Where do glucose’s 6 carbons end up?', a: 'All as CO₂: 2 leave during pyruvate processing and 4 in the citric acid cycle.' },
      { q: 'Which stage makes the most NADH per glucose?', a: 'The citric acid cycle, with 6 of the 10. It also makes both FADH₂.' },
      { q: 'In respiration, what is the first electron donor and the last electron acceptor?', a: 'Glucose donates first. Oxygen accepts last and becomes water.' }
    ];
  }
  tabStyle(name) {
    const on = this.state.tab === name;
    return on
      ? { bg: '#39E58C', fg: '#04140B', border: '#39E58C' }
      : { bg: 'transparent', fg: '#E8EEF8', border: '#22304A' };
  }
  renderVals() {
    const tab = this.state.tab;
    const n = this.cards.length;
    const i = this.state.i;
    const flipped = this.state.flipped;
    const card = this.cards[i];
    const s = this.state.slide;
    const S = this.slideCount;
    const names = ['notes', 'info', 'slides', 'quiz', 'video', 'podcast'];
    const tb = {}; const go = {}; const show = {};
    names.forEach((nm) => {
      tb[nm] = this.tabStyle(nm);
      go[nm] = () => this.setState({ tab: nm });
      show[nm] = tab === nm;
    });
    const sl = {};
    for (let k = 0; k < S; k++) sl['s' + k] = s === k;
    const dots = [];
    for (let k = 0; k < S; k++) {
      dots.push({
        label: 'Go to slide ' + (k + 1),
        w: k === s ? '24px' : '8px',
        bg: k === s ? '#39E58C' : '#3A4A68',
        go: () => this.setState({ slide: k })
      });
    }
    return {
      tb, go, show, sl, dots,
      slideCounter: (s + 1) + ' / ' + S,
      prevSlide: () => this.setState({ slide: (s - 1 + S) % S }),
      nextSlide: () => this.setState({ slide: (s + 1) % S }),
      counter: (i + 1) + ' / ' + n,
      sideLabel: flipped ? 'ANSWER' : 'QUESTION',
      cardText: flipped ? card.a : card.q,
      flipLabel: flipped ? 'Show question' : 'Flip card',
      cardBorder: flipped ? '#FF6B8F' : '#2C3B58',
      cardGlow: flipped ? '0 0 40px -12px rgba(255,107,143,0.6)' : 'none',
      flip: () => this.setState({ flipped: !flipped }),
      next: () => this.setState({ i: (i + 1) % n, flipped: false })
    };
  }
}
DCLite.mount(Component);
</script>
