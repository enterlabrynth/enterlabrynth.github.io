<div class="pk-panels"><div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #39E58C">STAGE 1 · CYTOPLASM</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">Splitting the sugar</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Glycolysis takes one glucose (6 carbons) to two pyruvates (3 carbons each), in ten enzyme steps, in the cytoplasm, without oxygen<sup class="cit"><a href="#fref-1">1</a>,<a href="#fref-2">2</a></sup>.</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">It has two halves: an energy <b>investment</b> phase that spends 2 ATP, and an energy <b>payoff</b> phase that makes 4 ATP and 2 NADH.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n" for="sgl-2">Next step →</label></div></div>
<div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #FF6B8F">PHASE 1 · STEPS 1 TO 3</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">Invest 2 ATP to prime the sugar</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Two ATP each hand a phosphate to the sugar, one at each end: glucose → glucose 6-phosphate → fructose 6-phosphate → fructose 1,6-bisphosphate<sup class="cit"><a href="#fref-1">1</a></sup>.</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">The enzyme that adds the second phosphate is <b>phosphofructokinase (PFK)</b>. It is the one enzyme of glycolysis to know by name<sup class="cit"><a href="#fref-1">1</a></sup>. Spending energy first makes the sugar easier to break.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n alt" for="sgl-1">Back</label><label class="pk-n" for="sgl-3">Next step →</label></div></div>
<div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #8FB0FF">PHASE 2 · STEPS 4 AND 5</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">Split 6 carbons into two 3s</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Fructose 1,6-bisphosphate is cut into two 3-carbon pieces: glyceraldehyde 3-phosphate (G3P) and dihydroxyacetone phosphate (DHAP). DHAP is then turned into a second G3P<sup class="cit"><a href="#fref-1">1</a></sup>.</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Now there are two identical G3Ps. Everything after this happens twice.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n alt" for="sgl-2">Back</label><label class="pk-n" for="sgl-4">Next step →</label></div></div>
<div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #FFC23D">PHASE 3 · STEPS 6 TO 10</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">The payoff</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Each G3P gives up 2 electrons to NAD⁺ (1 NADH) and makes 2 ATP on its way to pyruvate<sup class="cit"><a href="#fref-1">1</a></sup>. Two G3Ps, so 2 NADH and 4 ATP.</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">G3P is one of the key energy molecules on the slides: it still carries a lot of glucose's energy<sup class="cit"><a href="#fref-1">1</a></sup>.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n alt" for="sgl-3">Back</label><label class="pk-n" for="sgl-5">Next step →</label></div></div>
<div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #E8EEF8">THE SCORE</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">Net: 2 pyruvate, 2 NADH, 2 ATP</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Spend 2, make 4, so glycolysis nets <b>2 ATP</b>, plus <b>2 NADH</b> and <b>2 pyruvate</b><sup class="cit"><a href="#fref-1">1</a>,<a href="#fref-2">2</a></sup>.</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Only part of glucose's energy came out. This is a <b>partial oxidation</b>: the two pyruvates still hold most of the energy glucose had.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n alt" for="sgl-4">Back</label><label class="pk-n alt" for="sgl-1">Start again</label></div></div></div>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 14px; min-width: 0">
<div style="display: flex; flex-direction: column; gap: 6px; padding: 16px 18px; border-radius: 14px; background: rgba(255,255,255,0.03); border: 1px solid #FF6B8F55"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #FF6B8F">REAL WORLD · PET SCANS</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Cancer cells take up glucose much faster than other cells, up to 200 times more. A PET scan finds them by giving a small amount of a radioactive sugar and seeing where it piles up<sup class="cit"><a href="#fref-1">1</a></sup>.</span></div><div style="display: flex; flex-direction: column; gap: 6px; padding: 16px 18px; border-radius: 14px; background: rgba(255,107,143,0.06); border: 1px solid #FF6B8F55"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #FF6B8F">COMMON MIX-UP</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Glycolysis makes 4 ATP but nets only 2: the first 2 paid for the investment. And don't memorize every intermediate or enzyme: only phosphofructokinase<sup class="cit"><a href="#fref-1">1</a></sup>.</span></div><details id="fc-glycolysis--t1" style="padding: 0 14px; border-radius: 12px; background: #0E1524; border: 1px solid #22304A"><summary style="cursor: pointer; padding-block: 12px; font-weight: 700; font-size: 15px; line-height: 1.4">Glycolysis is the partial oxidation of glucose to pyruvate. What describes the partial oxidation?</summary><p style="margin: 0; padding-bottom: 14px; font-size: 15px; line-height: 1.55; color: #C9D3E4">In converting glucose to pyruvate, some potential energy is transferred to NADH and ATP. Oxygen is not involved, and glucose is not broken into ATP itself<sup class="cit"><a href="#fref-1">1</a></sup>.</p></details>
</div>
</div>
</section>
<div style="display: flex; gap: 14px; align-items: center; padding: 14px 18px; margin-inline: clamp(0px, 3vw, 28px); border-radius: 14px; background: #0A101D; border: 1px dashed #FFC23D88"><svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true" style="flex: none"><circle cx="22" cy="22" r="20" fill="#FFC23D1F" stroke="#FFC23D" stroke-width="2"></circle><path d="M15 17 a7 7 0 1 1 9 6.7 c-1.6 .6 -2 1.6 -2 3.3" fill="none" stroke="#FFC23D" stroke-width="2.6" stroke-linecap="round"></path><circle cx="22" cy="32" r="1.9" fill="#FFC23D"></circle></svg><div style="display: flex; flex-direction: column; gap: 4px; min-width: 0"><span style="font-size: 14.5px; line-height: 1.5; color: #93A2BC"><b style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #93A2BC">SO FAR </b>Glycolysis made 4 ATP and 2 NADH without a single electron transport chain.</span><span style="font-size: 16px; line-height: 1.45; color: #E8EEF8"><b style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #FFC23D">NOW WHAT? </b>How did it make ATP directly?</span></div></div>
<section id="fc-slp" style="display: flex; flex-direction: column; gap: 18px; padding: 26px; border-radius: 22px; background: #0B1120; border: 1px solid #22304A; scroll-margin-top: 96px">
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #FFC23D">STEP 12 · HOW GLYCOLYSIS MAKES ATP</span>
<h2 style="margin: 0; font-family: 'Unbounded', 'Atkinson Hyperlegible', sans-serif; font-weight: 800; font-size: clamp(22px, 4.6vw, 30px); line-height: 1.15; letter-spacing: -0.03em">Substrate-level phosphorylation</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.6; color: #C9D3E4; max-width: 46em">Glycolysis made 4 ATP without any electron transport chain. How?</p>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(420px, 100%), 1fr)); gap: 18px; align-items: start">
<div style="display: flex; flex-direction: column; gap: 12px; min-width: 0; padding: 20px; border-radius: 16px; background: #0E1524; border: 1px solid #22304A">
<span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #93A2BC">INTERACTIVE · TAP NEXT STEP</span>
<h3 id="fc-slp--c1" style="margin: 0; font-weight: 700; font-size: 19px; line-height: 1.3">An enzyme passes a phosphate</h3>
<div class="pk step" id="ssl"><input class="pk-r" type="radio" name="ssl" id="ssl-1" aria-label="1 · In the pocket"><input class="pk-r" type="radio" name="ssl" id="ssl-2" aria-label="2 · Pass the phosphate"><input class="pk-r" type="radio" name="ssl" id="ssl-3" aria-label="3 · ATP leaves">
<span class="pk-hint"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11V5a1.6 1.6 0 0 1 3.2 0v5"></path><path d="M12.2 10V8.4a1.6 1.6 0 0 1 3.2 0V11"></path><path d="M15.4 11v-.6a1.6 1.6 0 0 1 3.2 0V15a6 6 0 0 1-6 6h-1.2a5.6 5.6 0 0 1-4.6-2.4L4 14.6a1.6 1.6 0 0 1 2.6-1.8L9 15"></path></svg>Tap the buttons, or Next step, to click through all 3</span>
<div class="pk-bar"><label class="pk-l l1" for="ssl-1" style="color: #39E58C"><span>1 · In the pocket</span></label><label class="pk-l l2" for="ssl-2" style="color: #FFC23D"><span>2 · Pass the phosphate</span></label><label class="pk-l l3" for="ssl-3" style="color: #E8EEF8"><span>3 · ATP leaves</span></label></div>
<div class="pk-fig">

" y="100" fill="#FFC23D" font-size="12" font-weight="700" text-anchor="middle" font-family="Atkinson Hyperlegible, system-ui, sans-serif">the enzyme moves the P</text></g><g class="s s3"><polygon points="232,72 246,62 260,72" fill="#6E9BFF" opacity="0.9"></polygon><rect x="238" y="74" width="16" height="12" rx="3" fill="#FF6B8F" opacity="0.9"></rect><circle cx="266" cy="80" r="5.5" fill="#FFC23D"></circle><circle cx="278" cy="80" r="5.5" fill="#FFC23D"></circle><circle cx="290" cy="80" r="5.5" fill="#FFC23D"></circle><rect x="240" y="134" width="14" height="12" rx="2" fill="#93A2BC"></rect><rect x="258" y="134" width="14" height="12" rx="2" fill="#93A2BC"></rect><rect x="276" y="134" width="14" height="12" rx="2" fill="#93A2BC"></rect><text x="300" y="46" fill="#FFC23D" font-size="13" font-weight="800" text-anchor="middle" font-family="Atkinson Hyperlegible, system-ui, sans-serif">ATP</text><text x="300" y="172" fill="#93A2BC" font-size="11" font-weight="700" text-anchor="middle" font-family="Atkinson Hyperlegible, system-ui, sans-serif">substrate, one P lighter</text><path d="M150 84 L222 76 M150 128 L232 140" stroke="#93A2BC" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#sl-m)"></path></g>
</svg>
<span style="position: absolute; left: 17.5%; top: 49.5%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #39E58C; white-space: nowrap; text-align: center; pointer-events: none">enzyme</span>
</div>
<div class="pk-panels"><div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #39E58C">THE SETUP</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">A substrate with a phosphate, and ADP</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">In glycolysis, some intermediates carry a phosphate they can give away. An enzyme holds one of them next to an ADP<sup class="cit"><a href="#fref-1">1</a>,<a href="#fref-2">2</a></sup>.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n" for="ssl-2">Next step →</label></div></div>
<div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #FFC23D">THE TRANSFER</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">The enzyme moves the phosphate onto ADP</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">One enzyme does two coupled jobs: it takes the phosphate off the substrate and adds it to ADP<sup class="cit"><a href="#fref-2">2</a></sup>. Losing the phosphate releases enough energy to pay for making ATP.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n alt" for="ssl-1">Back</label><label class="pk-n" for="ssl-3">Next step →</label></div></div>
<div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #E8EEF8">THE RESULT</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">ATP, made directly</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">That is <b>substrate-level phosphorylation</b>: using a chemical substrate to add a phosphate to ADP. It takes energy out of G3P<sup class="cit"><a href="#fref-1">1</a></sup>.</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">All the ATP made in glycolysis, and the ATP made in the citric acid cycle, is made this way.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n alt" for="ssl-2">Back</label><label class="pk-n alt" for="ssl-1">Start again</label></div></div></div>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 14px; min-width: 0">
<div style="display: flex; flex-direction: column; gap: 8px; padding: 16px 18px; border-radius: 14px; background: rgba(255,255,255,0.03); border: 1px solid #FFC23D55"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #FFC23D">TWO WAYS TO MAKE ATP</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4"><b>Substrate-level phosphorylation</b>: an enzyme moves a phosphate straight onto ADP. Glycolysis and the citric acid cycle; a small share of the total. <b>Oxidative phosphorylation</b>: electron carriers feed the electron transport chain, and the chain powers ATP synthase (Step 17). Most of the ATP<sup class="cit"><a href="#fref-1">1</a>,<a href="#fref-2">2</a></sup>.</span><svg viewBox="0 0 400 150" role="img" aria-label="Two ways to make ATP. Food is broken down; some ATP is made directly by substrate-level phosphorylation, and the rest of the energy goes to NADH, whose electrons run down the electron transport chain to make ATP by oxidative phosphorylation." style="display: block; width: 100%; height: auto; border-radius: 10px; margin-top: 4px"><rect width="400" height="150" fill="#0A101D"></rect><marker id="tw-m" viewBox="0 0 8 8" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#93A2BC"></path></marker><polygon points="30,40 50,26 74,26 94,40 74,54 50,54" fill="#39E58C" opacity="0.85"></polygon><text x="62" y="44" fill="#04140B" font-size="11" font-weight="800" text-anchor="middle" font-family="Atkinson Hyperlegible, system-ui, sans-serif">food</text><path d="M98 40 L150 40" stroke="#93A2BC" stroke-width="2.2" marker-end="url(#tw-m)"></path><path d="M160 40 L210 90" stroke="#FFC23D" stroke-width="2.2" marker-end="url(#tw-m)"></path><rect x="206.0" y="94" width="40" height="20" rx="10" fill="#FFC23D" opacity="0.9"></rect><text x="226" y="108" fill="#04140B" font-size="10.5" font-weight="800" text-anchor="middle" font-family="Atkinson Hyperlegible, system-ui, sans-serif">ATP</text><text x="232" y="132" fill="#FFC23D" font-size="11" font-weight="700" text-anchor="middle" font-family="Atkinson Hyperlegible, system-ui, sans-serif">substrate-level</text><path d="M160 40 L330 40" stroke="#6E9BFF" stroke-width="2.2" marker-end="url(#tw-m)"></path><rect x="328.0" y="30" width="48" height="20" rx="10" fill="#6E9BFF" opacity="0.9"></rect><text x="352" y="44" fill="#04140B" font-size="10.5" font-weight="800" text-anchor="middle" font-family="Atkinson Hyperlegible, system-ui, sans-serif">NADH</text><path d="M352 54 L352 96" stroke="#B18CFF" stroke-width="2.2" marker-end="url(#tw-m)"></path><rect x="332.0" y="102" width="40" height="20" rx="10" fill="#FFC23D" opacity="0.9"></rect><text x="352" y="116" fill="#04140B" font-size="10.5" font-weight="800" text-anchor="middle" font-family="Atkinson Hyperlegible, system-ui, sans-serif">ATP</text><text x="330" y="140" fill="#B18CFF" font-size="11" font-weight="700" text-anchor="middle" font-family="Atkinson Hyperlegible, system-ui, sans-serif">oxidative phos.</text><text x="386" y="78" fill="#B18CFF" font-size="10" font-weight="700" text-anchor="end" font-family="Atkinson Hyperlegible, system-ui, sans-serif">chain</text></svg></div>
</div>
</div>
</section>
<div style="display: flex; gap: 14px; align-items: center; padding: 14px 18px; margin-inline: clamp(0px, 3vw, 28px); border-radius: 14px; background: #0A101D; border: 1px dashed #5ED0E688"><svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true" style="flex: none"><circle cx="22" cy="22" r="20" fill="#5ED0E61F" stroke="#5ED0E6" stroke-width="2"></circle><path d="M15 17 a7 7 0 1 1 9 6.7 c-1.6 .6 -2 1.6 -2 3.3" fill="none" stroke="#5ED0E6" stroke-width="2.6" stroke-linecap="round"></path><circle cx="22" cy="32" r="1.9" fill="#5ED0E6"></circle></svg><div style="display: flex; flex-direction: column; gap: 4px; min-width: 0"><span style="font-size: 14.5px; line-height: 1.5; color: #93A2BC"><b style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #93A2BC">SO FAR </b>Glycolysis is done, out in the cytoplasm.</span><span style="font-size: 16px; line-height: 1.45; color: #E8EEF8"><b style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #5ED0E6">NOW WHAT? </b>Where do the next stages happen?</span></div></div>
<section id="fc-where" style="display: flex; flex-direction: column; gap: 18px; padding: 26px; border-radius: 22px; background: #0B1120; border: 1px solid #22304A; scroll-margin-top: 96px">
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #5ED0E6">STEP 13 · WHERE IT HAPPENS</span>
<h2 style="margin: 0; font-family: 'Unbounded', 'Atkinson Hyperlegible', sans-serif; font-weight: 800; font-size: clamp(22px, 4.6vw, 30px); line-height: 1.15; letter-spacing: -0.03em">Stages 2 to 4 move into the mitochondrion</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.6; color: #C9D3E4; max-width: 46em">Glycolysis is done, out in the cytoplasm. Everything after it happens inside a mitochondrion. Here is the map.</p>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(420px, 100%), 1fr)); gap: 18px; align-items: start">
<div style="display: flex; flex-direction: column; gap: 12px; min-width: 0; padding: 20px; border-radius: 16px; background: #0E1524; border: 1px solid #22304A">

<div class="pk-panels"><div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #39E58C">STAGE 1</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">Glycolysis: the cytoplasm</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Glycolysis runs in the cytoplasm, outside the mitochondrion<sup class="cit"><a href="#fref-1">1</a>,<a href="#fref-2">2</a></sup>. Its 2 pyruvates then move into the mitochondrion.</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Its 2 NADH are made outside too. Their electrons are passed into the mitochondrion by shuttle proteins in the membrane<sup class="cit"><a href="#fref-1">1</a></sup>.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n" for="swh-2">Next step →</label></div></div>
<div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #5ED0E6">STAGE 2</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">Pyruvate processing: the matrix</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Pyruvate crosses both membranes into the <b>matrix</b>, the space inside the inner membrane, and is processed there<sup class="cit"><a href="#fref-1">1</a></sup>.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n alt" for="swh-1">Back</label><label class="pk-n" for="swh-3">Next step →</label></div></div>
<div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #B18CFF">STAGE 3</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">Citric acid cycle: the matrix</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">The citric acid cycle also runs in the matrix<sup class="cit"><a href="#fref-1">1</a>,<a href="#fref-2">2</a></sup>.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n alt" for="swh-2">Back</label><label class="pk-n" for="swh-4">Next step →</label></div></div>
<div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #FFC23D">STAGE 4</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">Oxidative phosphorylation: the inner membrane</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">The electron transport chain and ATP synthase sit in the <b>inner membrane</b>. It is folded into cristae, which gives room for many of them<sup class="cit"><a href="#fref-1">1</a>,<a href="#fref-2">2</a></sup>. They pump protons into the intermembrane space, between the two membranes.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n alt" for="swh-3">Back</label><label class="pk-n" for="swh-5">Next step →</label></div></div>
<div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #39E58C">SIDE NOTE</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">Bacteria have no mitochondria</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">In prokaryotes, stages 2 to 4 happen in the cytosol<sup class="cit"><a href="#fref-1">1</a></sup>, and the electron transport chain sits in the cell membrane<sup class="cit"><a href="#fref-2">2</a></sup>. Mitochondria began as bacteria (the endosymbiosis module).</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n alt" for="swh-4">Back</label><label class="pk-n alt" for="swh-1">Start again</label></div></div></div>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 6px; padding: 16px 18px; border-radius: 14px; background: rgba(255,107,143,0.06); border: 1px solid #FF6B8F55"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #FF6B8F">COMMON MIX-UP</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4"><b>Intermembrane space</b> is between the outer and inner membranes. The <b>matrix</b> is inside the inner membrane. Pyruvate processing and the citric acid cycle are in the matrix; the chain is in the inner membrane itself.</span></div><div style="display: flex; flex-direction: column; gap: 6px; padding: 16px 18px; border-radius: 14px; background: rgba(255,255,255,0.03); border: 1px solid #5ED0E655"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #5ED0E6">ONE CELL, MANY MITOCHONDRIA</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Cells that need a lot of ATP, like muscle cells, are packed with mitochondria. Each one runs stages 2 to 4 for the glucose coming in from the cytoplasm.</span></div>

<div class="pk-panels"><div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #5ED0E6">STAGE 2 BEGINS</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">Pyruvate moves in</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Pyruvate, the 3-carbon product of glycolysis, still has most of the chemical energy glucose had. It crosses into the mitochondrial matrix<sup class="cit"><a href="#fref-1">1</a></sup>.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n" for="spy-2">Next step →</label></div></div>
<div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #93A2BC">TRIM</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">One carbon leaves as CO₂</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">One of pyruvate's three carbons is cut off and released as <b>CO₂</b><sup class="cit"><a href="#fref-1">1</a>,<a href="#fref-2">2</a></sup>. This is the first CO₂ of respiration, the first carbon of glucose you will breathe out.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n alt" for="spy-1">Back</label><label class="pk-n" for="spy-3">Next step →</label></div></div>
<div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #6E9BFF">CATCH</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">Electrons onto NAD⁺</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">The cut is an oxidation, and NAD⁺ catches the electrons: <b>one NADH for each pyruvate</b><sup class="cit"><a href="#fref-1">1</a></sup>.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n alt" for="spy-2">Back</label><label class="pk-n" for="spy-4">Next step →</label></div></div>
<div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #39E58C">TAG</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">Coenzyme A joins: acetyl-CoA</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">The 2-carbon piece left is attached to <b>coenzyme A</b>, which is made from a B vitamin. The result is <b>acetyl-CoA</b><sup class="cit"><a href="#fref-1">1</a></sup>, ready for the citric acid cycle.</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">One glucose gave two pyruvates, so all of this happens twice: 2 CO₂, 2 NADH, 2 acetyl-CoA.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n alt" for="spy-3">Back</label><label class="pk-n alt" for="spy-1">Start again</label></div></div></div>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 6px; padding: 16px 18px; border-radius: 14px; background: rgba(255,255,255,0.03); border: 1px solid #5ED0E655"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #5ED0E6">PER GLUCOSE</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">2 pyruvate → 2 acetyl-CoA + <b>2 CO₂</b> + <b>2 NADH</b>. Two of glucose's six carbons are gone. Four are left, riding on acetyl-CoA.</span></div><div style="display: flex; flex-direction: column; gap: 6px; padding: 16px 18px; border-radius: 14px; background: rgba(255,194,61,0.06); border: 1px solid #FFC23D55"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #FFC23D">THINK ABOUT IT</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Coenzyme A is made from a B vitamin. Why might a diet missing B vitamins leave someone tired?</span></div>
</div>

<span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #B18CFF">STEP 15 · STAGE 3 · THE CITRIC ACID CYCLE</span>
<h2 style="margin: 0; font-family: 'Unbounded', 'Atkinson Hyperlegible', sans-serif; font-weight: 800; font-size: clamp(22px, 4.6vw, 30px); line-height: 1.15; letter-spacing: -0.03em">The merry-go-round that strips the rest</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.6; color: #C9D3E4; max-width: 46em">Acetyl-CoA still holds a lot of energy. The citric acid cycle takes its last two carbons off as CO₂ and loads the shuttles with the energy.</p>

<span style="position: absolute; left: 49.0%; top: 47.3%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #B18CFF; white-space: nowrap; text-align: center; pointer-events: none">citric acid</span><span style="position: absolute; left: 49.0%; top: 52.7%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #B18CFF; white-space: nowrap; text-align: center; pointer-events: none">cycle</span><span class="s s1" style="position: absolute; left: 50.0%; top: 95.3%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #C9D3E4; white-space: nowrap; text-align: center; pointer-events: none">oxaloacetate (4C) + acetyl (2C) → citrate (6C)</span><span class="s s2" style="position: absolute; left: 50.0%; top: 95.3%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #C9D3E4; white-space: nowrap; text-align: center; pointer-events: none">isocitrate (6C) → α-ketoglutarate (5C)</span><span class="s s3" style="position: absolute; left: 50.0%; top: 95.3%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #C9D3E4; white-space: nowrap; text-align: center; pointer-events: none">α-ketoglutarate (5C) → succinyl-CoA (4C)</span><span class="s s4" style="position: absolute; left: 50.0%; top: 95.3%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #C9D3E4; white-space: nowrap; text-align: center; pointer-events: none">succinyl-CoA → succinate → fumarate → malate → oxaloacetate</span><span class="s s5" style="position: absolute; left: 50.0%; top: 95.3%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #C9D3E4; white-space: nowrap; text-align: center; pointer-events: none">× 2 turns per glucose</span>
</div>
<div class="pk-panels"><div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #39E58C">JOIN</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">Acetyl-CoA climbs on the merry-go-round</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Acetyl-CoA has lots of potential energy<sup class="cit"><a href="#fref-1">1</a></sup>. Its 2 carbons join a 4-carbon molecule already on the wheel, oxaloacetate, to make 6-carbon <b>citrate</b> (the cycle's name). CoA is released to be used again.</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">The names under the wheel are for reference. What matters is the carbon count on each seat.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n" for="sca-2">Next step →</label></div></div>
<div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #93A2BC">STRIP</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">6 carbons → 5: one CO₂, one NADH</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">A carbon is cut off as CO₂, and the electrons that come with it go to NAD⁺<sup class="cit"><a href="#fref-2">2</a></sup>.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n alt" for="sca-1">Back</label><label class="pk-n" for="sca-3">Next step →</label></div></div>
<div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #93A2BC">STRIP AGAIN</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">5 carbons → 4: another CO₂, another NADH</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">A second carbon leaves as CO₂, with a second NADH<sup class="cit"><a href="#fref-2">2</a></sup>. Both carbons acetyl-CoA brought in have now left, as CO₂.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n alt" for="sca-2">Back</label><label class="pk-n" for="sca-4">Next step →</label></div></div>
<div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #FFC23D">PAY OUT</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">1 ATP, 1 FADH₂, 1 more NADH</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">The 4-carbon molecule is rearranged step by step back into oxaloacetate. On the way it pays out 1 ATP (by substrate-level phosphorylation), 1 FADH₂ and a third NADH<sup class="cit"><a href="#fref-1">1</a>,<a href="#fref-2">2</a></sup>. The wheel is ready for the next acetyl-CoA.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n alt" for="sca-3">Back</label><label class="pk-n" for="sca-5">Next step →</label></div></div>
<div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #B18CFF">PER GLUCOSE</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">Two turns: 6 NADH, 2 FADH₂, 2 ATP, 4 CO₂</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">One glucose gave 2 acetyl-CoA, so the wheel turns twice: <b>6 NADH, 2 FADH₂, 2 ATP</b> and 4 CO₂<sup class="cit"><a href="#fref-1">1</a></sup>.</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">This stage makes most of the electron carriers. Its real product is loaded NADH and FADH₂, not ATP.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n alt" for="sca-4">Back</label><label class="pk-n alt" for="sca-1">Start again</label></div></div></div>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 14px; min-width: 0">
<div style="display: flex; flex-direction: column; gap: 6px; padding: 16px 18px; border-radius: 14px; background: rgba(255,255,255,0.03); border: 1px solid #B18CFF55"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #B18CFF">WHY A CYCLE?</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">The 4-carbon oxaloacetate is never used up: it is regenerated at the end of every turn. Like a merry-go-round, the same seats keep coming round, and a new 2-carbon rider climbs on each time.</span></div><div style="display: flex; flex-direction: column; gap: 6px; padding: 16px 18px; border-radius: 14px; background: rgba(255,107,143,0.06); border: 1px solid #FF6B8F55"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #FF6B8F">COMMON MIX-UP</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Check the carbons on the slides' summary line. It writes 6 CO₂ next to 6 NADH. From 2 acetyl-CoA the cycle releases <b>4 CO₂</b> (2 carbons each). The other 2 CO₂ left during pyruvate processing, with 2 more NADH. Starting from 2 pyruvate: 6 CO₂, 8 NADH, 2 FADH₂, 2 ATP<sup class="cit"><a href="#fref-1">1</a>,<a href="#fref-2">2</a></sup>.</span></div><details id="fc-cac--t1" style="padding: 0 14px; border-radius: 12px; background: #0E1524; border: 1px solid #22304A"><summary style="cursor: pointer; padding-block: 12px; font-weight: 700; font-size: 15px; line-height: 1.4">Where are most of the electron carriers made?</summary><p style="margin: 0; padding-bottom: 14px; font-size: 15px; line-height: 1.55; color: #C9D3E4">In the citric acid cycle: 6 of the 10 NADH and both FADH₂ per glucose.</p></details>
</div>
</div>
</section>
<div style="display: flex; gap: 14px; align-items: center; padding: 14px 18px; margin-inline: clamp(0px, 3vw, 28px); border-radius: 14px; background: #0A101D; border: 1px dashed #B18CFF88"><svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true" style="flex: none"><circle cx="22" cy="22" r="20" fill="#B18CFF1F" stroke="#B18CFF" stroke-width="2"></circle><path d="M15 17 a7 7 0 1 1 9 6.7 c-1.6 .6 -2 1.6 -2 3.3" fill="none" stroke="#B18CFF" stroke-width="2.6" stroke-linecap="round"></path><circle cx="22" cy="32" r="1.9" fill="#B18CFF"></circle></svg><div style="display: flex; flex-direction: column; gap: 4px; min-width: 0"><span style="font-size: 14.5px; line-height: 1.5; color: #93A2BC"><b style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #93A2BC">SO FAR </b>Every carbon of glucose has now left as CO₂.</span><span style="font-size: 16px; line-height: 1.45; color: #E8EEF8"><b style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #B18CFF">NOW WHAT? </b>So where did all the energy go?</span></div></div>

<span style="position: absolute; left: 30.8%; top: 2.8%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #39E58C; white-space: nowrap; text-align: center; pointer-events: none">glycolysis</span><span style="position: absolute; left: 49.8%; top: 2.8%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #5ED0E6; white-space: nowrap; text-align: center; pointer-events: none">acetyl-CoA</span><span style="position: absolute; left: 76.0%; top: 2.8%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #B18CFF; white-space: nowrap; text-align: center; pointer-events: none">citric acid cycle</span><span style="position: absolute; left: 3.5%; top: 51.7%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #93A2BC; white-space: nowrap; text-align: center; pointer-events: none">ΔG</span>
</div>
<div class="pk-panels"><div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #39E58C">THE STAIRCASE</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">Glucose starts at the top</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Glucose comes into the cell with all of its free energy: zero on this graph. Investing 2 ATP even raises it a little. Then each NADH and ATP made takes some energy away<sup class="cit"><a href="#fref-1">1</a>,<a href="#fref-2">2</a></sup>.</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">After glycolysis, most of glucose's energy is still there, now in 2 pyruvates.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n" for="sgr-2">Next step →</label></div></div>
<div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #5ED0E6">A BIG STEP</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">Making acetyl-CoA</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Processing pyruvate makes NADH and releases CO₂: one big step down<sup class="cit"><a href="#fref-1">1</a></sup>. What is left is in 2 acetyl-CoA.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n alt" for="sgr-1">Back</label><label class="pk-n" for="sgr-3">Next step →</label></div></div>
<div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #B18CFF">ALL THE WAY DOWN</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">The citric acid cycle finishes the job</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">The cycle steps down again and again, each step caught as NADH, FADH₂ or ATP, until only CO₂ is left at the bottom, about 686 kcal/mol below glucose<sup class="cit"><a href="#fref-1">1</a>,<a href="#fref-2">2</a></sup>.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n alt" for="sgr-2">Back</label><label class="pk-n" for="sgr-4">Next step →</label></div></div>
<div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #FFC23D">WHERE IT WENT</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">The energy is in the carriers now</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Energy released is stored as ATP and as the electron carriers NADH and FADH₂<sup class="cit"><a href="#fref-1">1</a></sup>. Per glucose: 10 NADH, 2 FADH₂ and only 4 ATP so far.</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Notice the biggest drops are the NADH steps, not the ATP steps<sup class="cit"><a href="#fref-2">2</a></sup>. The carriers hold most of the energy, and Part 3 cashes them in.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n alt" for="sgr-3">Back</label><label class="pk-n alt" for="sgr-1">Start again</label></div></div></div>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 14px; min-width: 0">
<div style="display: flex; flex-direction: column; gap: 6px; padding: 16px 18px; border-radius: 14px; background: rgba(255,255,255,0.03); border: 1px solid #39E58C55"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #39E58C">THE SCORECARD SO FAR</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4"><b>Glycolysis</b> (cytoplasm): 2 ATP net, 2 NADH, 2 pyruvate.<br><b>Pyruvate processing</b> (matrix): 2 NADH, 2 CO₂, 2 acetyl-CoA.<br><b>Citric acid cycle</b> (matrix): 2 ATP, 6 NADH, 2 FADH₂, 4 CO₂.<br><b>Total</b>: 4 ATP, 10 NADH, 2 FADH₂, 6 CO₂.</span></div><div style="display: flex; flex-direction: column; gap: 6px; padding: 16px 18px; border-radius: 14px; background: rgba(255,107,143,0.06); border: 1px solid #FF6B8F55"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #FF6B8F">COMMON MIX-UP</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">The overview figure on the slides says "about 36 or 38 ATP" per glucose. That is an older count. The newer count, used in the next lecture and the textbook, is <b>about 32</b><sup class="cit"><a href="#fref-1">1</a>,<a href="#fref-2">2</a></sup>.</span></div><div style="display: flex; flex-direction: column; gap: 6px; padding: 16px 18px; border-radius: 14px; background: rgba(255,194,61,0.06); border: 1px solid #FFC23D55"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #FFC23D">THINK ABOUT IT</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">The graph's axis is drawn from the lecture figure. The step heights here are approximate; the shape is the point: a lot of small steps, and the big ones are where NADH is made.</span></div>
</div>
</div>
</section>
<div style="display: flex; gap: 14px; align-items: center; padding: 14px 18px; margin-inline: clamp(0px, 3vw, 28px); border-radius: 14px; background: #0A101D; border: 1px dashed #B18CFF88"><svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true" style="flex: none"><circle cx="22" cy="22" r="20" fill="#B18CFF1F" stroke="#B18CFF" stroke-width="2"></circle><path d="M15 17 a7 7 0 1 1 9 6.7 c-1.6 .6 -2 1.6 -2 3.3" fill="none" stroke="#B18CFF" stroke-width="2.6" stroke-linecap="round"></path><circle cx="22" cy="32" r="1.9" fill="#B18CFF"></circle></svg><div style="display: flex; flex-direction: column; gap: 4px; min-width: 0"><span style="font-size: 14.5px; line-height: 1.5; color: #93A2BC"><b style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #93A2BC">SO FAR </b>The energy is held in 10 NADH, 2 FADH₂ and only 4 ATP.</span><span style="font-size: 16px; line-height: 1.45; color: #E8EEF8"><b style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #B18CFF">NOW WHAT? </b>How do the carriers cash in?</span></div></div>
<div style="display: flex; flex-direction: column; gap: 8px; padding: 22px 24px; border-radius: 18px; background: #FF6B8F12; border: 1px solid #FF6B8F66"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.14em; color: #FF6B8F">PART 3 · THE PAYOUT</span><h2 style="margin: 0; font-family: 'Unbounded', 'Atkinson Hyperlegible', sans-serif; font-weight: 800; font-size: clamp(20px, 4.2vw, 28px); line-height: 1.15; letter-spacing: -0.02em">Cashing in the carriers</h2><p style="margin: 0; font-size: 17px; line-height: 1.55; color: #E8EEF8"><b style="color: #FF6B8F">The question:</b> The shuttles are loaded. How do they turn into ATP, and why do we need oxygen to do it?</p></div>
<section id="fc-etc" style="display: flex; flex-direction: column; gap: 18px; padding: 26px; border-radius: 22px; background: #0B1120; border: 1px solid #22304A; scroll-margin-top: 96px">
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #B18CFF">STEP 17 · THE ELECTRON TRANSPORT CHAIN</span>
<h2 style="margin: 0; font-family: 'Unbounded', 'Atkinson Hyperlegible', sans-serif; font-weight: 800; font-size: clamp(22px, 4.6vw, 30px); line-height: 1.15; letter-spacing: -0.03em">Harnessing the snap, one step at a time</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.6; color: #C9D3E4; max-width: 46em">Stage 4 is where most of the energy is caught. The loaded shuttles drop their electrons at the top of a staircase, and the electrons step down to oxygen.</p>
</div>

<div style="display: flex; flex-direction: column; gap: 12px; min-width: 0; padding: 20px; border-radius: 16px; background: #0E1524; border: 1px solid #22304A">

<h3 id="fc-etc--c1" style="margin: 0; font-weight: 700; font-size: 19px; line-height: 1.3">Down the stairs, and what each step pays for</h3>

<span style="position: absolute; left: 10.0%; top: 10.7%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #E8EEF8; white-space: nowrap; text-align: center; pointer-events: none">NADH</span><span style="position: absolute; left: 23.0%; top: 17.9%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #E8EEF8; white-space: nowrap; text-align: center; pointer-events: none">I</span><span style="position: absolute; left: 35.5%; top: 25.7%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #E8EEF8; white-space: nowrap; text-align: center; pointer-events: none">Q</span><span style="position: absolute; left: 48.0%; top: 33.6%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #E8EEF8; white-space: nowrap; text-align: center; pointer-events: none">III</span><span style="position: absolute; left: 60.5%; top: 40.0%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #E8EEF8; white-space: nowrap; text-align: center; pointer-events: none">c</span><span style="position: absolute; left: 73.0%; top: 46.4%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #E8EEF8; white-space: nowrap; text-align: center; pointer-events: none">IV</span><span style="position: absolute; left: 86.5%; top: 52.9%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #E8EEF8; white-space: nowrap; text-align: center; pointer-events: none">O₂</span><span style="position: absolute; left: 36.8%; top: 5.4%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #E8EEF8; white-space: nowrap; text-align: center; pointer-events: none">FADH₂</span><span style="position: absolute; left: 4.5%; top: 42.9%; transform: translate(0, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #93A2BC; white-space: nowrap; text-align: left; pointer-events: none">energy</span><span style="position: absolute; left: 75.0%; top: 59.3%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #FF6B8F; white-space: nowrap; text-align: center; pointer-events: none">½ O₂ + 2 e⁻ + 2 H⁺ → H₂O</span><span style="position: absolute; left: 10.0%; top: 68.6%; transform: translate(0, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #8FB0FF; white-space: nowrap; text-align: left; pointer-events: none">H⁺ crowded here</span><span style="position: absolute; left: 10.0%; top: 92.1%; transform: translate(0, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #93A2BC; white-space: nowrap; text-align: left; pointer-events: none">matrix</span><span style="position: absolute; left: 17.5%; top: 79.6%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #E8EEF8; white-space: nowrap; text-align: center; pointer-events: none">I</span><span style="position: absolute; left: 42.5%; top: 79.6%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #E8EEF8; white-space: nowrap; text-align: center; pointer-events: none">III</span><span style="position: absolute; left: 62.5%; top: 79.6%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #E8EEF8; white-space: nowrap; text-align: center; pointer-events: none">IV</span><span style="position: absolute; left: 85.0%; top: 79.6%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #04140B; white-space: nowrap; text-align: center; pointer-events: none">ATP synthase</span><span style="position: absolute; left: 93.0%; top: 95.7%; transform: translate(0, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #FFC23D; white-space: nowrap; text-align: left; pointer-events: none">ATP</span>
</div>
<div class="pk-panels"><div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #6E9BFF">COMPLEX I</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">NADH hands its electrons to the top of the chain</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">The chain is a series of protein complexes in the inner membrane of the mitochondrion<sup class="cit"><a href="#fref-1">1</a>,<a href="#fref-2">2</a></sup>. NADH gives 2 high-energy electrons to Complex I, at the top of the stairs.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n" for="st9-2">Next step →</label></div></div>
<div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #5ED0E6">COMPLEX II</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">FADH₂ gets on a step lower</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">FADH₂ hands its electrons to Complex II, which passes them to Q. They skip the first step.</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">That is why FADH₂ is worth less: each NADH holds about 3 times the energy of an ATP, each FADH₂ about 2 times<sup class="cit"><a href="#fref-1">1</a></sup>.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n alt" for="st9-1">Back</label><label class="pk-n" for="st9-3">Next step →</label></div></div>
<div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #B18CFF">EACH HAND-OFF</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">Every step is a little lower</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Each carrier hands the electrons to the next, which is more electronegative and pulls harder. Every hand-off is a small snap, so the electrons have <b>less energy at every step</b><sup class="cit"><a href="#fref-1">1</a></sup>.</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Complexes I, III and IV use the energy of each snap to pump protons (H⁺) across the membrane, crowding them into the space outside<sup class="cit"><a href="#fref-2">2</a></sup>.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n alt" for="st9-2">Back</label><label class="pk-n" for="st9-4">Next step →</label></div></div>
<div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #39E58C">THE PAYOUT</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">Protons rush back, and the motor spins</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">The crowded protons want back in, like water behind a dam. Their only way through is ATP synthase. As they flow through, it turns like a motor and joins ADP and phosphate into ATP<sup class="cit"><a href="#fref-1">1</a>,<a href="#fref-2">2</a></sup>.</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">So the electrons do not make ATP directly. Electron flow pumps protons, and protons make ATP. That link is the second kind of coupling.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n alt" for="st9-3">Back</label><label class="pk-n alt" for="st9-1">Start again</label></div></div></div>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 14px; min-width: 0">
<div style="display: flex; flex-direction: column; gap: 6px; padding: 16px 18px; border-radius: 14px; background: rgba(255,255,255,0.03); border: 1px solid #B18CFF55"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #B18CFF">TWO KINDS OF COUPLING</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4"><b>1 · Redox coupling</b>: every oxidation is paired with a reduction, so electrons always land somewhere. <b>2 · Energy coupling</b>: the energy of electrons falling is used to pump protons, and the protons flowing back power ATP synthase. Together this is called chemiosmosis<sup class="cit"><a href="#fref-1">1</a>,<a href="#fref-2">2</a></sup>.</span></div><details id="fc-etc--t1" style="padding: 0 14px; border-radius: 12px; background: #0E1524; border: 1px solid #22304A"><summary style="cursor: pointer; padding-block: 12px; font-weight: 700; font-size: 15px; line-height: 1.4">True or false: the energy of electrons moving down the chain is used directly to make ATP.</summary><p style="margin: 0; padding-bottom: 14px; font-size: 15px; line-height: 1.55; color: #C9D3E4">False. It pumps protons. The proton gradient powers ATP synthase<sup class="cit"><a href="#fref-1">1</a></sup>.</p></details><div style="display: flex; flex-direction: column; gap: 6px; padding: 16px 18px; border-radius: 14px; background: rgba(255,255,255,0.03); border: 1px solid #39E58C55"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #39E58C">PLANTS ONLY? THE PHOTOSYSTEMS</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">You're right that the photosystems are for plants (and algae and some bacteria), not us. In photosynthesis, light hits Photosystem II and Photosystem I and kicks electrons back up to a high energy level, then they run down a chain much like ours<sup class="cit"><a href="#fref-4">4</a>,<a href="#fref-2">2</a></sup>. Plants run both chains. We only run this one, and in ours electrons only ever go downhill. Photosynthesis gets its own module.</span></div>
</div>
</div>
</section>
<div style="display: flex; gap: 14px; align-items: center; padding: 14px 18px; margin-inline: clamp(0px, 3vw, 28px); border-radius: 14px; background: #0A101D; border: 1px dashed #FF6B8F88"><svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true" style="flex: none"><circle cx="22" cy="22" r="20" fill="#FF6B8F1F" stroke="#FF6B8F" stroke-width="2"></circle><path d="M15 17 a7 7 0 1 1 9 6.7 c-1.6 .6 -2 1.6 -2 3.3" fill="none" stroke="#FF6B8F" stroke-width="2.6" stroke-linecap="round"></path><circle cx="22" cy="32" r="1.9" fill="#FF6B8F"></circle></svg><div style="display: flex; flex-direction: column; gap: 4px; min-width: 0"><span style="font-size: 14.5px; line-height: 1.5; color: #93A2BC"><b style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #93A2BC">SO FAR </b>Electrons step down the chain, and each step pays for pumping protons.</span><span style="font-size: 16px; line-height: 1.45; color: #E8EEF8"><b style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #FF6B8F">NOW WHAT? </b>What is waiting at the bottom of the stairs?</span></div></div>
<section id="fc-o2" style="display: flex; flex-direction: column; gap: 18px; padding: 26px; border-radius: 22px; background: #0B1120; border: 1px solid #22304A; scroll-margin-top: 96px">
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #FF6B8F">STEP 18 · OXYGEN, THE FINAL ACCEPTOR</span>
<h2 style="margin: 0; font-family: 'Unbounded', 'Atkinson Hyperlegible', sans-serif; font-weight: 800; font-size: clamp(22px, 4.6vw, 30px); line-height: 1.15; letter-spacing: -0.03em">Why the chain ends at oxygen, and why you breathe</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.6; color: #C9D3E4; max-width: 46em">Every staircase needs a bottom. In our cells, it is oxygen.</p>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(420px, 100%), 1fr)); gap: 18px; align-items: start">
<div style="display: flex; flex-direction: column; gap: 12px; min-width: 0; padding: 20px; border-radius: 16px; background: #0E1524; border: 1px solid #22304A">
<span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #93A2BC">INTERACTIVE · TAP NEXT STEP</span>
<h3 id="fc-o2--c1" style="margin: 0; font-weight: 700; font-size: 19px; line-height: 1.3">From your lungs to the end of the chain</h3>
<div class="pk step" id="st10"><input class="pk-r" type="radio" name="st10" id="st10-1" aria-label="1 · Breathe in O₂"><input class="pk-r" type="radio" name="st10" id="st10-2" aria-label="2 · Breathe out CO₂"><input class="pk-r" type="radio" name="st10" id="st10-3" aria-label="3 · Eat glucose">

<div class="pk-bar"><label class="pk-l l1" for="st10-1" style="color: #FF6B8F"><span>1 · Breathe in O₂</span></label><label class="pk-l l2" for="st10-2" style="color: #93A2BC"><span>2 · Breathe out CO₂</span></label><label class="pk-l l3" for="st10-3" style="color: #39E58C"><span>3 · Eat glucose</span></label></div>
<div class="pk-fig">
<svg viewBox="0 0 400 200" role="img" aria-label="Lungs on the left and a mitochondrion on the right. Oxygen breathed in travels to the end of the electron transport chain, where it takes the electrons and becomes water. Carbon dioxide made in the citric acid cycle travels back to the lungs to be breathed out. Glucose from food enters the mitochondrion's pathway." style="display: block; width: 100%; height: auto; border-radius: 10px">

<span style="position: absolute; left: 17.5%; top: 86.0%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #FF6B8F; white-space: nowrap; text-align: center; pointer-events: none">your lungs</span><span style="position: absolute; left: 70.5%; top: 11.0%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #5ED0E6; white-space: nowrap; text-align: center; pointer-events: none">mitochondrion</span><span style="position: absolute; left: 62.5%; top: 35.0%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #E8EEF8; white-space: nowrap; text-align: center; pointer-events: none">CAC</span><span style="position: absolute; left: 83.0%; top: 65.0%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #E8EEF8; white-space: nowrap; text-align: center; pointer-events: none">chain end</span><span class="h h1" style="position: absolute; left: 45.0%; top: 64.0%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #FF6B8F; white-space: nowrap; text-align: center; pointer-events: none">O₂ in</span><span class="h h2" style="position: absolute; left: 41.5%; top: 12.0%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #C9D3E4; white-space: nowrap; text-align: center; pointer-events: none">CO₂ out</span><span class="h h3" style="position: absolute; left: 30.0%; top: 92.0%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #39E58C; white-space: nowrap; text-align: center; pointer-events: none">food</span><span class="h h1" style="position: absolute; left: 82.5%; top: 80.0%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #FF6B8F; white-space: nowrap; text-align: center; pointer-events: none">O₂ + 4 e⁻ + 4 H⁺ → 2 H₂O</span>
</div>
<div class="pk-panels"><div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #FF6B8F">THE LANDING PAD</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">Oxygen catches the electrons at the bottom</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Oxygen is the most electronegative molecule in the chain, the ultimate electron hog. It is the final electron acceptor<sup class="cit"><a href="#fref-1">1</a>,<a href="#fref-2">2</a></sup>.</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">At Complex IV, oxygen takes the electrons and protons and becomes water: O₂ + 4 e⁻ + 4 H⁺ → 2 H₂O<sup class="cit"><a href="#fref-2">2</a></sup>. Without it, the electrons have nowhere to go.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n" for="st10-2">Next step →</label></div></div>
<div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #93A2BC">THE EXHAUST</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">The CO₂ you breathe out</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Glucose's carbons leave as CO₂ in stage 2 (pyruvate prep) and stage 3 (the citric acid cycle)<sup class="cit"><a href="#fref-2">2</a></sup>. Your blood carries it back to your lungs, and you breathe it out.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n alt" for="st10-1">Back</label><label class="pk-n" for="st10-3">Next step →</label></div></div>
<div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #39E58C">THE FUEL</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">Glucose starts it all</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">The food you eat supplies the loaded electrons. Glucose is the original electron donor; oxygen is the last acceptor<sup class="cit"><a href="#fref-1">1</a>,<a href="#fref-2">2</a></sup>.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n alt" for="st10-2">Back</label><label class="pk-n alt" for="st10-1">Start again</label></div></div></div>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 14px; min-width: 0">
<div style="display: flex; flex-direction: column; gap: 6px; padding: 16px 18px; border-radius: 14px; background: rgba(255,255,255,0.03); border: 1px solid #FF6B8F55"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #FF6B8F">THIS IS LITERALLY WHY WE BREATHE</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Every breath in brings oxygen to be the landing pad at the end of the chain. Every breath out carries away the carbons of glucose as CO₂<sup class="cit"><a href="#fref-2">2</a></sup>. Breathing is the outside view of cellular respiration.</span></div><div style="display: flex; flex-direction: column; gap: 6px; padding: 16px 18px; border-radius: 14px; background: rgba(255,194,61,0.06); border: 1px solid #FFC23D55"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #FFC23D">THINK ABOUT IT</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Glucose's electrons start in even C–H bonds, far from a strong pull, and end in O–H bonds in water, as close to oxygen as they can get. The whole trip is one long, controlled snap.</span></div>
</div>
</div>
</section>
<div style="display: flex; gap: 14px; align-items: center; padding: 14px 18px; margin-inline: clamp(0px, 3vw, 28px); border-radius: 14px; background: #0A101D; border: 1px dashed #FF6B8F88"><svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true" style="flex: none"><circle cx="22" cy="22" r="20" fill="#FF6B8F1F" stroke="#FF6B8F" stroke-width="2"></circle><path d="M15 17 a7 7 0 1 1 9 6.7 c-1.6 .6 -2 1.6 -2 3.3" fill="none" stroke="#FF6B8F" stroke-width="2.6" stroke-linecap="round"></path><circle cx="22" cy="32" r="1.9" fill="#FF6B8F"></circle></svg><div style="display: flex; flex-direction: column; gap: 4px; min-width: 0"><span style="font-size: 14.5px; line-height: 1.5; color: #93A2BC"><b style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #93A2BC">SO FAR </b>Oxygen is the landing pad. That is why we breathe.</span><span style="font-size: 16px; line-height: 1.45; color: #E8EEF8"><b style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #FF6B8F">NOW WHAT? </b>So what happens if it is not there?</span></div></div>
<section id="fc-jam" style="display: flex; flex-direction: column; gap: 18px; padding: 26px; border-radius: 22px; background: #0B1120; border: 1px solid #22304A; scroll-margin-top: 96px">
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #FF6B8F">STEP 19 · WHAT IF WE REMOVE O₂?</span>
<h2 style="margin: 0; font-family: 'Unbounded', 'Atkinson Hyperlegible', sans-serif; font-weight: 800; font-size: clamp(22px, 4.6vw, 30px); line-height: 1.15; letter-spacing: -0.03em">The electron traffic jam</h2>
<p style="margin: 0; font-size: 16px; line-height: 1.6; color: #C9D3E4; max-width: 46em">Oxygen is the landing pad. Take it away and see what backs up.</p>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(420px, 100%), 1fr)); gap: 18px; align-items: start">
<div style="display: flex; flex-direction: column; gap: 12px; min-width: 0; padding: 20px; border-radius: 16px; background: #0E1524; border: 1px solid #22304A">
<span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #93A2BC">INTERACTIVE · TAP NEXT STEP</span>
<h3 id="fc-jam--c1" style="margin: 0; font-weight: 700; font-size: 19px; line-height: 1.3">The chain with and without oxygen</h3>
<div class="pk step" id="st11"><input class="pk-r" type="radio" name="st11" id="st11-1" aria-label="1 · With O₂"><input class="pk-r" type="radio" name="st11" id="st11-2" aria-label="2 · Remove O₂"><input class="pk-r" type="radio" name="st11" id="st11-3" aria-label="3 · The backup"><input class="pk-r" type="radio" name="st11" id="st11-4" aria-label="4 · Fermentation">
<span class="pk-hint"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11V5a1.6 1.6 0 0 1 3.2 0v5"></path><path d="M12.2 10V8.4a1.6 1.6 0 0 1 3.2 0V11"></path><path d="M15.4 11v-.6a1.6 1.6 0 0 1 3.2 0V15a6 6 0 0 1-6 6h-1.2a5.6 5.6 0 0 1-4.6-2.4L4 14.6a1.6 1.6 0 0 1 2.6-1.8L9 15"></path></svg>Tap the buttons, or Next step, to click through all 4</span>
<div class="pk-bar"><label class="pk-l l1" for="st11-1" style="color: #FFC23D"><span>1 · With O₂</span></label><label class="pk-l l2" for="st11-2" style="color: #FF6B8F"><span>2 · Remove O₂</span></label><label class="pk-l l3" for="st11-3" style="color: #6E9BFF"><span>3 · The backup</span></label><label class="pk-l l4" for="st11-4" style="color: #39E58C"><span>4 · Fermentation</span></label></div>
<div class="pk-fig">

2.5%; top: 80.0%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #6E9BFF; white-space: nowrap; text-align: center; pointer-events: none">NADH piling up</span><span class="s s3" style="position: absolute; left: 23.8%; top: 93.3%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #FF6B8F; white-space: nowrap; text-align: center; pointer-events: none">no NAD⁺ left: stalls</span><span class="s s4" style="position: absolute; left: 23.8%; top: 68.6%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #39E58C; white-space: nowrap; text-align: center; pointer-events: none">glycolysis: 2 ATP</span><span class="s s4" style="position: absolute; left: 76.2%; top: 68.6%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #FFC23D; white-space: nowrap; text-align: center; pointer-events: none">pyruvate → lactic acid</span><span class="s s4" style="position: absolute; left: 50.0%; top: 60.0%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #FFC23D; white-space: nowrap; text-align: center; pointer-events: none">NADH</span><span class="s s4" style="position: absolute; left: 50.0%; top: 83.8%; transform: translate(-50%, -50%); font-size: clamp(8.5px, 2.6vw, 11.5px); line-height: 1.2; font-weight: 700; color: #6E9BFF; white-space: nowrap; text-align: center; pointer-events: none">NAD⁺ back</span>

<div class="pk-panels"><div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #FFC23D">NORMAL</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">Traffic flowing</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">With oxygen at the end, electrons keep moving down the chain, protons keep being pumped, and ATP synthase keeps turning.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n" for="st11-2">Next step →</label></div></div>
<div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #FF6B8F">NO LANDING PAD</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">The electron traffic jam</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Take oxygen away and Complex IV has nowhere to put its electrons. It stays loaded. Then Complex III cannot hand off, then Q, then Complex I. The whole chain backs up<sup class="cit"><a href="#fref-1">1</a></sup>.</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">No electron flow means no proton pumping, so ATP synthase stops.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n alt" for="st11-1">Back</label><label class="pk-n" for="st11-3">Next step →</label></div></div>
<div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #6E9BFF">THE BACKUP</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">No NAD⁺ comes back</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">NADH can only unload at the chain. With the chain jammed, NADH piles up and the cell runs out of empty NAD⁺. Glycolysis needs NAD⁺, so even glycolysis would stall<sup class="cit"><a href="#fref-1">1</a>,<a href="#fref-2">2</a></sup>.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n alt" for="st11-2">Back</label><label class="pk-n" for="st11-4">Next step →</label></div></div>
<div class="pk-p"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #39E58C">PLAN B</span><span style="font-weight: 700; font-size: 18px; line-height: 1.3">Fermentation keeps glycolysis going</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">In fermentation, pyruvate takes the electrons from NADH. In animals and many bacteria it becomes lactic acid; yeast make ethanol and CO₂. NAD⁺ is freed to go back to glycolysis<sup class="cit"><a href="#fref-1">1</a>,<a href="#fref-2">2</a></sup>.</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">It works, but it pays only the <b>2 ATP</b> of glycolysis, against about 32 with oxygen<sup class="cit"><a href="#fref-1">1</a>,<a href="#fref-2">2</a></sup>. Lactic acid still holds most of the energy.</span><div style="display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px"><label class="pk-n alt" for="st11-3">Back</label><label class="pk-n alt" for="st11-1">Start again</label></div></div></div>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 14px; min-width: 0">
<div style="display: flex; flex-direction: column; gap: 6px; padding: 16px 18px; border-radius: 14px; background: rgba(255,255,255,0.03); border: 1px solid #FF6B8F55"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #FF6B8F">THE DYSFUNCTION, THEN THE DEATH</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Fermentation buys time, not enough for every cell. Without ATP, the pumps and machines that keep a cell alive stop, and the cell dies. A poison that blocks the chain causes the same jam<sup class="cit"><a href="#fref-1">1</a></sup>. Cyanide does exactly this: it blocks Complex IV, so even with plenty of oxygen the electrons can't land.</span></div><div style="display: flex; flex-direction: column; gap: 6px; padding: 16px 18px; border-radius: 14px; background: rgba(94,208,230,0.06); border: 1px solid #5ED0E655"><span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #5ED0E6">ADDED FROM OUTSIDE THE COURSE MATERIALS</span><span style="font-size: 15px; line-height: 1.55; color: #C9D3E4">Cyanide blocking Complex IV is general biology, not from the slides. The slides ask what a poison that blocks the chain would do.</span></div><details id="fc-jam--t1" style="padding: 0 14px; border-radius: 12px; background: #0E1524; border: 1px solid #22304A"><summary style="cursor: pointer; padding-block: 12px; font-weight: 700; font-size: 15px; line-height: 1.4">If the first step of the citric acid cycle were blocked, what would happen to NAD⁺?</summary><p style="margin: 0; padding-bottom: 14px; font-size: 15px; line-height: 1.55; color: #C9D3E4">NAD⁺ would pile up in its oxidized form: nothing would be loading it. That cuts off the electrons to the chain, so oxidative phosphorylation would drop<sup class="cit"><a href="#fref-1">1</a></sup>.</p></details>
</div>
</div>
</section>
<div style="display: flex; gap: 14px; align-items: center; padding: 14px 18px; margin-inline: clamp(0px, 3vw, 28px); border-radius: 14px; background: #0A101D; border: 1px dashed #FFC23D88"><svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true" style="flex: none"><circle cx="22" cy="22" r="20" fill="#FFC23D1F" stroke="#FFC23D" stroke-width="2"></circle><path d="M15 17 a7 7 0 1 1 9 6.7 c-1.6 .6 -2 1.6 -2 3.3" fill="none" stroke="#FFC23D" stroke-width="2.6" stroke-linecap="round"></path><circle cx="22" cy="32" r="1.9" fill="#FFC23D"></circle></svg><div style="display: flex; flex-direction: column; gap: 4px; min-width: 0"><span style="font-size: 14.5px; line-height: 1.5; color: #93A2BC"><b style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #93A2BC">SO FAR </b>Without oxygen the chain jams. With it, the energy gets caught.</span><span style="font-size: 16px; line-height: 1.45; color: #E8EEF8"><b style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 11px; letter-spacing: 0.12em; color: #FFC23D">NOW WHAT? </b>Caught it. Now how do we store it?</span></div></div>
