<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.KEY = 'enterlabrynth-mc-unit3-v1';
    this.mods = [
      { id: 'm1', color: '#39E58C', items: [
        ["PCR in one sentence", "Copies one specific stretch of DNA millions of times in a tube, using the rules of DNA replication."],
        ["Denature, anneal, extend", "About 95 °C to separate the strands, cooler so primers base-pair, 72 °C for Taq to extend; repeat 25 to 40 times."],
        ["What goes in the tube", "Template DNA, two DNA primers, dNTPs and Taq polymerase, all at the start."],
        ["The two keys", "Sequence information to design the primers, and a heat-stable polymerase (Taq, from Thermus aquaticus)."],
        ["Counting copies", "Copies = starting copies × 2ⁿ after n cycles (1 duplex, 5 cycles = 32)."],
        ["PCR vs. replication in a cell", "DNA primers vs. RNA primers; heat vs. helicase; no primase, topoisomerase or ligase in PCR."],
        ["Reverse transcriptase and cDNA", "RNA → DNA; cDNA from mRNA has no introns; RNA must be reverse transcribed before PCR."],
        ["Where the techniques are used", "Crime scenes, paternity, ancient DNA, diagnosing infections (RT-PCR), prenatal diagnosis, medicines."],
        ["Plasmid vectors", "A vector carries DNA into a cell; a plasmid vector needs an Ori, an antibiotic resistance gene (selectable marker) and an MCS."],
        ["Restriction enzymes and palindromes", "Cut double-stranded DNA at specific sites that read the same on both strands, 5′ → 3′."],
        ["Sticky vs. blunt ends", "EcoRI (G|AATTC) leaves AATT overhangs; EcoRV (GAT|ATC) cuts straight across."],
        ["Gel electrophoresis", "DNA is negative and moves toward +; small pieces run farther; the ladder is a ruler of known sizes."],
        ["Reading a restriction map", "Add the sizes; mark only the enzymes in the tube; walk around the circle from cut to cut."],
        ["Ligation and recombinant DNA", "Cut insert and plasmid with the same enzyme; DNA ligase seals the backbone."],
        ["Directional cloning", "Two different enzymes, one on each side of the gene; never one that cuts inside the gene or the marker."],
        ["Transformation and selection", "Make cells permeable; only a few take up the plasmid; the antibiotic kills the rest; colonies grow."],
        ["Expression vectors", "A bacterial promoter, ribosome binding site and terminator, and an intronless cDNA, so bacteria make the protein."],
        ["The breakthrough", "Human growth hormone and insulin made by E. coli, replacing hormone from cadavers and animals."]
      ]}
    ];
    let done = {};
    try {
      const raw = JSON.parse(window.localStorage.getItem(this.KEY) || '{}');
      if (raw && typeof raw === 'object' && !Array.isArray(raw)) done = raw;
    } catch (e) { done = {}; }
    this.state = { done: done };
  }
  save(done) {
    try { window.localStorage.setItem(this.KEY, JSON.stringify(done)); } catch (e) {}
  }
  toggle(k) {
    const done = Object.assign({}, this.state.done);
    if (done[k]) delete done[k]; else done[k] = true;
    this.save(done);
    this.setState({ done: done });
  }
  renderVals() {
    const done = this.state.done;
    const out = {};
    let total = 0;
    let n = 0;
    this.mods.forEach((m) => {
      let c = 0;
      const items = m.items.map((pair, i) => {
        const k = m.id + '-' + i;
        const on = !!done[k];
        total++;
        if (on) { c++; n++; }
        return {
          t: pair[0],
          d: pair[1],
          aria: on ? 'true' : 'false',
          boxBorder: on ? m.color : '#5A6C8E',
          boxBg: on ? m.color : 'transparent',
          tick: on ? '1' : '0',
          titleColor: on ? '#93A2BC' : '#E8EEF8',
          deco: on ? 'line-through' : 'none',
          toggle: () => this.toggle(k)
        };
      });
      out[m.id] = items;
      out[m.id + 'count'] = c + ' / ' + items.length + ' COVERED';
    });
    out.countText = n + ' of ' + total + ' topics covered';
    out.pct = (total ? Math.round(100 * n / total) : 0) + '%';
    out.reset = () => { this.save({}); this.setState({ done: {} }); };
    return out;
  }
}
DCLite.mount(Component);
</script>
