<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.KEY = 'enterlabrynth-ee-unit3-v1';
    this.mods = [
      { id: 'm1', color: '#39E58C', items: [
        ["Why cells divide", "Reproduction, development and growth, and repair and regeneration."],
        ["Replication vs. segregation", "Copy the DNA, then share the copies between two daughter cells."],
        ["Mitosis vs. meiosis", "2 identical daughter cells vs. 4 gametes with different DNA."],
        ["How prokaryotes and eukaryotes organize DNA", "One circular chromosome and plasmids vs. several linear chromosomes in a nucleus, plus circular DNA in mitochondria and chloroplasts."],
        ["Binary fission", "Attached DNA is copied, the cell grows, the copies move apart, the cell splits; regulated by nutrient availability."],
        ["The cell cycle", "G1, S, G2 and M; interphase is G1 + S + G2; what each chromosome looks like in each phase."],
        ["Chromosomes vs. DNA molecules", "Count centromeres for chromosomes and chromatids for DNA molecules, before and after S."],
        ["Mitosis, stage by stage", "Prophase, metaphase, anaphase, telophase, then cytokinesis; drawn with chromosomes before and after replication."],
        ["Sister chromatids vs. homologous chromosomes", "Identical copies vs. a pair from mother and father."],
        ["Genes vs. alleles", "A stretch of DNA vs. one version of it; two alleles of every gene in a diploid cell."],
        ["Haploid vs. diploid", "One set vs. two sets in homologous pairs; tell them apart from a drawing."],
        ["The human karyotype", "46 chromosomes in 23 pairs, including the sex chromosomes; reading one."],
        ["Large numbers of chromosomes", "The same counting for 64, 46 or 20 chromosomes through the cycle."],
        ["Cell division in a life cycle", "Mitosis builds the body, meiosis makes gametes, fertilization makes a zygote; every somatic cell has the same DNA."]
      ]}
    ];
    let done = {};
    try {
      const raw = JSON.parse(window.localStorage.getItem(this.KEY) || '{}');
      if (raw && typeof raw === 'object' && !Array.isArray(raw)) done = raw;
    } catch (e) { done = {}; }
    this.state = { done: done };
  }
  save(done) {
    try { window.localStorage.setItem(this.KEY, JSON.stringify(done)); } catch (e) {}
  }
  toggle(k) {
    const done = Object.assign({}, this.state.done);
    if (done[k]) delete done[k]; else done[k] = true;
    this.save(done);
    this.setState({ done: done });
  }
  renderVals() {
    const done = this.state.done;
    const out = {};
    let total = 0;
    let n = 0;
    this.mods.forEach((m) => {
      let c = 0;
      const items = m.items.map((pair, i) => {
        const k = m.id + '-' + i;
        const on = !!done[k];
        total++;
        if (on) { c++; n++; }
        return {
          t: pair[0],
          d: pair[1],
          aria: on ? 'true' : 'false',
          boxBorder: on ? m.color : '#5A6C8E',
          boxBg: on ? m.color : 'transparent',
          tick: on ? '1' : '0',
          titleColor: on ? '#93A2BC' : '#E8EEF8',
          deco: on ? 'line-through' : 'none',
          toggle: () => this.toggle(k)
        };
      });
      out[m.id] = items;
      out[m.id + 'count'] = c + ' / ' + items.length + ' COVERED';
    });
    out.countText = n + ' of ' + total + ' topics covered';
    out.pct = (total ? Math.round(100 * n / total) : 0) + '%';
    out.reset = () => { this.save({}); this.setState({ done: {} }); };
    return out;
  }
}
DCLite.mount(Component);
</script>
